<text x="40.0" y="705.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Cada caixa é um ecrã ou um passo na aplicação Altice, com o separador<tspan font-style="italic"> Things</tspan> e o assistente. Tracejado: uma variante do passo anterior.</text></svg>
