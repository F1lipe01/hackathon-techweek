<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1120" width="1300" height="1120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Sequência: o livro esquecido"><title>Sequência: o livro esquecido</title><defs><marker id="m111111" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#111111"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1300" height="1120" fill="#FFFFFF"/><line x1="190.0" y1="83.175" x2="190.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="485.0" y1="83.175" x2="485.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="775.0" y1="83.175" x2="775.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1110.0" y1="83.175" x2="1110.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="32.0" y="20.0" width="316.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="44.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Equipamento da casa</tspan></text>
<text x="44.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">visão, memória e regras</text>
<rect x="372.0" y="20.0" width="226.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="384.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Sensor da porta e</tspan><tspan font-weight="700" font-style="italic"> router</tspan></text>
<text x="384.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">em casa, ligados à Altice</text>
<rect x="622.0" y="20.0" width="306.0" height="63.2" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="634.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Plataforma Altice</tspan></text>
<text x="634.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">eventos, retransmissão, notificações</text>
<rect x="952.0" y="20.0" width="316.0" height="63.2" rx="12" fill="#FFF6EA" stroke="#C9CED6" stroke-width="1.0"/>
<text x="964.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aplicação Altice</tspan></text>
<text x="964.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">no telemóvel</text>
<rect x="12.0" y="123.2" width="1276.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="142.2" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Estado: OCUPADA (o telemóvel do dono do livro está no Wi-Fi). O livro foi visto pela última vez na secretária da Sala 1, às 18h02.</text>
<rect x="526.5" y="163.9" width="206.9" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="176.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">porta aberta (<tspan font-family="Menlo, monospace" font-size="11.2">sensorState:</tspan>&#160;<tspan font-family="Menlo, monospace" font-size="11.2">alarm</tspan>)</text>
<path d="M497.0 185.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="485.0" cy="185.375" r="11" fill="#0084D6"/>
<text x="485.0" y="189.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<rect x="356.0" y="211.9" width="253.0" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="224.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">door.opened</tspan>, em texto, pela retransmissão</text>
<path d="M763.0 233.4 H204.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="233.375" r="11" fill="#0084D6"/>
<text x="775.0" y="237.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<rect x="553.7" y="259.9" width="152.6" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="272.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">porta fechada, 8 s depois</text>
<path d="M497.0 281.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="485.0" cy="281.375" r="11" fill="#0084D6"/>
<text x="485.0" y="285.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<rect x="440.3" y="307.9" width="84.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="320.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">door.closed</tspan></text>
<path d="M763.0 329.4 H204.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="329.375" r="11" fill="#0084D6"/>
<text x="775.0" y="333.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<rect x="40.0" y="373.4" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="190.0" y="392.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">A porta abriu e fechou: OCUPADA → A SAIR.</text>
<text x="190.0" y="409.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Espera até T_saída (10 s na demonstração, 5 min</text>
<text x="190.0" y="426.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">em produção) por quem saiu</text>
<rect x="507.1" y="446.9" width="245.9" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="459.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">o telemóvel do dono do livro saiu do Wi-Fi</text>
<path d="M497.0 468.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="485.0" cy="468.375" r="11" fill="#0084D6"/>
<text x="485.0" y="472.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<rect x="350.9" y="494.9" width="263.2" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="507.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">wifi.left</tspan>: o dono do livro (evento proposto)</text>
<path d="M763.0 516.4 H204.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="516.375" r="11" fill="#0084D6"/>
<text x="775.0" y="520.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">6</tspan></text>
<rect x="40.0" y="560.4" width="300.0" height="84.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="190.0" y="579.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Saiu alguém da família: verificação ativa do lugar</text>
<text x="190.0" y="596.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">habitual do livro, sem esperar por movimento. Lê</text>
<text x="190.0" y="613.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">3 imagens da secretária, 1 por segundo, na rede</text>
<text x="190.0" y="630.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">da casa</text>
<rect x="40.0" y="668.4" width="300.0" height="84.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="190.0" y="687.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Caixas de “livro” e vetores<tspan font-style="italic"> DINOv2</tspan>, comparados</text>
<text x="190.0" y="704.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">com as 8 fotos do livro: 0,70 ≥ 0,62 em 3 de 3</text>
<text x="190.0" y="721.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">imagens. Regra “avisa-me se sair sem o livro”</text>
<text x="190.0" y="738.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">cumprida, porque bastam 2 de 3</text>
<rect x="365.0" y="758.9" width="235.0" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="771.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">aviso, só texto: “livro, secretária, 18h02”</text>
<path d="M202.0 780.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="190.0" cy="780.375" r="11" fill="#0084D6"/>
<text x="190.0" y="784.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">7</tspan></text>
<rect x="792.7" y="806.9" width="299.7" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="942.5" y="819.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">notificação: “O livro ficou em casa, na secretária, às</text>
<rect x="917.5" y="823.9" width="50.1" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="942.5" y="836.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">18h02”</text>
<path d="M787.0 845.4 H1096.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="845.375" r="11" fill="#0084D6"/>
<text x="775.0" y="849.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">8</tspan></text>
<rect x="12.0" y="889.4" width="1276.0" height="50.4" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="908.4" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Se o livro aparecer em menos de 2 das 3 imagens (meio tapado, por exemplo), o motor de regras pode chamar o juiz: um modelo de visão-linguagem opcional, no equipamento da casa, vê 2 a 3 s da região e</text>
<text x="650.0" y="926.6" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">responde sim, não ou incerto. “Sim” dá o aviso; “não” não dá; “incerto” faz a aplicação perguntar à família, sem alarme. As imagens não saem de casa.</text>
<rect x="12.0" y="965.8" width="1276.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="984.8" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Uma chegada (a porta abre e fecha e um telemóvel entra no Wi-Fi) não inicia a verificação.</text>
<rect x="12.0" y="1024.0" width="1276.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="1043.0" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Sem sensor de porta, o mesmo teste começa quando um telemóvel da família sai do Wi-Fi (passado T_telemóvel, por isso mais tarde) ou quando uma câmara que vê a porta de saída vê alguém sair por ela.</text>
<text x="20.0" y="1092.2" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Cinzento: em casa. Azul: Altice. Laranja: telemóvel. Os tempos de produção são propostas, a afinar num piloto.</text></svg>
