<text x="690.0" y="161.8" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Estado: OCUPADA. Regras ativas: “Quando não estiver ninguém, propõe desligar o que ficou ligado” e “Avisa-me se a porta ficar aberta sem ninguém por perto”.</text>
