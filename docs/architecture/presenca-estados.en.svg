<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 856" width="1640" height="856" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Presence states"><title>Presence states</title><defs><marker id="m111111" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#111111"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1640" height="856" fill="#FFFFFF"/><rect x="40.0" y="24.0" width="1560.0" height="98.6" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
<text x="56.0" y="55.2" font-size="16" font-weight="400" fill="#C2410C" text-anchor="start"><tspan font-weight="700">UNSURE</tspan></text>
<text x="56.0" y="78.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">The signals disagree: the phones are away but a camera sees a person (a stranger, a guest, or Family without a phone), or a phone is home with nobody seen and no door use for T_stale (a phone left behind?).</text>
<text x="56.0" y="102.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">In the rules: those that need certainty ask the family instead of acting; an unknown face on 3 consecutive analyses still raises the alarm.</text>
<rect x="40.0" y="272.6" width="420.0" height="216.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="56.0" y="303.8" font-size="16" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">OCCUPIED</tspan></text>
<text x="56.0" y="327.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Someone from the Family is home: a Family phone is on the Wi-Fi, or</text>
<text x="56.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">a camera saw a person in the last T_seen.</text>
<text x="56.0" y="368.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">In the rules: “empty home” rules wait; an unknown face raises the</text>
<text x="56.0" y="385.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">alarm only if the rule asks for it.</text>
<rect x="610.0" y="272.6" width="420.0" height="116.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="626.0" y="303.8" font-size="16" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">LEAVING</tspan></text>
<text x="626.0" y="327.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">The door opened and closed. For T_leave, the service checks who</text>
<text x="626.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">left: a phone that leaves the Wi-Fi, or fewer people on the cameras.</text>
<text x="626.0" y="368.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">If a Family member left, the left-behind check runs.</text>
<rect x="1180.0" y="272.6" width="420.0" height="216.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="1196.0" y="303.8" font-size="16" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">EMPTY</tspan></text>
<text x="1196.0" y="327.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">All Family phones are away, the door opened and closed, no Family</text>
<text x="1196.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">face was seen in the last T_face, and no camera sees a person, after</text>
<text x="1196.0" y="362.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">a refresh of the last places where people were.</text>
<text x="1196.0" y="385.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">In the rules: “empty home” rules act (offer to turn off what is on); a</text>
<text x="1196.0" y="403.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">person seen moves the state to UNSURE.</text>
<path d="M460.0 312.6 H600.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="472.0" y="289.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">the door opens, then</text>
<text x="472.0" y="304.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">closes</text>
<path d="M610.0 362.6 H470.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="472.0" y="380.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">after T_leave, a Family</text>
<text x="472.0" y="396.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">phone is still home</text>
<path d="M1030.0 322.6 H1170.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="1042.0" y="340.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">after T_leave, phones</text>
<text x="1042.0" y="356.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">away and nobody on</text>
<text x="1042.0" y="371.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">the cameras</text>
<path d="M1180.0 458.6 H470.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="820.0" y="450.6" font-size="12" font-weight="400" fill="#333333" text-anchor="middle">arrival: a Family phone joins the Wi-Fi, or a Family face is recognised</text>
<path d="M190.0 272.6 V132.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="40.0" y="146.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">a phone is home, but</text>
<text x="40.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">nobody seen and no</text>
<text x="40.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">door use for T_stale</text>
<path d="M250.0 122.6 V262.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="262.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">a Family phone joins the Wi-Fi, or a</text>
<text x="262.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Family face is recognised</text>
<path d="M820.0 272.6 V132.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="832.0" y="193.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">phones away, but a person is seen</text>
<path d="M1330.0 272.6 V132.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="1180.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">a person seen (unknown</text>
<text x="1180.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">face or face not visible)</text>
<path d="M1390.0 122.6 V262.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="1402.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">phones away and nobody on the</text>
<text x="1402.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">cameras, after the refresh</text>
<rect x="40.0" y="528.6" width="504.0" height="280.0" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="56.0" y="558.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Signals</tspan></text>
<text x="56.0" y="581.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Phones: the router says which Family phones are on the Wi-Fi (a proposed MCP</text>
<text x="56.0" y="599.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">tool, <tspan font-family="Menlo, monospace" font-size="11.2">get_home_wifi_clients</tspan>; simulated in the prototype).</text>
<text x="56.0" y="622.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Door: the contact sensor sends “open” and “closed” to the platform, as today.</text>
<text x="56.0" y="646.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Cameras: people found by OWLv2 and, with consent, the face label worked out in</text>
<text x="56.0" y="663.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">the home.</text>
<rect x="568.0" y="528.6" width="504.0" height="280.0" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="584.0" y="558.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Count of people</tspan></text>
<text x="584.0" y="581.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">People home = Family home (phone on the Wi-Fi, or face seen in the last T_face</text>
<text x="584.0" y="599.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">with no phone leaving since) + registered guests seen now + unknown faces seen</text>
<text x="584.0" y="616.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">now.</text>
<text x="584.0" y="640.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A person with no visible face is added only if they cannot be a Family member</text>
<text x="584.0" y="657.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">already counted; with the Family away, the state becomes UNSURE.</text>
<text x="584.0" y="681.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A room without a camera: the phones cover it. A still person: the phones and the</text>
<text x="584.0" y="698.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">periodic refresh cover them.</text>
<rect x="1096.0" y="528.6" width="504.0" height="280.0" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1112.0" y="558.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Timings: demo / production</tspan></text>
<text x="1450.0" y="584.6" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start"><tspan font-weight="700">demo</tspan></text>
<text x="1524.0" y="584.6" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start"><tspan font-weight="700">production</tspan></text>
<text x="1112.0" y="605.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_seen · a person seen counts as “now”</text>
<text x="1450.0" y="605.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">15 s</tspan></text>
<text x="1524.0" y="605.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">2 min</tspan></text>
<text x="1112.0" y="626.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_face · a Family face counts as home</text>
<text x="1450.0" y="626.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">2 min</tspan></text>
<text x="1524.0" y="626.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 min</tspan></text>
<text x="1112.0" y="647.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_leave · LEAVING waits for a leaver</text>
<text x="1450.0" y="647.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">10 s</tspan></text>
<text x="1524.0" y="647.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">5 min</tspan></text>
<text x="1112.0" y="668.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_lag · a phone leaves the Wi-Fi after the door</text>
<text x="1450.0" y="668.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 s</tspan></text>
<text x="1524.0" y="668.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">5 min</tspan></text>
<text x="1112.0" y="689.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_phone · absence that counts as away*</text>
<text x="1450.0" y="689.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">simulated</tspan></text>
<text x="1524.0" y="689.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">10 min</tspan></text>
<text x="1112.0" y="710.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_refresh · re-checks where people were</text>
<text x="1450.0" y="710.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 s</tspan></text>
<text x="1524.0" y="710.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 s</tspan></text>
<text x="1112.0" y="731.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_check · waits for the active check</text>
<text x="1450.0" y="731.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">15 s</tspan></text>
<text x="1524.0" y="731.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">60 s</tspan></text>
<text x="1112.0" y="752.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_stale · phone home with no other sign</text>
<text x="1450.0" y="752.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">15 min</tspan></text>
<text x="1524.0" y="752.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">4 h</tspan></text>
<text x="1112.0" y="778.6" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">* Outside LEAVING; in LEAVING it counts at once. The prototype’s values (presence.py);</text>
<text x="1112.0" y="794.8" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">production ones are proposals.</text>
<text x="40.0" y="838.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Runs in the ThingTracker service, at Altice: one state per home, recomputed on every event (door, Wi-Fi, vision result) and every timer.</text></svg>
