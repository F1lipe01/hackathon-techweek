<text x="54.0" y="123.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Kit cameras</tspan></text>
<text x="54.0" y="145.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system]</text>
<text x="54.0" y="168.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">RTSP, H.265</text>
<rect x="1180.0" y="96.0" width="1040.0" height="91.2" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="123.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="1194.0" y="145.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system · phone]</text>
<text x="1194.0" y="168.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Things tab, assistant, and alerts with action cards</text>
<rect x="40.0" y="283.1" width="250.0" height="313.3" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="54.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Home agent</tspan></text>
<text x="54.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[Python on the router’s CPU]</text>
<text x="54.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Masks, motion gate, cutting out the</text>
<text x="54.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">changed region</text>
<text x="54.0" y="396.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Faces with YuNet and SFace (opt-in)</text>
<text x="54.0" y="420.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Reads on the service’s request, even</text>
<text x="54.0" y="437.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">without motion</text>
<text x="54.0" y="461.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Keeps the last 3 s in memory only, for</text>
<text x="54.0" y="478.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">the judge</text>
<rect x="790.0" y="283.1" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Vision workers</tspan></text>
<text x="804.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[PyTorch, L4 GPUs]</text>
<text x="804.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">OWLv2: boxes; DINOv2: one vector per</text>
<text x="804.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">candidate</text>
<rect x="430.0" y="487.8" width="220.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="444.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Connection broker</tspan></text>
<text x="444.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[MQTT over mTLS]</text>
<text x="444.0" y="560.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">One connection per home, behind</text>
<text x="444.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">a load balancer</text>
<rect x="790.0" y="487.8" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Queues and event stream</tspan></text>
<text x="804.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[message broker]</text>
<text x="804.0" y="560.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Urgent and batch vision; each home’s</text>
<text x="804.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">events in order; model requests</text>
<rect x="1180.0" y="487.8" width="270.0" height="579.2" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2.4"/>
<text x="1194.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">ThingTracker service</tspan></text>
<text x="1194.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[stateless containers, behind a load</text>
<text x="1194.0" y="554.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">balancer]</text>
<text x="1194.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">App API and MCP host</text>
<text x="1194.0" y="601.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Matching with the fingerprints</text>
<text x="1194.0" y="625.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Tracking: in hand, taken, moved</text>
<text x="1194.0" y="648.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Presence engine and rules engine, per</text>
<text x="1194.0" y="666.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">home; the rules engine decides</text>
<text x="1194.0" y="689.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Alerts; a “Yes” becomes an MCP call</text>
<rect x="1970.0" y="487.8" width="250.0" height="108.6" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1984.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Connected Home platform</tspan></text>
<text x="1984.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system]</text>
<text x="1984.0" y="560.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">MCP server, door and Wi-Fi events,</text>
<text x="1984.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">notifications</text>
<rect x="40.0" y="692.4" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="54.0" y="720.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Face templates</tspan></text>
<text x="54.0" y="741.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[encrypted SQLite, on the router]</text>
<text x="54.0" y="765.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Up to 8 per person; never leave the</text>
<text x="54.0" y="782.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">home</text>
<rect x="790.0" y="692.4" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="720.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Cache</tspan></text>
<text x="804.0" y="741.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[Redis]</text>
<text x="804.0" y="765.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Each home’s live state: presence,</text>
<text x="804.0" y="782.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">tracks, timers</text>
<rect x="1590.0" y="692.4" width="240.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1604.0" y="720.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">PostgreSQL</tspan></text>
<text x="1604.0" y="741.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[with pgvector]</text>
<text x="1604.0" y="765.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Per customer: things, fingerprints,</text>
<text x="1604.0" y="782.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">rules, alerts, sightings</text>
<rect x="790.0" y="897.1" width="250.0" height="170.0" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="924.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Language and vision-language</tspan></text>
<text x="804.0" y="945.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">models</tspan></text>
<text x="804.0" y="966.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[GPU servers behind a queue]</text>
<text x="804.0" y="990.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Write text only: sentences into rules,</text>
<text x="804.0" y="1007.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">which the service checks, and answers;</text>
<text x="804.0" y="1025.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">they never decide</text>
<text x="804.0" y="1048.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Judge: rarely, a short clip</text>
<rect x="1590.0" y="897.1" width="240.0" height="170.0" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1604.0" y="924.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Object storage</tspan></text>
<text x="1604.0" y="946.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[S3-compatible]</text>
<text x="1604.0" y="969.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Thumbnails, 30 days (proposal)</text>
