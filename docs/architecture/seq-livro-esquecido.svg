<text x="515.0" y="540.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">6</tspan></text>
<rect x="795.0" y="580.0" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="945.0" y="599.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Saiu alguém da Família: verificação ativa do</text>
<text x="945.0" y="616.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">lugar habitual do livro, sem esperar por</text>
<text x="945.0" y="633.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">movimento</text>
<rect x="472.0" y="653.5" width="316.1" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="666.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">envia a região da secretária: 3 imagens, 1 por segundo</text>
