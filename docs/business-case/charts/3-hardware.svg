<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="675" fill="#FFF"/><text x="64.0" y="74.0" font-size="32" font-weight="700" fill="#111" text-anchor="start">Where the AI runs decides the case</text><text x="64.0" y="108.0" font-size="17" font-weight="400" fill="#4A4A4A" text-anchor="start">Money left per home per month for the €3.99 add-on, by where the local vision models run</text><text x="64.0" y="641.0" font-size="12.5" font-weight="400" fill="#767676" text-anchor="start">Box prices are rough assumptions, spread over 36 months. Small and GPU boxes: our arithmetic from the model.</text><line x1="394.0" y1="150.0" x2="394.0" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="394.0" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€7</text><line x1="467.9" y1="150.0" x2="467.9" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="467.9" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€6</text><line x1="541.8" y1="150.0" x2="541.8" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="541.8" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€5</text><line x1="615.7" y1="150.0" x2="615.7" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="615.7" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€4</text><line x1="689.6" y1="150.0" x2="689.6" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="689.6" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€3</text><line x1="763.5" y1="150.0" x2="763.5" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="763.5" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€2</text><line x1="837.4" y1="150.0" x2="837.4" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="837.4" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">−€1</text><line x1="911.3" y1="150.0" x2="911.3" y2="520.0" stroke="#9AA3AF" stroke-width="1"/><text x="911.3" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">€0</text><line x1="985.2" y1="150.0" x2="985.2" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="985.2" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">€1</text><line x1="1059.1" y1="150.0" x2="1059.1" y2="520.0" stroke="#E4E7EC" stroke-width="1"/><text x="1059.1" y="548.0" font-size="14" font-weight="400" fill="#767676" text-anchor="middle">€2</text><text x="64.0" y="190.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">On hardware already in the home</text><text x="64.0" y="214.0" font-size="15" font-weight="400" fill="#767676" text-anchor="start">router, gateway or camera</text><path d="M911.2631578947368 174 H1035.6552631578948 Q1039.6552631578948 174 1039.6552631578948 178 V200 Q1039.6552631578948 204 1035.6552631578948 204 H911.2631578947368 Z" fill="#0084D6"/><text x="1051.7" y="196.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">+€1.74</text><text x="64.0" y="305.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">On a small box per home</text><text x="64.0" y="329.0" font-size="15" font-weight="400" fill="#767676" text-anchor="start">≈ €100, over 3 years</text><path d="M911.2631578947368 289 H838.3904631578946 Q834.3904631578946 289 834.3904631578946 293 V315 Q834.3904631578946 319 838.3904631578946 319 H911.2631578947368 Z" fill="#E8710A"/><text x="822.4" y="311.0" font-size="18" font-weight="700" fill="#111" text-anchor="end">−€1.04</text><text x="64.0" y="420.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">On a GPU box per home</text><text x="64.0" y="444.0" font-size="15" font-weight="400" fill="#767676" text-anchor="start">≈ €300, over 3 years</text><path d="M911.2631578947368 404 H427.86825263157897 Q423.86825263157897 404 423.86825263157897 408 V430 Q423.86825263157897 434 427.86825263157897 434 H911.2631578947368 Z" fill="#E8710A"/><text x="411.9" y="426.0" font-size="18" font-weight="700" fill="#111" text-anchor="end">−€6.60</text><text x="911.3" y="140.0" font-size="14" font-weight="400" fill="#767676" text-anchor="end">loses money  ←</text><text x="917.3" y="140.0" font-size="14" font-weight="400" fill="#767676" text-anchor="start">→  makes money</text></svg>