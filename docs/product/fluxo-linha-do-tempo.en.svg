<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1192" width="1200" height="1192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="The home timeline, from an unusual event to an export"><title>The home timeline, from an unusual event to an export</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1192" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1180" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="444.0" y1="84" x2="444.0" y2="1180" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="756.0" y1="84" x2="756.0" y2="1180" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1180" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="10" y="118.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="139.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">4:02, the night the neighbour’s house is burgled</text><rect x="848.0" y="174.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="196.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Movement and barking at Entrance 1, at an hour</text><text x="1018.0" y="214.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">when there almost never is any: unusual event</text><rect x="518.1" y="248.0" width="475.9" height="17" fill="#FFF"/><text x="756.0" y="261.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">unusual event: type, time, camera and a crop of Bobi; the sound is not recorded</text><line x1="1063.0" y1="274.0" x2="459.0" y2="274.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="274.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="300.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="322.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Goes into the timeline as</text><text x="444.0" y="340.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“information”: it wakes no one</text><rect x="10" y="374.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="395.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">In the morning, the neighbour tells what happened</text><rect x="204.8" y="430.0" width="166.4" height="17" fill="#FFF"/><text x="288.0" y="443.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“What happened at 4:00?”</text><line x1="137.0" y1="456.0" x2="429.0" y2="456.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="456.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="482.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="504.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">The code turns the question into a</text><text x="444.0" y="522.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">search: 3:45 to 4:15, every camera</text><rect x="663.5" y="556.0" width="185.0" height="17" fill="#FFF"/><text x="756.0" y="569.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">get_home_timeline, 3:45 to 4:15</text><line x1="449.0" y1="582.0" x2="1053.0" y2="582.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="582.0" r="4.5" fill="#0084D6"/><rect x="653.1" y="608.0" width="205.9" height="17" fill="#FFF"/><text x="756.0" y="621.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the events, as text, and the crops</text><line x1="1063.0" y1="634.0" x2="459.0" y2="634.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="634.0" r="4.5" fill="#0084D6"/><rect x="526.8" y="660.0" width="146.4" height="17" fill="#FFF"/><text x="600.0" y="673.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the events’ lines of text</text><line x1="449.0" y1="686.0" x2="741.0" y2="686.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="686.0" r="4.5" fill="#0084D6"/><rect x="512.5" y="712.0" width="175.0" height="17" fill="#FFF"/><text x="600.0" y="725.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">summary: “Bobi barked and</text><rect x="504.0" y="729.0" width="191.9" height="17" fill="#FFF"/><text x="600.0" y="742.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">moved at the entrance at 4:02”</text><line x1="751.0" y1="755.0" x2="459.0" y2="755.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="755.0" r="4.5" fill="#0084D6"/><rect x="158.6" y="781.0" width="258.9" height="17" fill="#FFF"/><text x="288.0" y="794.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the summary, with the crops and the times</text><line x1="439.0" y1="807.0" x2="147.0" y2="807.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="807.0" r="4.5" fill="#0084D6"/><rect x="12.0" y="833.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="182.0" y="855.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Pins the event, kept up to a year, and</text><text x="182.0" y="873.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">shares only the time with the neighbour</text><rect x="150.5" y="907.0" width="274.9" height="17" fill="#FFF"/><text x="288.0" y="920.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Export for the police”, confirmed by an adult</text><line x1="137.0" y1="933.0" x2="429.0" y2="933.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="933.0" r="4.5" fill="#0084D6"/><rect x="666.0" y="959.0" width="180.1" height="17" fill="#FFF"/><text x="756.0" y="972.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">fetch the event’s original files</text><line x1="449.0" y1="985.0" x2="1053.0" y2="985.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="985.0" r="4.5" fill="#0084D6"/><rect x="589.5" y="1011.0" width="333.0" height="17" fill="#FFF"/><text x="756.0" y="1024.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">crops, cryptographic hashes and the device’s signature</text><line x1="1063.0" y1="1037.0" x2="459.0" y2="1037.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1037.0" r="4.5" fill="#0084D6"/><rect x="200.4" y="1063.0" width="175.3" height="17" fill="#FFF"/><text x="288.0" y="1076.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">package: PDF and verifiable</text><rect x="211.0" y="1080.0" width="154.1" height="17" fill="#FFF"/><text x="288.0" y="1093.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">files, link valid for 7 days</text><line x1="439.0" y1="1106.0" x2="147.0" y2="1106.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1106.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="1132.0" width="340.0" height="34" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="1154.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Audit log: who exported what, and when</text><rect x="22.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">App</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">the family's phone</text><rect x="334.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="444.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">ThingTracker service</text><text x="444.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Altice platform</text><rect x="646.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="756.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Language model</text><text x="756.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">provider under contract</text><rect x="958.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Edge service</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">in the home, by the camera</text></svg>
