<text x="1852.0" y="615.1" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">shows</text>
<path d="M1827.0 642.1 V590.1" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1818.0" y="615.1" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">uses</text>
<text x="40.0" y="755.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Blue: flows that cross a trust boundary, described in the table. An external language model (the customer’s own ChatGPT or Claude, text only) is a possible future opt-in, not included.</text>
<rect x="40.0" y="791.2" width="1930.0" height="28.8" rx="4" fill="#EEF1F6"/>
<text x="48.0" y="810.0" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Flow</tspan></text>
<text x="118.0" y="810.0" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">From → to</tspan></text>
<text x="498.0" y="810.0" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">What it carries</tspan></text>
<text x="1598.0" y="810.0" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Protection</tspan></text>
<line x1="40" y1="820.0" x2="1970" y2="820.0" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="838.8" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F1</tspan></text>
<text x="118.0" y="838.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">home device → relay (home → Altice)</text>
<text x="498.0" y="838.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Text only: structured events (“book, desk, 18:02”), alerts (title, message, action cards), labels (the person’s name or “unknown”) and the rules’ state. Never images, video, fingerprints or face templates</text>
<text x="1598.0" y="838.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">mTLS, one certificate per home</text>
<line x1="40" y1="848.8" x2="1970" y2="848.8" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="867.6" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F2</tspan></text>
<text x="118.0" y="867.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">relay → home device (Altice → home)</text>
<text x="498.0" y="867.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Door and Wi-Fi events, app requests (sentences, questions, “Yes”), commands; the registration photos, encrypted end to end, which Altice cannot read</text>
<text x="1598.0" y="867.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">mTLS; end-to-end encryption for photos</text>
<line x1="40" y1="877.6" x2="1970" y2="877.6" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="896.4" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F3</tspan></text>
<text x="118.0" y="896.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">router → platform (home → Altice)</text>
<text x="498.0" y="896.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Which family phones are on the Wi-Fi, and when they join or leave (proposed MCP tool)</text>
<text x="1598.0" y="896.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Altice’s router management channel (to confirm)</text>
<line x1="40" y1="906.4" x2="1970" y2="906.4" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="925.2" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F4</tspan></text>
<text x="118.0" y="925.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">door sensor → platform (home → Altice)</text>
<text x="498.0" y="925.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Door open or closed, as today</text>
<text x="1598.0" y="925.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">The hub’s channel (LTE), as today</text>
<line x1="40" y1="935.2" x2="1970" y2="935.2" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="954.0" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F5</tspan></text>
<text x="118.0" y="954.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">platform → actuators (Altice → home)</text>
<text x="498.0" y="954.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Commands after a “Yes”: light, plug, siren</text>
<text x="1598.0" y="954.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">As today</text>
<line x1="40" y1="964.0" x2="1970" y2="964.0" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="982.8" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F6</tspan></text>
<text x="118.0" y="982.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">app → service (phone → Altice)</text>
<text x="498.0" y="982.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Sentences, questions, “Yes”; passed on to the home through F2</text>
<text x="1598.0" y="982.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">HTTPS, with the Altice app’s session</text>
<line x1="40" y1="992.8" x2="1970" y2="992.8" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="1011.6" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F7</tspan></text>
<text x="118.0" y="1011.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">service → app (Altice → phone)</text>
<text x="498.0" y="1011.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Answers and the list of things, as text</text>
<text x="1598.0" y="1011.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">HTTPS</text>
<line x1="40" y1="1021.6" x2="1970" y2="1021.6" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="1040.4" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F8</tspan></text>
<text x="118.0" y="1040.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">app → home device</text>
<text x="498.0" y="1040.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Registration photos: directly on the home Wi-Fi, or through the relay, encrypted end to end. The home device builds the fingerprint</text>
<text x="1598.0" y="1040.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">End-to-end encryption</text>
<line x1="40" y1="1050.4" x2="1970" y2="1050.4" stroke="#E1E4E8" stroke-width="1"/>
<text x="48.0" y="1069.2" font-size="12" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">F9</tspan></text>
<text x="118.0" y="1069.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">notifications → app (Altice → phone)</text>
<text x="498.0" y="1069.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Alerts as text: title, message, action cards</text>
<text x="1598.0" y="1069.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">The app’s notification service</text>
<line x1="40" y1="1079.2" x2="1970" y2="1079.2" stroke="#E1E4E8" stroke-width="1"/>
<text x="40.0" y="1109.2" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Never cross the home boundary: images, video, fingerprints and face templates. Method: a data-flow diagram with trust boundaries, as in the Microsoft SDL and OWASP threat modelling.</text></svg>
