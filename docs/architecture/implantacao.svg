<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 1042" width="2040" height="1042" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Implantação do ThingTracker"><title>Implantação do ThingTracker</title><defs><marker id="m0084D6" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#0084D6"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="2040" height="1042" fill="#FFFFFF"/><rect x="20.0" y="20.0" width="940.0" height="802.1" rx="18" fill="#F4F4F4"/>
<text x="40.0" y="50.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Em casa</tspan></text>
<text x="40.0" y="70.0" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Toda a perceção e inferência</text>
<rect x="1040.0" y="20.0" width="690.0" height="802.1" rx="18" fill="#EEF3FB"/>
<text x="1060.0" y="50.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice · só texto</tspan></text>
<text x="1060.0" y="70.0" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Contas, metadados, eventos, notificações, ações</text>
<rect x="1800.0" y="20.0" width="220.0" height="802.1" rx="18" fill="#FFF6EA"/>
<text x="1820.0" y="50.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Telemóvel</tspan></text>
<rect x="434.0" y="108.0" width="502.0" height="366.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="448.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Equipamento da casa</tspan></text>
<text x="448.0" y="157.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">O<tspan font-style="italic"> router</tspan>, se tiver NPU, ou uma caixa dedicada:<tspan font-style="italic"> Raspberry Pi 5</tspan> com acelerador de</text>
<text x="448.0" y="174.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">IA, ou<tspan font-style="italic"> Jetson Orin Nano Super</tspan></text>
<text x="448.0" y="198.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Recebe o vídeo das câmaras na rede da casa</text>
<text x="448.0" y="221.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Filtro de movimento: imagem cinzenta de 160 × 90, a cada 0,5 s; só analisa quando</text>
<text x="448.0" y="239.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">há movimento ou um pedido</text>
<text x="448.0" y="262.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Visão: deteção e reidentificação com a assinatura visual (≥ 0,62).<tspan font-style="italic"> OWLv2</tspan> +<tspan font-style="italic"> DINOv2</tspan></text>
<text x="448.0" y="280.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">no protótipo; detetores mais leves, como o<tspan font-style="italic"> YOLOv8n</tspan>, em equipamentos pequenos</text>
<text x="448.0" y="303.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Rostos (opcional, com consentimento):<tspan font-style="italic"> YuNet</tspan> encontra,<tspan font-style="italic"> SFace</tspan> compara; os padrões</text>
<text x="448.0" y="321.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">ficam no equipamento</text>
<text x="448.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Memória local: onde e quando cada objeto foi visto</text>
<text x="448.0" y="368.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Motor de presença e motor de regras: o motor de regras decide</text>
<text x="448.0" y="391.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Modelo de linguagem (<tspan font-style="italic">Qwen3-1.7B</tspan> no protótipo): frase em regra, pergunta em</text>
<text x="448.0" y="409.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">resposta; nunca decide</text>
<text x="448.0" y="432.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Constrói a assinatura visual a partir das fotografias de registo</text>
<text x="448.0" y="456.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Imagens, vídeo, assinaturas visuais e padrões faciais nunca saem daqui</text>
<rect x="44.0" y="108.0" width="300.0" height="110.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="58.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Câmaras do kit</tspan></text>
<text x="58.0" y="159.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start"><tspan font-style="italic">Tuya SC034-WNV3</tspan> · H.265 · 2304 × 1296 ·</text>
<text x="58.0" y="176.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">20 fps</text>
<text x="58.0" y="200.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Vídeo por RTSP só na rede da casa</text>
<rect x="434.0" y="498.6" width="502.0" height="69.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="448.0" y="526.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Central de segurança e sensor da porta</tspan></text>
<text x="448.0" y="549.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start"><tspan font-style="italic">MS-WES1AS</tspan> (LTE) e<tspan font-style="italic"> MS-D3D</tspan>; comunicam com a plataforma Altice, como hoje</text>
<rect x="434.0" y="586.3" width="502.0" height="69.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="448.0" y="614.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700" font-style="italic">Router</tspan><tspan font-weight="700"> Altice · Wi-Fi</tspan></text>
<text x="448.0" y="637.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Sabe que telemóveis da família estão ligados</text>
<rect x="1064.0" y="108.0" width="260.0" height="190.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1078.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Retransmissão e mediador</tspan></text>
<text x="1078.0" y="157.3" font-size="12.5" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">MQTT sobre mTLS</tspan></text>
<text x="1078.0" y="180.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Uma ligação de saída por casa, atrás de</text>
<text x="1078.0" y="198.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">um balanceador</text>
<text x="1078.0" y="221.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Leva a aplicação até casa quando a</text>
<text x="1078.0" y="239.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">família está fora</text>
<text x="1078.0" y="262.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">As fotografias de registo passam cifradas</text>
<text x="1078.0" y="280.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">de ponta a ponta: a Altice não as lê</text>
<rect x="1064.0" y="498.6" width="260.0" height="157.3" rx="12" fill="#F7F7F7" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1078.0" y="526.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Plataforma</tspan><tspan font-weight="700" font-style="italic"> Connected Home</tspan></text>
<text x="1078.0" y="546.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">(existente)</tspan></text>
<text x="1078.0" y="570.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Dispositivos, cenários e segurança;</text>
<text x="1078.0" y="587.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">servidor MCP com 18 ferramentas</text>
<text x="1078.0" y="611.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Pedidos à Altice: eventos do Wi-Fi e a</text>
<text x="1078.0" y="628.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">ferramenta de presença no Wi-Fi</text>
<rect x="1424.0" y="108.0" width="282.0" height="547.9" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="1438.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Serviço</tspan><tspan font-weight="700" font-style="italic"> ThingTracker</tspan></text>
<text x="1438.0" y="157.3" font-size="12.5" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">só texto</tspan></text>
<text x="1438.0" y="180.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Contas, identidade e permissões da família</text>
<text x="1438.0" y="204.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Registo de eventos em texto (“livro,</text>
<text x="1438.0" y="221.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">secretária, 18h02”)</text>
<text x="1438.0" y="245.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Notificações para a aplicação, pelo serviço</text>
<text x="1438.0" y="262.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">que ela já usa</text>
<text x="1438.0" y="286.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Um “Sim” vira uma ação pelo MCP</text>
<rect x="1424.0" y="673.9" width="282.0" height="122.2" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1438.0" y="701.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">PostgreSQL · metadados</tspan></text>
<text x="1438.0" y="725.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Objetos, pessoas (só nomes), donos e</text>
<text x="1438.0" y="742.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">cenários: cópia de segurança, sincronização</text>
<text x="1438.0" y="760.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">entre telemóveis e reposição se a caixa for</text>
<text x="1438.0" y="777.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">trocada</text>
<rect x="1820.0" y="108.0" width="180.0" height="688.1" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1834.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aplicação Altice</tspan></text>
<text x="1834.0" y="159.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Separador<tspan font-style="italic"> Things</tspan> e</text>
<text x="1834.0" y="176.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">assistente</text>
<text x="1834.0" y="200.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Avisos com cartões de</text>
<text x="1834.0" y="217.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">ação</text>
<text x="1834.0" y="241.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Fotografias de registo:</text>
<text x="1834.0" y="258.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">para o equipamento da</text>
<text x="1834.0" y="276.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">casa, no Wi-Fi ou cifradas</text>
<text x="1834.0" y="293.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">pela retransmissão</text>
<text x="1834.0" y="317.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Vídeo em direto, como</text>
<text x="1834.0" y="334.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">hoje, fora do<tspan font-style="italic"> ThingTracker</tspan></text>
<path d="M344.0 163.3 H424.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="352.0" y="141.0" font-size="11" font-weight="400" fill="#333333" text-anchor="start">vídeo, só em</text>
<text x="352.0" y="155.3" font-size="11" font-weight="400" fill="#333333" text-anchor="start">casa</text>
<path d="M936.0 148.0 H1054.0" fill="none" stroke="#0084D6" stroke-width="2" marker-end="url(#m0084D6)"/>
<text x="944.0" y="125.0" font-size="11.5" font-weight="700" fill="#0084D6" text-anchor="start"><tspan font-weight="700">só texto: eventos,</tspan></text>
<text x="944.0" y="140.0" font-size="11.5" font-weight="700" fill="#0084D6" text-anchor="start"><tspan font-weight="700">avisos</tspan></text>
<path d="M1064.0 268.6 H946.0" fill="none" stroke="#0084D6" stroke-width="2" marker-end="url(#m0084D6)"/>
<text x="944.0" y="285.6" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">pedidos, comandos,</text>
<text x="944.0" y="300.6" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">fotografias cifradas</text>
<path d="M936.0 533.5 H1054.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="944.0" y="525.5" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">porta, como hoje</text>
<path d="M936.0 621.1 H1054.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="944.0" y="613.1" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">telemóveis no Wi-Fi</text>
<path d="M1324.0 158.0 H1414.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="150.0" font-size="11" font-weight="400" fill="#333333" text-anchor="start">eventos, avisos</text>
<path d="M1424.0 258.6 H1334.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="274.6" font-size="11" font-weight="400" fill="#333333" text-anchor="start">pedidos da</text>
<text x="1331.0" y="288.9" font-size="11" font-weight="400" fill="#333333" text-anchor="start">aplicação</text>
<path d="M1324.0 548.6 H1414.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="540.6" font-size="11" font-weight="400" fill="#333333" text-anchor="start">porta, Wi-Fi</text>
<path d="M1424.0 625.9 H1334.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="641.9" font-size="11" font-weight="400" fill="#333333" text-anchor="start">ações MCP após</text>
<text x="1331.0" y="656.2" font-size="11" font-weight="400" fill="#333333" text-anchor="start">“Sim”</text>
<path d="M1820.0 168.0 H1716.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1714.0" y="145.7" font-size="11" font-weight="400" fill="#333333" text-anchor="start">frases, perguntas,</text>
<text x="1714.0" y="160.0" font-size="11" font-weight="400" fill="#333333" text-anchor="start">“Sim”</text>
<path d="M1706.0 595.9 H1810.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1714.0" y="573.6" font-size="11" font-weight="400" fill="#333333" text-anchor="start">respostas, avisos</text>
<text x="1714.0" y="587.9" font-size="11" font-weight="400" fill="#333333" text-anchor="start">(<tspan font-style="italic">push</tspan>)</text>
<rect x="20.0" y="852.1" width="650.7" height="132.2" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.5"/>
<text x="36.0" y="881.9" font-size="14.5" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">Custos do desenho escolhido (estimativas da equipa, 20 nov.)</tspan></text>
<text x="36.0" y="905.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Equipamento, comprado uma vez: câmara interior ≈ 45 €;<tspan font-style="italic"> Raspberry Pi 5</tspan> ≈ 200 €;<tspan font-style="italic"> Jetson Orin Nano Super</tspan> ≈</text>
<text x="36.0" y="922.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">345 €; ou<tspan font-style="italic"> router</tspan> com NPU, + 15 € (estimativa). Em 5 anos, 3,33 ou 5,75 € por mês pelo equipamento.</text>
<text x="36.0" y="946.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Energia dos modelos:<tspan font-style="italic"> YOLOv8n</tspan> abaixo de 0,01 € por mês;<tspan font-style="italic"> OWLv2</tspan> até 0,72 € com 12 h de movimento por dia</text>
<text x="36.0" y="963.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">(num<tspan font-style="italic"> Jetson Orin Nano</tspan>).</text>
<rect x="694.7" y="852.1" width="650.7" height="132.2" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.5"/>
<text x="710.7" y="881.9" font-size="14.5" font-weight="400" fill="#C2410C" text-anchor="start"><tspan font-weight="700">Alternativa avaliada, não escolhida: visão nos servidores L4 da Altice</tspan></text>
<text x="710.7" y="905.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Regiões da imagem enviadas para GPU L4 da Altice: ≈ 0,49 € por casa e por mês com 1 câmara (documento</text>
<text x="710.7" y="922.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">17).</text>
<text x="710.7" y="946.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Não escolhida: as imagens sairiam de casa.</text>
<rect x="1369.3" y="852.1" width="650.7" height="132.2" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.5"/>
<text x="1385.3" y="881.9" font-size="14.5" font-weight="400" fill="#C2410C" text-anchor="start"><tspan font-weight="700">Rejeitada: vídeo ou imagens completas para a nuvem</tspan></text>
<text x="1385.3" y="905.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Vídeo contínuo a 2 Mbps (pressuposto): 657 GB por câmara e por mês e 1 000 Gbps no pico com 500 000</text>
<text x="1385.3" y="922.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">câmaras. Imagens completas durante o movimento: 2,41 € por casa e por mês nos servidores da Altice e 3,93</text>
<text x="1385.3" y="940.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">a 4,26 € em GPU de<tspan font-style="italic"> hyperscalers</tspan>, a pedido (documento 17).</text>
<text x="1385.3" y="963.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Toda a imagem da casa sairia de casa.</text>
<text x="20.0" y="1014.2" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Uma caixa paga pela Altice não se paga a 3,99 € por mês (−4,81 a −6,90 € por casa e por mês, documento 17): o modelo funciona com a IA no<tspan font-style="italic"> router</tspan> ou com equipamento comprado pelo cliente.</text></svg>
