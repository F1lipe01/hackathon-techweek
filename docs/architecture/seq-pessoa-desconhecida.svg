<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 917" width="1350" height="917" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Sequência: pessoa desconhecida"><title>Sequência: pessoa desconhecida</title><defs><marker id="m111111" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#111111"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1350" height="917" fill="#FFFFFF"/><line x1="150.0" y1="83.175" x2="150.0" y2="862.775" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="460.0" y1="83.175" x2="460.0" y2="862.775" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="820.0" y1="83.175" x2="820.0" y2="862.775" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1165.0" y1="83.175" x2="1165.0" y2="862.775" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="32.0" y="20.0" width="236.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="44.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Câmara</tspan></text>
<text x="44.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Sala 1, rede da casa</text>
<rect x="292.0" y="20.0" width="336.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="304.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Equipamento da casa</tspan></text>
<text x="304.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">visão, rostos com<tspan font-style="italic"> YuNet</tspan> e<tspan font-style="italic"> SFace</tspan>, regras</text>
<rect x="652.0" y="20.0" width="336.0" height="63.2" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="664.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Plataforma Altice</tspan></text>
<text x="664.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">retransmissão, notificações, servidor MCP</text>
<rect x="1012.0" y="20.0" width="306.0" height="63.2" rx="12" fill="#FFF6EA" stroke="#C9CED6" stroke-width="1.0"/>
<text x="1024.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aplicação Altice</tspan></text>
<text x="1024.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">no telemóvel</text>
<rect x="12.0" y="123.2" width="1326.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="675.0" y="142.2" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Estado: VAZIA desde as 14h10 (nenhum telemóvel da família no Wi-Fi). Regra ativa: “Toca o alarme quando entrar alguém que não seja da família”, com a escolha “perguntar primeiro”.</text>
<rect x="203.3" y="163.9" width="203.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="305.0" y="176.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">imagens RTSP, só na rede da casa</text>
<path d="M162.0 185.4 H446.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="150.0" cy="185.375" r="11" fill="#0084D6"/>
<text x="150.0" y="189.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<rect x="310.0" y="229.4" width="300.0" height="84.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="460.0" y="248.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Movimento: o detetor encontra uma pessoa.</text>
<text x="460.0" y="265.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-style="italic">YuNet</tspan> encontra o rosto dentro da sua caixa;</text>
<text x="460.0" y="282.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-style="italic">SFace</tspan> dá 0,21 contra o padrão mais parecido,</text>
<text x="460.0" y="299.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">abaixo de 0,363: “rosto desconhecido”</text>
<rect x="310.0" y="337.4" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="460.0" y="356.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">3 análises seguidas (cerca de 3 s) com o mesmo</text>
<text x="460.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">rosto desconhecido: VAZIA → INCERTA, e a regra</text>
<text x="460.0" y="390.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">cumpre-se</text>
<rect x="502.4" y="410.9" width="275.2" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="640.0" y="423.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">aviso urgente, só texto: “desconhecido, Sala 1”</text>
<path d="M472.0 432.4 H806.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="460.0" cy="432.375" r="11" fill="#0084D6"/>
<text x="460.0" y="436.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<rect x="843.6" y="458.9" width="297.7" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="992.5" y="471.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">notificação urgente no telemóvel: “Está alguém que</text>
<rect x="913.0" y="475.9" width="158.9" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="992.5" y="488.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">não é da família na Sala 1”</text>
<path d="M832.0 497.4 H1151.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="820.0" cy="497.375" r="11" fill="#0084D6"/>
<text x="820.0" y="501.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<rect x="1015.0" y="541.4" width="300.0" height="50.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="1165.0" y="560.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Cartões do aviso: “Tocar a sirene”, “Ligar à</text>
<text x="1165.0" y="577.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">polícia (112)” e “Ver em direto”</text>
<rect x="915.1" y="597.9" width="154.7" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="992.5" y="610.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“Sim” em “Tocar a sirene”</text>
<path d="M1153.0 619.4 H834.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="1165.0" cy="619.375" r="11" fill="#0084D6"/>
<text x="1165.0" y="623.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<rect x="260.7" y="645.9" width="448.6" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="485.0" y="658.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">servidor MCP, <tspan font-family="Menlo, monospace" font-size="11.2">update_device_capabilities</tspan>: <tspan font-family="Menlo, monospace" font-size="11.2">sirenSwitch</tspan> da câmara ligado</text>
<path d="M808.0 667.4 H164.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="820.0" cy="667.375" r="11" fill="#0084D6"/>
<text x="820.0" y="671.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<rect x="1015.0" y="711.4" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="1165.0" y="730.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“Ligar à polícia (112)” abre a chamada no</text>
<text x="1165.0" y="747.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">telemóvel e é a pessoa quem liga. O sistema</text>
<text x="1165.0" y="764.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">nunca marca o número</text>
<rect x="12.0" y="802.4" width="1326.0" height="50.4" rx="8" fill="#EEF1F6"/>
<text x="675.0" y="821.4" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Rosto da família (semelhança ≥ 0,363): nenhum aviso, e INCERTA → OCUPADA. Rosto não visível: a aplicação pergunta “Está alguém na Sala 1. É alguém conhecido?”, sem alarme, e só sugere o 112 se a resposta for</text>
<text x="675.0" y="839.6" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">“não”.</text>
<text x="20.0" y="888.8" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Cinzento: em casa. Azul: Altice. Laranja: telemóvel. Os tempos de produção são propostas, a afinar num piloto.</text></svg>
