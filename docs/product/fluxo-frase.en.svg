<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1343" width="1200" height="1343" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="From a sentence to rules and alerts"><title>From a sentence to rules and alerts</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1343" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1331" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="366.0" y1="84" x2="366.0" y2="1331" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="600.0" y1="84" x2="600.0" y2="1331" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="834.0" y1="84" x2="834.0" y2="1331" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1331" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="149.9" y="118.0" width="198.2" height="17" fill="#FFF"/><text x="249.0" y="131.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Tell me if the child is in danger”</text><line x1="137.0" y1="144.0" x2="351.0" y2="144.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="144.0" r="4.5" fill="#0084D6"/><rect x="387.6" y="170.0" width="190.7" height="17" fill="#FFF"/><text x="483.0" y="183.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">sentence, home profile, things,</text><rect x="384.4" y="187.0" width="197.2" height="17" fill="#FFF"/><text x="483.0" y="200.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">cameras, devices and detection</text><rect x="411.5" y="204.0" width="143.0" height="17" fill="#FFF"/><text x="483.0" y="217.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">catalogue, as text only</text><line x1="371.0" y1="230.0" x2="585.0" y2="230.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="230.0" r="4.5" fill="#0084D6"/><rect x="423.3" y="256.0" width="119.4" height="17" fill="#FFF"/><text x="483.0" y="269.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">plan: the rules and</text><rect x="416.4" y="273.0" width="133.1" height="17" fill="#FFF"/><text x="483.0" y="286.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">what it cannot watch</text><line x1="595.0" y1="299.0" x2="381.0" y2="299.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="600.0" cy="299.0" r="4.5" fill="#0084D6"/><rect x="202.2" y="325.0" width="327.6" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="366.0" y="347.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Checks every rule: detections from the catalogue,</text><text x="366.0" y="365.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">cameras and devices that exist, allowed actions</text><rect x="197.1" y="399.0" width="103.8" height="17" fill="#FFF"/><text x="249.0" y="412.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the plan in plain</text><rect x="192.1" y="416.0" width="113.9" height="17" fill="#FFF"/><text x="249.0" y="429.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">words, to confirm</text><line x1="361.0" y1="442.0" x2="147.0" y2="442.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="442.0" r="4.5" fill="#0084D6"/><rect x="12.0" y="468.0" width="292.5" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="158.2" y="490.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">The user picks the rules,</text><text x="158.2" y="508.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the hours and who is told</text><rect x="196.4" y="542.0" width="105.2" height="17" fill="#FFF"/><text x="249.0" y="555.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Turn on in trial”</text><line x1="137.0" y1="568.0" x2="351.0" y2="568.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="568.0" r="4.5" fill="#0084D6"/><rect x="459.6" y="594.0" width="280.8" height="17" fill="#FFF"/><text x="600.0" y="607.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">post_new_scenario, with the thingTracker trigger</text><line x1="371.0" y1="620.0" x2="819.0" y2="620.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="620.0" r="4.5" fill="#0084D6"/><rect x="877.1" y="646.0" width="147.8" height="17" fill="#FFF"/><text x="951.0" y="659.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">conditions and queries:</text><rect x="861.8" y="663.0" width="178.4" height="17" fill="#FFF"/><text x="951.0" y="676.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“a knife”, “a stove”, “a child”</text><line x1="839.0" y1="689.0" x2="1053.0" y2="689.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="834.0" cy="689.0" r="4.5" fill="#0084D6"/><rect x="895.5" y="715.0" width="292.5" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1041.8" y="737.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">48 h trial: logs what it would</text><text x="1041.8" y="755.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">have alerted, without alerting</text><rect x="580.2" y="789.0" width="273.5" height="17" fill="#FFF"/><text x="717.0" y="802.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">what it would have alerted, with the evidence</text><line x1="1063.0" y1="815.0" x2="381.0" y2="815.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="815.0" r="4.5" fill="#0084D6"/><rect x="181.7" y="841.0" width="134.5" height="17" fill="#FFF"/><text x="249.0" y="854.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“I would have alerted</text><rect x="181.0" y="858.0" width="136.0" height="17" fill="#FFF"/><text x="249.0" y="871.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">3 times. Was I right?”</text><line x1="361.0" y1="884.0" x2="147.0" y2="884.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="884.0" r="4.5" fill="#0084D6"/><rect x="165.9" y="910.0" width="166.1" height="17" fill="#FFF"/><text x="249.0" y="923.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the answers and “Turn on”</text><line x1="137.0" y1="936.0" x2="351.0" y2="936.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="936.0" r="4.5" fill="#0084D6"/><rect x="10" y="962.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="983.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Later, in the kitchen</text><rect x="895.5" y="1018.0" width="292.5" height="52" rx="9" fill="#FFF7EC" stroke="#E8710A" stroke-width="1.2"/><text x="1041.8" y="1040.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Rules engine: the child has</text><text x="1041.8" y="1058.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">been by the stove for 5 s</text><rect x="609.9" y="1092.0" width="214.3" height="17" fill="#FFF"/><text x="717.0" y="1105.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">rule met, with the crop of the stove</text><line x1="1063.0" y1="1118.0" x2="381.0" y2="1118.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1118.0" r="4.5" fill="#0084D6"/><rect x="494.8" y="1144.0" width="210.4" height="17" fill="#FFF"/><text x="600.0" y="1157.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">update_device_capabilities: red light</text><line x1="371.0" y1="1170.0" x2="819.0" y2="1170.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="1170.0" r="4.5" fill="#0084D6"/><rect x="155.5" y="1196.0" width="187.0" height="17" fill="#FFF"/><text x="249.0" y="1209.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">urgent alert, with the evidence</text><rect x="175.4" y="1213.0" width="147.1" height="17" fill="#FFF"/><text x="249.0" y="1226.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">and “Sound the siren?”</text><line x1="361.0" y1="1239.0" x2="147.0" y2="1239.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="1239.0" r="4.5" fill="#0084D6"/><rect x="12.0" y="1265.0" width="327.6" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="175.8" y="1287.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">No answer in 2 min: it goes to the second</text><text x="175.8" y="1305.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">contact; the siren sounds only after a “yes”</text><rect x="23.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">App</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">the family's phone</text><rect x="257.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="366.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">ThingTracker service</text><text x="366.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Altice platform</text><rect x="491.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="600.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Language model</text><text x="600.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">provider under contract</text><rect x="725.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="834.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">MCP server, scenarios</text><text x="834.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Altice platform</text><rect x="959.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Edge service</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">in the home, by the camera</text></svg>
