<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 313" width="680" height="313" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" style="white-space:pre"><rect width="680" height="313" fill="#FFFFFF"/><text x="20.0" y="38.0" font-size="19" font-weight="700" fill="#1F2328" text-anchor="start">Cerca de 19 000 casas MEO no cenário esperado</text><text x="20.0" y="60.0" font-size="12.5" font-weight="400" fill="#56606C" text-anchor="start">Das casas com banda larga fixa da MEO às casas que aderem ao serviço</text><text x="20.0" y="91.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">Casas com banda larga fixa da MEO</text><path d="M20.0 100.0H572.5Q576.5 100.0 576.5 104.0V116.0Q576.5 120.0 572.5 120.0H20.0Z" fill="#0084D6"/><text x="586.5" y="114.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">1,58 milhões</text><text x="20.0" y="149.5" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">Já usam um sistema de casa conectada (23,99 %)</text><path d="M20.0 158.5H149.5Q153.5 158.5 153.5 162.5V174.5Q153.5 178.5 149.5 178.5H20.0Z" fill="#0084D6"/><text x="163.5" y="173.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">379 mil</text><text x="20.0" y="208.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">Aderem ao serviço (5 % destas casas)</text><path d="M20.0 217.0H23.3Q26.7 217.0 26.7 220.3V233.7Q26.7 237.0 23.3 237.0H20.0Z" fill="#0084D6"/><text x="36.7" y="231.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">cerca de 19 000 casas · 1,2 % da MEO</text><text x="20.0" y="255.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">Intervalo considerado no modelo: de 2 700 a 52 000 casas</text><text x="20.0" y="283.0" font-size="10.5" font-weight="400" fill="#6B7480" text-anchor="start">Fontes: ANACOM, 4.º trimestre de 2025 [D01]; Eurostat 2024, pessoas que utilizam um sistema de casa conectada em Portugal, usado</text><text x="20.0" y="297.0" font-size="10.5" font-weight="400" fill="#6B7480" text-anchor="start">como aproximação para as casas [D02]; taxa de adesão: pressuposto da equipa, de 2 a 10 % [B22]. Resultado: [D05].</text></svg>
