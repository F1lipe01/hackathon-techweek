<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 856" width="1640" height="856" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Estados de presença"><title>Estados de presença</title><defs><marker id="m111111" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#111111"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1640" height="856" fill="#FFFFFF"/><rect x="40.0" y="24.0" width="1560.0" height="98.6" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
<text x="56.0" y="55.2" font-size="16" font-weight="400" fill="#C2410C" text-anchor="start"><tspan font-weight="700">INCERTA</tspan></text>
<text x="56.0" y="78.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Os sinais não concordam: os telemóveis estão fora mas uma câmara vê uma pessoa (um estranho, uma visita ou alguém da Família sem telemóvel), ou um telemóvel está em casa sem ninguém visto nem uso da porta há T_parado (um telemóvel esquecido?).</text>
<text x="56.0" y="102.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Nas regras: as que precisam de certeza perguntam à família em vez de agir; um rosto desconhecido em 3 análises seguidas continua a gerar o aviso de segurança.</text>
<rect x="40.0" y="272.6" width="420.0" height="216.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="56.0" y="303.8" font-size="16" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">OCUPADA</tspan></text>
<text x="56.0" y="327.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Alguém da Família está em casa: um telemóvel da Família está no</text>
<text x="56.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Wi-Fi, ou uma câmara viu uma pessoa há menos de T_visto.</text>
<text x="56.0" y="368.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Nas regras: as de “casa vazia” esperam; um rosto desconhecido só</text>
<text x="56.0" y="385.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">dá alarme se a regra o pedir.</text>
<rect x="610.0" y="272.6" width="420.0" height="116.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="626.0" y="303.8" font-size="16" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">A SAIR</tspan></text>
<text x="626.0" y="327.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A porta abriu e fechou. Durante T_saída, o serviço vê quem saiu: um</text>
<text x="626.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">telemóvel que sai do Wi-Fi, ou menos pessoas nas câmaras.</text>
<text x="626.0" y="368.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Se saiu alguém da Família, corre a verificação do objeto esquecido.</text>
<rect x="1180.0" y="272.6" width="420.0" height="216.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="1196.0" y="303.8" font-size="16" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">VAZIA</tspan></text>
<text x="1196.0" y="327.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Todos os telemóveis da Família estão fora, a porta abriu e fechou,</text>
<text x="1196.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">nenhum rosto da Família foi visto há menos de T_rosto e nenhuma</text>
<text x="1196.0" y="362.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">câmara vê uma pessoa, depois de atualizar os últimos lugares onde</text>
<text x="1196.0" y="379.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">havia pessoas.</text>
<text x="1196.0" y="403.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Nas regras: as de “casa vazia” agem (propor desligar o que ficou</text>
<text x="1196.0" y="420.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">ligado); uma pessoa vista passa a INCERTA.</text>
<path d="M460.0 312.6 H600.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="472.0" y="289.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">a porta abre e depois</text>
<text x="472.0" y="304.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">fecha</text>
<path d="M610.0 362.6 H470.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="472.0" y="380.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">passado T_saída, um</text>
<text x="472.0" y="396.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">telemóvel da Família</text>
<text x="472.0" y="411.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">continua em casa</text>
<path d="M1030.0 322.6 H1170.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="1042.0" y="340.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">passado T_saída,</text>
<text x="1042.0" y="356.2" font-size="12" font-weight="400" fill="#333333" text-anchor="start">telemóveis fora e</text>
<text x="1042.0" y="371.8" font-size="12" font-weight="400" fill="#333333" text-anchor="start">ninguém nas câmaras</text>
<path d="M1180.0 458.6 H470.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="820.0" y="450.6" font-size="12" font-weight="400" fill="#333333" text-anchor="middle">chegada: um telemóvel da Família entra no Wi-Fi, ou um rosto da Família é reconhecido</text>
<path d="M190.0 272.6 V132.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="40.0" y="146.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">telemóvel em casa, mas</text>
<text x="40.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">ninguém visto nem porta</text>
<text x="40.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">usada durante T_parado</text>
<path d="M250.0 122.6 V262.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="262.0" y="146.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">um telemóvel da Família entra no</text>
<text x="262.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Wi-Fi, ou um rosto da Família é</text>
<text x="262.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">reconhecido</text>
<path d="M820.0 272.6 V132.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="832.0" y="178.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">telemóveis fora, mas uma pessoa é</text>
<text x="832.0" y="193.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">vista</text>
<path d="M1330.0 272.6 V132.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="1180.0" y="146.4" font-size="12" font-weight="400" fill="#333333" text-anchor="start">uma pessoa vista (rosto</text>
<text x="1180.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">desconhecido ou não</text>
<text x="1180.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">visível)</text>
<path d="M1390.0 122.6 V262.6" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#m111111)"/>
<text x="1402.0" y="162.0" font-size="12" font-weight="400" fill="#333333" text-anchor="start">telemóveis fora e ninguém nas</text>
<text x="1402.0" y="177.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">câmaras, depois da atualização</text>
<rect x="40.0" y="528.6" width="504.0" height="280.0" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="56.0" y="558.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Sinais</tspan></text>
<text x="56.0" y="581.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Telemóveis: o<tspan font-style="italic"> router</tspan> diz que telemóveis da Família estão no Wi-Fi (ferramenta MCP</text>
<text x="56.0" y="599.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">proposta, <tspan font-family="Menlo, monospace" font-size="11.2">get_home_wifi_clients</tspan>; simulada no protótipo).</text>
<text x="56.0" y="622.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Porta: o sensor de contacto envia “aberta” e “fechada” à plataforma, como hoje.</text>
<text x="56.0" y="646.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Câmaras: pessoas encontradas pelo<tspan font-style="italic"> OWLv2</tspan> e, com consentimento, o rótulo do</text>
<text x="56.0" y="663.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">rosto calculado em casa.</text>
<rect x="568.0" y="528.6" width="504.0" height="280.0" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="584.0" y="558.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Contagem de pessoas</tspan></text>
<text x="584.0" y="581.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Pessoas em casa = Família em casa (telemóvel no Wi-Fi, ou rosto visto há menos</text>
<text x="584.0" y="599.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">de T_rosto sem o telemóvel ter saído depois) + visitas registadas vistas agora +</text>
<text x="584.0" y="616.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">rostos desconhecidos vistos agora.</text>
<text x="584.0" y="640.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Uma pessoa sem rosto visível só se soma se não puder ser alguém da Família já</text>
<text x="584.0" y="657.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">contado; com a Família fora, o estado passa a INCERTA.</text>
<text x="584.0" y="681.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Divisão sem câmara: cobrem-na os telemóveis. Pessoa parada: cobrem-na os</text>
<text x="584.0" y="698.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">telemóveis e a atualização periódica.</text>
<rect x="1096.0" y="528.6" width="504.0" height="280.0" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1112.0" y="558.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Tempos: demonstração / produção</tspan></text>
<text x="1450.0" y="584.6" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start"><tspan font-weight="700">demo</tspan></text>
<text x="1524.0" y="584.6" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start"><tspan font-weight="700">produção</tspan></text>
<text x="1112.0" y="605.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_visto · uma pessoa vista conta como “agora”</text>
<text x="1450.0" y="605.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">15 s</tspan></text>
<text x="1524.0" y="605.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">2 min</tspan></text>
<text x="1112.0" y="626.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_rosto · um rosto da Família conta em casa</text>
<text x="1450.0" y="626.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">2 min</tspan></text>
<text x="1524.0" y="626.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 min</tspan></text>
<text x="1112.0" y="647.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_saída · A SAIR espera por quem saiu</text>
<text x="1450.0" y="647.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">10 s</tspan></text>
<text x="1524.0" y="647.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">5 min</tspan></text>
<text x="1112.0" y="668.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_atraso · telemóvel sai do Wi-Fi após a porta</text>
<text x="1450.0" y="668.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 s</tspan></text>
<text x="1524.0" y="668.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">5 min</tspan></text>
<text x="1112.0" y="689.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_telemóvel · ausência que conta como fora*</text>
<text x="1450.0" y="689.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">simulado</tspan></text>
<text x="1524.0" y="689.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">10 min</tspan></text>
<text x="1112.0" y="710.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_atualizar · revê onde as pessoas estavam</text>
<text x="1450.0" y="710.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 s</tspan></text>
<text x="1524.0" y="710.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">30 s</tspan></text>
<text x="1112.0" y="731.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_verificar · espera pela verificação ativa</text>
<text x="1450.0" y="731.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">15 s</tspan></text>
<text x="1524.0" y="731.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">60 s</tspan></text>
<text x="1112.0" y="752.6" font-size="12" font-weight="400" fill="#333333" text-anchor="start">T_parado · telemóvel em casa sem outros sinais</text>
<text x="1450.0" y="752.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">15 min</tspan></text>
<text x="1524.0" y="752.6" font-size="12" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">4 h</tspan></text>
<text x="1112.0" y="778.6" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">* Fora de A SAIR; em A SAIR conta logo. Valores do protótipo (presence.py); os de</text>
<text x="1112.0" y="794.8" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">produção são propostas.</text>
<text x="40.0" y="838.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Corre no serviço<tspan font-style="italic"> ThingTracker</tspan>, na Altice: um estado por casa, recalculado a cada evento (porta, Wi-Fi, resultado da visão) e a cada temporizador.</text></svg>
