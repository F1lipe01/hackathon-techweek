<text x="945.0" y="679.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">7</tspan></text>
<rect x="444.0" y="701.5" width="147.0" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="517.5" y="714.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">3 regiões, na fila urgente</text>
<path d="M327.0 723.0 H706.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="315.0" cy="722.9749999999999" r="11" fill="#0084D6"/>
<text x="315.0" y="727.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">8</tspan></text>
<rect x="744.4" y="749.5" width="176.2" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="832.5" y="762.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">livro visto em 3 de 3 imagens,</text>
<rect x="758.9" y="766.5" width="147.2" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="832.5" y="779.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">semelhança 0,70 ≥ 0,62,</text>
<rect x="801.7" y="783.5" width="61.7" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="832.5" y="796.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">miniatura</text>
<path d="M732.0 805.0 H931.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="720.0" cy="804.9749999999999" r="11" fill="#0084D6"/>
<text x="720.0" y="809.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">9</tspan></text>
<rect x="795.0" y="849.0" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="945.0" y="868.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Regra “avisa-me se sair sem o livro”: cumprida,</text>
<text x="945.0" y="885.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">porque o livro foi visto em pelo menos 2 das 3</text>
<text x="945.0" y="902.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">imagens</text>
<rect x="972.1" y="922.5" width="215.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="1080.0" y="935.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">aviso: “O livro ficou em casa”, com a</text>
<rect x="972.0" y="939.5" width="215.9" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="1080.0" y="952.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">miniatura e “na secretária, às 18h02”</text>
<path d="M957.0 961.0 H1201.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="945.0" cy="960.9749999999999" r="11" fill="#0084D6"/>
<text x="945.0" y="965.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">10</tspan></text>
<rect x="12.0" y="1005.0" width="1356.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="690.0" y="1024.0" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Se o livro não aparecer em pelo menos 2 das 3 imagens, o resultado é “incerto”: não há aviso, só um registo. Uma chegada (a porta abre e fecha e um telemóvel entra no Wi-Fi) não inicia a verificação.</text>
<text x="20.0" y="1073.2" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Cinzento: em casa. Azul: Altice. Laranja: telemóvel. Os tempos de produção são propostas, a afinar num piloto.</text></svg>
