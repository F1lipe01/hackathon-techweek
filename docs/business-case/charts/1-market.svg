<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="675" fill="#FFF"/><text x="64.0" y="74.0" font-size="32" font-weight="700" fill="#111" text-anchor="start">About 19,000 MEO homes in the expected case</text><text x="64.0" y="108.0" font-size="17" font-weight="400" fill="#4A4A4A" text-anchor="start">From MEO’s fixed-broadband homes to subscribers</text><text x="64.0" y="641.0" font-size="12.5" font-weight="400" fill="#767676" text-anchor="start">MEO base: ANACOM, Q4 2025 · connected-home use: Eurostat 2024, Portugal · take rate: our assumption (2% to 10%)</text><text x="64.0" y="178.0" font-size="18" font-weight="400" fill="#4A4A4A" text-anchor="start">Homes with MEO fixed broadband</text><path d="M64 194 H902.0 Q906.0 194 906.0 198 V218 Q906.0 222 902.0 222 H64 Z" fill="#0084D6"/><text x="918.0" y="215.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">1.58 million</text><text x="64.0" y="326.0" font-size="18" font-weight="400" fill="#4A4A4A" text-anchor="start">Already use a connected-home system (24%)</text><path d="M64 342 H261.99580000000003 Q265.99580000000003 342 265.99580000000003 346 V366 Q265.99580000000003 370 261.99580000000003 370 H64 Z" fill="#0084D6"/><text x="278.0" y="363.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">379 thousand</text><text x="64.0" y="474.0" font-size="18" font-weight="400" fill="#4A4A4A" text-anchor="start">Would subscribe (5% of those)</text><path d="M64 490 H70.10220973498367 Q74.10220973498367 490 74.10220973498367 494 V514 Q74.10220973498367 518 70.10220973498367 518 H64 Z" fill="#0084D6"/><text x="86.1" y="511.0" font-size="18" font-weight="700" fill="#111" text-anchor="start">≈ 19 thousand homes · 1.2% of MEO</text></svg>