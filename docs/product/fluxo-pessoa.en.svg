<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1266" width="1200" height="1266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Adding a person, with consent"><title>Adding a person, with consent</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1266" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1254" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="444.0" y1="84" x2="444.0" y2="1254" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="756.0" y1="84" x2="756.0" y2="1254" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1254" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="316.4" y="118.0" width="255.3" height="17" fill="#FFF"/><text x="444.0" y="131.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">invitation: Ana, adult; ask to recognise her</text><line x1="137.0" y1="144.0" x2="741.0" y2="144.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="144.0" r="4.5" fill="#0084D6"/><rect x="525.4" y="170.0" width="149.3" height="17" fill="#FFF"/><text x="600.0" y="183.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the invitation, with what</text><rect x="527.2" y="187.0" width="145.6" height="17" fill="#FFF"/><text x="600.0" y="200.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">is kept, where and why</text><line x1="751.0" y1="213.0" x2="459.0" y2="213.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="213.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="239.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="261.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Ana reads and decides. Nothing is preselected,</text><text x="444.0" y="279.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">and saying no has no other consequence</text><rect x="502.4" y="313.0" width="195.2" height="17" fill="#FFF"/><text x="600.0" y="326.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“I agree to be recognised”, with</text><rect x="511.3" y="330.0" width="177.5" height="17" fill="#FFF"/><text x="600.0" y="343.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the time and the text version</text><line x1="449.0" y1="356.0" x2="741.0" y2="356.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="356.0" r="4.5" fill="#0084D6"/><rect x="586.0" y="382.0" width="340.0" height="34" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="756.0" y="404.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Keeps the record of consent, never biometric data</text><rect x="809.1" y="438.0" width="205.9" height="17" fill="#FFF"/><text x="912.0" y="451.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">enrol Ana at the Entrance camera</text><line x1="761.0" y1="464.0" x2="1053.0" y2="464.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="464.0" r="4.5" fill="#0084D6"/><rect x="848.0" y="490.0" width="340.0" height="70" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="512.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Ana turns her head in front of the camera</text><text x="1018.0" y="530.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">for 10 s. The face template is encrypted and</text><text x="1018.0" y="548.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">stays in the home; the images are deleted</text><rect x="778.0" y="582.0" width="268.1" height="17" fill="#FFF"/><text x="912.0" y="595.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">enrolment done, with no images or template</text><line x1="1063.0" y1="608.0" x2="771.0" y2="608.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="608.0" r="4.5" fill="#0084D6"/><rect x="518.7" y="634.0" width="162.5" height="17" fill="#FFF"/><text x="600.0" y="647.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“You are now recognised”</text><line x1="751.0" y1="660.0" x2="459.0" y2="660.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="660.0" r="4.5" fill="#0084D6"/><rect x="366.6" y="686.0" width="154.8" height="17" fill="#FFF"/><text x="444.0" y="699.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Ana is now recognised”</text><line x1="751.0" y1="712.0" x2="147.0" y2="712.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="712.0" r="4.5" fill="#0084D6"/><rect x="10" y="738.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="759.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Later, someone comes in</text><rect x="848.0" y="794.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="816.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Compares the face with the home’s templates; a face</text><text x="1018.0" y="834.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">with no match is discarded within the same analysis</text><rect x="788.3" y="868.0" width="247.3" height="17" fill="#FFF"/><text x="912.0" y="881.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">event “Ana is home”, with the name only</text><line x1="1063.0" y1="894.0" x2="771.0" y2="894.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="894.0" r="4.5" fill="#0084D6"/><rect x="10" y="920.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="941.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">If Ana withdraws her consent</text><rect x="528.4" y="976.0" width="143.3" height="17" fill="#FFF"/><text x="600.0" y="989.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Stop recognising me”</text><line x1="449.0" y1="1002.0" x2="741.0" y2="1002.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1002.0" r="4.5" fill="#0084D6"/><rect x="829.1" y="1028.0" width="165.9" height="17" fill="#FFF"/><text x="912.0" y="1041.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">delete Ana’s face template</text><line x1="761.0" y1="1054.0" x2="1053.0" y2="1054.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="1054.0" r="4.5" fill="#0084D6"/><rect x="844.5" y="1080.0" width="135.1" height="17" fill="#FFF"/><text x="912.0" y="1093.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">deleted: confirmation</text><line x1="1063.0" y1="1106.0" x2="771.0" y2="1106.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1106.0" r="4.5" fill="#0084D6"/><rect x="586.0" y="1132.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="756.0" y="1154.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Audit log: the withdrawal and the</text><text x="756.0" y="1172.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">deletion, with no biometric data</text><rect x="10" y="1206.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="1227.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">For a child, a holder of parental responsibility consents, in their own app</text><rect x="22.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Administrator</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Rui’s app</text><rect x="334.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="444.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Invited person</text><text x="444.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Ana’s app</text><rect x="646.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="756.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">ThingTracker service</text><text x="756.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Altice platform</text><rect x="958.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Edge service</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">in the home, by the camera</text></svg>
