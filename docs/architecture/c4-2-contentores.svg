<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2260 1119" width="2260" height="1119" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="C4, nível 2: contentores"><title>C4, nível 2: contentores</title><defs><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="2260" height="1119" fill="#FFFFFF"/><rect x="20.0" y="24.0" width="290.0" height="1043.5" rx="18" fill="#F4F4F4"/>
<text x="40.0" y="54.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Em casa</tspan></text>
<rect x="1160.0" y="24.0" width="1080.0" height="181.2" rx="18" fill="#FFF6EA"/>
<text x="1180.0" y="54.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Telemóvel</tspan></text>
<rect x="410.0" y="233.1" width="1830.0" height="834.4" rx="18" fill="#EEF3FB"/>
<text x="430.0" y="263.1" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice</tspan></text>
<rect x="40.0" y="96.0" width="250.0" height="91.2" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="54.0" y="123.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Câmaras do kit</tspan></text>
<text x="54.0" y="145.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema existente]</text>
<text x="54.0" y="168.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">RTSP, H.265</text>
<rect x="1180.0" y="96.0" width="1040.0" height="91.2" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="123.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aplicação Altice</tspan></text>
<text x="1194.0" y="145.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema existente · telemóvel]</text>
<text x="1194.0" y="168.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Separador<tspan font-style="italic"> Things</tspan>, assistente e avisos com cartões de ação</text>
<rect x="40.0" y="283.1" width="250.0" height="330.8" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="54.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Agente da casa</tspan></text>
<text x="54.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[<tspan font-style="italic">Python</tspan> no CPU do<tspan font-style="italic"> router</tspan>]</text>
<text x="54.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Máscaras, filtro de movimento, recorte</text>
<text x="54.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">da região que mudou</text>
<text x="54.0" y="396.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Rostos com<tspan font-style="italic"> YuNet</tspan> e<tspan font-style="italic"> SFace</tspan> (opcional)</text>
<text x="54.0" y="420.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Lê a pedido do serviço, mesmo sem</text>
<text x="54.0" y="437.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">movimento</text>
<text x="54.0" y="461.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Guarda só em memória os últimos 3 s,</text>
<text x="54.0" y="478.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">para o juiz</text>
<rect x="790.0" y="283.1" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Servidores de visão</tspan></text>
<text x="804.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[<tspan font-style="italic">PyTorch</tspan>, GPU L4]</text>
<text x="804.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start"><tspan font-style="italic">OWLv2</tspan>: caixas;<tspan font-style="italic"> DINOv2</tspan>: um vetor por</text>
<text x="804.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">candidato</text>
<rect x="430.0" y="487.8" width="220.0" height="126.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="444.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Mediador de ligações</tspan></text>
<text x="444.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[MQTT sobre mTLS]</text>
<text x="444.0" y="560.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Uma ligação por casa, atrás de</text>
<text x="444.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">um balanceador</text>
<rect x="790.0" y="487.8" width="250.0" height="126.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Filas e fluxo de eventos</tspan></text>
<text x="804.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[corretor de mensagens]</text>
<text x="804.0" y="560.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Visão urgente e em lote; eventos de</text>
<text x="804.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">cada casa por ordem; pedidos ao</text>
<text x="804.0" y="595.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">modelo</text>
<rect x="1180.0" y="487.8" width="270.0" height="555.8" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2.4"/>
<text x="1194.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Serviço</tspan><tspan font-weight="700" font-style="italic"> ThingTracker</tspan></text>
<text x="1194.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[contentores sem estado, atrás de um</text>
<text x="1194.0" y="554.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">balanceador]</text>
<text x="1194.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">API da aplicação e<tspan font-style="italic"> host</tspan> MCP</text>
<text x="1194.0" y="601.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Comparação com as assinaturas visuais</text>
<text x="1194.0" y="625.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Seguimento: na mão, levado, mudado</text>
<text x="1194.0" y="648.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Motor de presença e motor de regras, por</text>
<text x="1194.0" y="666.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">casa; o motor de regras decide</text>
<text x="1194.0" y="689.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Avisos; um “Sim” vira uma chamada MCP</text>
<rect x="1970.0" y="487.8" width="250.0" height="126.1" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1984.0" y="515.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Plataforma Connected Home</tspan></text>
<text x="1984.0" y="537.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema existente]</text>
<text x="1984.0" y="560.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Servidor MCP, eventos da porta e do</text>
<text x="1984.0" y="578.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Wi-Fi, notificações</text>
<rect x="40.0" y="709.9" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="54.0" y="737.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Padrões faciais</tspan></text>
<text x="54.0" y="759.2" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[<tspan font-style="italic">SQLite</tspan> cifrado, no<tspan font-style="italic"> router</tspan>]</text>
<text x="54.0" y="782.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Até 8 por pessoa; nunca saem de casa</text>
<rect x="790.0" y="709.9" width="250.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="737.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700" font-style="italic">Cache</tspan></text>
<text x="804.0" y="759.2" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[<tspan font-style="italic">Redis</tspan>]</text>
<text x="804.0" y="782.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Estado de cada casa em uso:</text>
<text x="804.0" y="800.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">presença, trajetos, temporizadores</text>
<rect x="1590.0" y="709.9" width="240.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1604.0" y="737.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">PostgreSQL</tspan></text>
<text x="1604.0" y="759.2" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[com<tspan font-style="italic"> pgvector</tspan>]</text>
<text x="1604.0" y="782.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Por cliente: objetos, assinaturas,</text>
<text x="1604.0" y="800.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">regras, avisos, observações</text>
<rect x="790.0" y="914.6" width="250.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="942.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Modelos de linguagem e de</tspan></text>
<text x="804.0" y="962.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">visão-linguagem</tspan></text>
<text x="804.0" y="984.2" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[servidores GPU atrás de uma fila]</text>
<text x="804.0" y="1007.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Texto e, raramente, clipes curtos para o</text>
<text x="804.0" y="1025.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">juiz</text>
<rect x="1590.0" y="914.6" width="240.0" height="129.0" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1604.0" y="942.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Armazenamento de objetos</tspan></text>
<text x="1604.0" y="963.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[compatível com S3]</text>
<text x="1604.0" y="987.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Miniaturas, 30 dias (proposta)</text>
