<text x="40.0" y="946.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">C4 notation, level 2. Blue outline: ThingTracker containers; grey: existing systems. Each arrow is one direction of a flow, with what it carries. Images, video, fingerprints and face templates never leave the home.</text></svg>
