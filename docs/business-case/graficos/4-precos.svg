<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" width="680" height="368" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" style="white-space:pre"><rect width="680" height="368" fill="#FFFFFF"/><text x="20.0" y="38.0" font-size="19" font-weight="700" fill="#1F2328" text-anchor="start">Uma fração do preço de um plano com câmara</text><text x="20.0" y="60.0" font-size="12.5" font-weight="400" fill="#56606C" text-anchor="start">Preço mensal com IVA</text><rect x="20.0" y="65.0" width="10.0" height="10.0" rx="2" fill="#B4BCC6"/><text x="36.0" y="74.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">Ofertas atuais, preços publicados</text><rect x="224.0" y="65.0" width="10.0" height="10.0" rx="2" fill="#0084D6"/><text x="240.0" y="74.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start"><tspan font-style="italic">ThingTracker</tspan>, preços propostos</text><text x="20.0" y="110.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">Vodafone + Prosegur Alarmes</text><text x="20.0" y="126.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">a partir deste valor; câmara de 360° incluída</text><path d="M320.0 99.0H600.8Q604.8 99.0 604.8 103.0V113.0Q604.8 117.0 600.8 117.0H320.0Z" fill="#B4BCC6"/><text x="614.8" y="112.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">45,50 €</text><text x="20.0" y="156.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">NOS Securitas, apartamento</text><text x="20.0" y="172.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">preço de campanha, com fidelização de 36 meses; cada</text><text x="20.0" y="186.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">câmara interior adicional custa mais 7,50 €</text><path d="M320.0 145.0H535.0Q539.0 145.0 539.0 149.0V159.0Q539.0 163.0 535.0 163.0H320.0Z" fill="#B4BCC6"/><text x="549.0" y="158.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">34,99 €</text><text x="20.0" y="216.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">SFR <tspan font-style="italic">Maison</tspan> <tspan font-style="italic">Sécurisée</tspan>, França</text><text x="20.0" y="232.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">14,99 € para clientes <tspan font-style="italic">SFR</tspan> <tspan font-style="italic">Box</tspan>; câmara incluída</text><path d="M320.0 205.0H441.1Q445.1 205.0 445.1 209.0V219.0Q445.1 223.0 441.1 223.0H320.0Z" fill="#B4BCC6"/><text x="455.1" y="218.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">19,99 €</text><text x="20.0" y="262.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start"><tspan font-style="italic">ThingTracker</tspan> com câmara</text><text x="20.0" y="278.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">pacote proposto</text><path d="M320.0 251.0H362.9Q366.9 251.0 366.9 255.0V265.0Q366.9 269.0 362.9 269.0H320.0Z" fill="#0084D6"/><text x="376.9" y="264.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">7,50 €</text><text x="20.0" y="308.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start"><tspan font-style="italic">ThingTracker</tspan>, serviço adicional</text><text x="20.0" y="324.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">proposto, para casas que já têm câmara</text><path d="M320.0 297.0H341.0Q345.0 297.0 345.0 301.0V311.0Q345.0 315.0 341.0 315.0H320.0Z" fill="#0084D6"/><text x="355.0" y="310.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">3,99 €</text><line x1="320.0" y1="92.0" x2="320.0" y2="321.0" stroke="#A3ACB7" stroke-width="1" shape-rendering="crispEdges"/><text x="20.0" y="352.0" font-size="10.5" font-weight="400" fill="#6B7480" text-anchor="start">Fontes: vodafone.pt, nos.pt e sfr.fr/maison, consultados a 18/11/2026. Preços do <tspan font-style="italic">ThingTracker</tspan>: pressupostos da equipa [B20, B21].</text></svg>
