<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1413" width="1200" height="1413" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Adicionar um animal e aprender a sua rotina"><title>Adicionar um animal e aprender a sua rotina</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1413" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1401" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="444.0" y1="84" x2="444.0" y2="1401" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="756.0" y1="84" x2="756.0" y2="1401" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1401" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="150.9" y="118.0" width="274.3" height="17" fill="#FFF"/><text x="288.0" y="131.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Novo animal: Mimi, gata, “cinzenta e tigrada”</text><line x1="137.0" y1="144.0" x2="429.0" y2="144.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="144.0" r="4.5" fill="#0084D6"/><rect x="497.3" y="170.0" width="205.4" height="17" fill="#FFF"/><text x="600.0" y="183.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">a descrição da Mimi, só em texto</text><line x1="449.0" y1="196.0" x2="741.0" y2="196.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="196.0" r="4.5" fill="#0084D6"/><rect x="480.0" y="222.0" width="240.0" height="17" fill="#FFF"/><text x="600.0" y="235.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">pesquisa ao detetor: “a grey tabby cat”</text><line x1="751.0" y1="248.0" x2="459.0" y2="248.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="248.0" r="4.5" fill="#0084D6"/><rect x="623.2" y="274.0" width="265.5" height="17" fill="#FFF"/><text x="756.0" y="287.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">aprender a Mimi: “a cat”, “a grey tabby cat”</text><line x1="449.0" y1="300.0" x2="1053.0" y2="300.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="300.0" r="4.5" fill="#0084D6"/><rect x="848.0" y="326.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="348.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Durante 1 a 2 dias, guarda o vetor e o recorte</text><text x="1018.0" y="366.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">de cada gato visto e agrupa os parecidos</text><rect x="674.4" y="400.0" width="163.2" height="17" fill="#FFF"/><text x="756.0" y="413.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">4 recortes do grupo maior</text><line x1="1063.0" y1="426.0" x2="459.0" y2="426.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="426.0" r="4.5" fill="#0084D6"/><rect x="172.3" y="452.0" width="231.4" height="17" fill="#FFF"/><text x="288.0" y="465.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Acho que já conheço a Mimi. É ela?”</text><line x1="439.0" y1="478.0" x2="147.0" y2="478.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="478.0" r="4.5" fill="#0084D6"/><rect x="194.2" y="504.0" width="187.5" height="17" fill="#FFF"/><text x="288.0" y="517.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Sim”, e as taças da comida e</text><rect x="194.1" y="521.0" width="187.9" height="17" fill="#FFF"/><text x="288.0" y="534.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">da água marcadas na imagem</text><line x1="137.0" y1="547.0" x2="429.0" y2="547.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="547.0" r="4.5" fill="#0084D6"/><rect x="634.3" y="573.0" width="243.4" height="17" fill="#FFF"/><text x="756.0" y="586.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">assinatura confirmada; taças registadas</text><line x1="449.0" y1="599.0" x2="1053.0" y2="599.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="599.0" r="4.5" fill="#0084D6"/><rect x="10" y="625.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="646.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Durante 14 dias</text><rect x="848.0" y="681.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="703.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Uma visita conta quando a gata está</text><text x="1018.0" y="721.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">sobre a taça durante 20 s ou mais</text><rect x="623.7" y="755.0" width="264.7" height="17" fill="#FFF"/><text x="756.0" y="768.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">visitas: taça, início e duração, sem imagens</text><line x1="1063.0" y1="781.0" x2="459.0" y2="781.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="781.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="807.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="829.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Calcula a rotina por estatística:</text><text x="444.0" y="847.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">refeições perto das 8h e das 19h30</text><rect x="486.2" y="881.0" width="227.5" height="17" fill="#FFF"/><text x="600.0" y="894.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">a rotina e a regra escolhida, em texto</text><line x1="449.0" y1="907.0" x2="741.0" y2="907.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="907.0" r="4.5" fill="#0084D6"/><rect x="536.2" y="933.0" width="127.6" height="17" fill="#FFF"/><text x="600.0" y="946.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">o texto da sugestão</text><line x1="751.0" y1="959.0" x2="459.0" y2="959.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="959.0" r="4.5" fill="#0084D6"/><rect x="194.8" y="985.0" width="186.4" height="17" fill="#FFF"/><text x="288.0" y="998.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Avisa-me se a Mimi não for à</text><rect x="198.5" y="1002.0" width="178.9" height="17" fill="#FFF"/><text x="288.0" y="1015.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">taça da comida até às 21h?”</text><line x1="439.0" y1="1028.0" x2="147.0" y2="1028.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1028.0" r="4.5" fill="#0084D6"/><rect x="259.9" y="1054.0" width="56.3" height="17" fill="#FFF"/><text x="288.0" y="1067.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Ativar”</text><line x1="137.0" y1="1080.0" x2="429.0" y2="1080.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="1080.0" r="4.5" fill="#0084D6"/><rect x="603.5" y="1106.0" width="304.9" height="17" fill="#FFF"/><text x="756.0" y="1119.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">regra: nenhuma visita à taça da comida até às 21h</text><line x1="449.0" y1="1132.0" x2="1053.0" y2="1132.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1132.0" r="4.5" fill="#0084D6"/><rect x="10" y="1158.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="1179.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Num dia em que a Mimi não aparece</text><rect x="848.0" y="1214.0" width="340.0" height="52" rx="9" fill="#FFF7EC" stroke="#E8710A" stroke-width="1.2"/><text x="1018.0" y="1236.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Motor de regras, às 21h:</text><text x="1018.0" y="1254.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">nenhuma visita desde as 8h05</text><rect x="638.1" y="1288.0" width="235.7" height="17" fill="#FFF"/><text x="756.0" y="1301.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">regra cumprida, com o recorte da taça</text><line x1="1063.0" y1="1314.0" x2="459.0" y2="1314.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1314.0" r="4.5" fill="#0084D6"/><rect x="198.6" y="1340.0" width="178.9" height="17" fill="#FFF"/><text x="288.0" y="1353.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Aviso: “A Mimi não foi à taça</text><rect x="204.0" y="1357.0" width="168.1" height="17" fill="#FFF"/><text x="288.0" y="1370.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">da comida desde as 8h05”</text><line x1="439.0" y1="1383.0" x2="147.0" y2="1383.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1383.0" r="4.5" fill="#0084D6"/><rect x="22.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Aplicação</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">telemóvel da família</text><rect x="334.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="444.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço <tspan font-style="italic">ThingTracker</tspan></text><text x="444.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">plataforma Altice</text><rect x="646.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="756.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Modelo de linguagem</text><text x="756.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">fornecedor sob contrato</text><rect x="958.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço local</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">em casa, junto da câmara</text></svg>
