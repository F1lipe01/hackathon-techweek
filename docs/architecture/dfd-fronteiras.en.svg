<text x="1554.0" y="539.3" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">F9 alerts</text>
<path d="M1700.0 133.8 H1160.0" fill="none" stroke="#0084D6" stroke-width="1.6" marker-end="url(#m0084D6)"/>
