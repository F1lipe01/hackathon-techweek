<text x="54.0" y="123.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Kit cameras</tspan></text>
<text x="54.0" y="145.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system]</text>
<text x="54.0" y="168.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">RTSP, H.265, on the home network only</text>
<rect x="1180.0" y="96.0" width="1040.0" height="91.2" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="123.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="1194.0" y="145.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system · phone]</text>
<text x="1194.0" y="168.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Things tab, assistant, and alerts with action cards</text>
<rect x="40.0" y="283.1" width="250.0" height="161.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="54.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Capture and motion gate</tspan></text>
<text x="54.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[ffmpeg, OpenCV]</text>
<text x="54.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Reads the cameras on the home</text>
<text x="54.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">network; privacy masks; analyses only</text>
<text x="54.0" y="390.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">on motion or on request</text>
<rect x="430.0" y="283.1" width="220.0" height="161.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="444.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Vision</tspan></text>
<text x="444.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[OWLv2 + DINOv2 in the</text>
<text x="444.0" y="349.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">prototype]</text>
<text x="444.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Detection and re-identification</text>
<text x="444.0" y="390.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">against the fingerprint (≥ 0.62);</text>
<text x="444.0" y="408.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">lighter detectors, such as</text>
<text x="444.0" y="425.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">YOLOv8n, on small devices</text>
<rect x="40.0" y="540.3" width="250.0" height="126.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="54.0" y="568.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Faces (opt-in)</tspan></text>
<text x="54.0" y="589.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[YuNet + SFace]</text>
<text x="54.0" y="613.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">With consent; face templates kept on</text>
<text x="54.0" y="630.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">the device</text>
<rect x="430.0" y="540.3" width="220.0" height="126.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="444.0" y="568.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Local memory</tspan></text>
<text x="444.0" y="589.6" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[encrypted SQLite]</text>
<text x="444.0" y="613.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Fingerprints, face templates,</text>
<text x="444.0" y="630.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">where and when each thing was</text>
<text x="444.0" y="648.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">seen</text>
<rect x="790.0" y="283.1" width="250.0" height="383.3" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2.4"/>
<text x="804.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Home service</tspan></text>
<text x="804.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[Python, on the home device]</text>
<text x="804.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Presence engine and rules engine; the</text>
<text x="804.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">rules engine decides</text>
<text x="804.0" y="396.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Tracking: in hand, taken, moved</text>
<text x="804.0" y="420.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Alerts, as text; a “Yes” becomes an</text>
<text x="804.0" y="437.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">MCP action request</text>
<text x="804.0" y="461.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Builds the fingerprint from the</text>
<text x="804.0" y="478.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">registration photos</text>
<rect x="790.0" y="762.4" width="250.0" height="126.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="804.0" y="790.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Language model</tspan></text>
<text x="804.0" y="811.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[Qwen3-1.7B in the prototype]</text>
<text x="804.0" y="835.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Sentence into rule, question into</text>
<text x="804.0" y="852.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">answer; the service checks; it never</text>
<text x="804.0" y="870.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">decides</text>
<rect x="1180.0" y="283.1" width="270.0" height="383.3" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1194.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Relay and connection broker</tspan></text>
<text x="1194.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[MQTT over mTLS]</text>
<text x="1194.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">One outbound connection per home,</text>
<text x="1194.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">behind a load balancer</text>
<text x="1194.0" y="396.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Lets the app reach the home when the</text>
<text x="1194.0" y="414.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">family is away</text>
<text x="1194.0" y="437.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Registration photos pass encrypted end to</text>
<text x="1194.0" y="455.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">end: Altice cannot read them</text>
<rect x="1590.0" y="283.1" width="240.0" height="383.3" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2.4"/>
<text x="1604.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">ThingTracker service at Altice</tspan></text>
<text x="1604.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[stateless containers; text only]</text>
<text x="1604.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Accounts, identity and family</text>
<text x="1604.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">permissions</text>
<text x="1604.0" y="396.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Event log as structured text (“book,</text>
<text x="1604.0" y="414.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">desk, 18:02”)</text>
<text x="1604.0" y="437.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Backup and sync across the family’s</text>
<text x="1604.0" y="455.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">phones</text>
<rect x="1970.0" y="283.1" width="250.0" height="383.3" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1984.0" y="310.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Connected Home platform</tspan></text>
<text x="1984.0" y="332.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system]</text>
<text x="1984.0" y="355.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">MCP server, door and Wi-Fi events,</text>
<text x="1984.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">notifications</text>
<rect x="1590.0" y="762.4" width="240.0" height="126.1" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1604.0" y="790.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">PostgreSQL</tspan></text>
<text x="1604.0" y="811.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[metadata only, as text]</text>
<text x="1604.0" y="835.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Things, people (names only), owners,</text>
<text x="1604.0" y="852.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">scenarios, events; restores them if</text>
<text x="1604.0" y="870.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">the box is replaced</text>
