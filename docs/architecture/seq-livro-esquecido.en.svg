<rect x="32.0" y="20.0" width="176.0" height="82.8" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="44.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Door sensor and</tspan></text>
<text x="44.0" y="64.9" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">router</tspan></text>
<text x="44.0" y="86.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">in the home, on Altice</text>
<rect x="232.0" y="20.0" width="166.0" height="82.8" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="244.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Home agent</tspan></text>
<text x="244.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">on the router</text>
<rect x="422.0" y="20.0" width="186.0" height="82.8" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="434.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice platform</tspan></text>
<text x="434.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">devices and events</text>
<rect x="632.0" y="20.0" width="176.0" height="82.8" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="644.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Vision workers</tspan></text>
<text x="644.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">OWLv2 and DINOv2, L4</text>
<text x="644.0" y="84.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">GPUs</text>
<rect x="832.0" y="20.0" width="226.0" height="82.8" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="844.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">ThingTracker service</tspan></text>
<text x="844.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">presence and rules, per home</text>
<rect x="1082.0" y="20.0" width="266.0" height="82.8" rx="12" fill="#FFF6EA" stroke="#C9CED6" stroke-width="1.0"/>
<text x="1094.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="1094.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">on the phone</text>
<rect x="12.0" y="142.8" width="1356.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="690.0" y="161.8" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">State: OCCUPIED (Filipe’s phone is on the Wi-Fi). The book was last seen on the desk in Living room 1, at 18:02.</text>
<rect x="219.5" y="183.5" width="196.0" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="317.5" y="196.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">door open (<tspan font-family="Menlo, monospace" font-size="11.2">sensorState:</tspan>&#160;<tspan font-family="Menlo, monospace" font-size="11.2">alarm</tspan>)</text>
<path d="M132.0 205.0 H501.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="120.0" cy="204.97499999999997" r="11" fill="#0084D6"/>
<text x="120.0" y="209.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<rect x="582.6" y="231.5" width="294.7" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="730.0" y="244.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">door.opened</tspan> (today: <tspan font-family="Menlo, monospace" font-size="11.2">get_home_devices</tspan> every 4 s)</text>
<path d="M527.0 253.0 H931.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="515.0" cy="252.97499999999997" r="11" fill="#0084D6"/>
<text x="515.0" y="257.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<rect x="253.6" y="279.5" width="127.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="317.5" y="292.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">door closed, 8 s later</text>
<path d="M132.0 301.0 H501.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="120.0" cy="300.97499999999997" r="11" fill="#0084D6"/>
<text x="120.0" y="305.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<rect x="687.8" y="327.5" width="84.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="730.0" y="340.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">door.closed</tspan></text>
<path d="M527.0 349.0 H931.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="515.0" cy="348.97499999999997" r="11" fill="#0084D6"/>
<text x="515.0" y="353.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<rect x="795.0" y="393.0" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="945.0" y="412.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">The door opened and closed: OCCUPIED →</text>
<text x="945.0" y="429.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">LEAVING. Waits up to T_leave (10 s in the demo,</text>
<text x="945.0" y="446.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">5 min in production) for whoever left</text>
<rect x="236.8" y="466.5" width="161.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="317.5" y="479.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Filipe’s phone left the Wi-Fi</text>
<path d="M132.0 488.0 H501.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="120.0" cy="487.97499999999997" r="11" fill="#0084D6"/>
<text x="120.0" y="492.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<rect x="627.5" y="514.5" width="204.9" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="730.0" y="527.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">wifi.left</tspan>: Filipe (proposed event)</text>
<path d="M527.0 536.0 H931.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="515.0" cy="535.9749999999999" r="11" fill="#0084D6"/>
<text x="515.0" y="540.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">6</tspan></text>
<rect x="795.0" y="580.0" width="300.0" height="50.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="945.0" y="599.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">A Family member left: an active check of the</text>
<text x="945.0" y="616.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">book’s usual place, without waiting for motion</text>
<rect x="500.0" y="636.5" width="260.1" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="649.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">send the desk’s region: 3 frames, 1 a second</text>
<path d="M933.0 658.0 H329.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="945.0" cy="657.9749999999999" r="11" fill="#0084D6"/>
<text x="945.0" y="662.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">7</tspan></text>
<rect x="427.1" y="684.5" width="180.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="517.5" y="697.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">3 regions, on the urgent queue</text>
<path d="M327.0 706.0 H706.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="315.0" cy="705.9749999999999" r="11" fill="#0084D6"/>
<text x="315.0" y="710.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">8</tspan></text>
<rect x="749.9" y="732.5" width="165.1" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="832.5" y="745.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">3 results: “book” boxes and</text>
<rect x="783.3" y="749.5" width="98.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="832.5" y="762.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">DINOv2 vectors</text>
<path d="M732.0 771.0 H931.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="720.0" cy="770.9749999999999" r="11" fill="#0084D6"/>
<text x="720.0" y="775.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">9</tspan></text>
<rect x="795.0" y="815.0" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="945.0" y="834.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Matched with the book’s 8 views (pgvector): 0.70</text>
<text x="945.0" y="851.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">≥ 0.62 in 3 of 3 frames. Rule “tell me if I leave</text>
<text x="945.0" y="868.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">without my book” met, since 2 of 3 are enough</text>
<rect x="965.7" y="888.5" width="228.5" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="1080.0" y="901.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">alert: “Your book stayed at home”, with</text>
<rect x="958.6" y="905.5" width="242.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="1080.0" y="918.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">the thumbnail and “on the desk, at 18:02”</text>
<path d="M957.0 927.0 H1201.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="945.0" cy="926.9749999999999" r="11" fill="#0084D6"/>
<text x="945.0" y="931.3" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">10</tspan></text>
<rect x="12.0" y="971.0" width="1356.0" height="50.4" rx="8" fill="#EEF1F6"/>
<text x="690.0" y="990.0" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">If the book is seen in fewer than 2 of the 3 frames (half hidden, say), the rules engine may call the judge: a vision-language model at Altice looks at 2 to 3 s of the region and answers yes, no or unsure, with a sentence. “Yes”</text>
<text x="690.0" y="1008.2" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">gives the alert; “no” does not; “unsure” makes the app ask the family, with no alarm.</text>
<rect x="12.0" y="1047.4" width="1356.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="690.0" y="1066.4" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">An arrival (the door opens and closes and a phone joins the Wi-Fi) does not start the check.</text>
<rect x="12.0" y="1105.6" width="1356.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="690.0" y="1124.6" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Without a door sensor, the same check starts when a Family phone leaves the Wi-Fi (after T_phone, so later) or when a camera that sees the exit door sees someone leave through it.</text>
<text x="20.0" y="1173.8" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Grey: in the home. Blue: Altice. Orange: the phone. Production timings are proposals, to tune in a pilot.</text></svg>
