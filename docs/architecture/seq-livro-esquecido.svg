<text x="1094.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aplicação Altice</tspan></text>
<text x="1094.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">no telemóvel</text>
<rect x="12.0" y="142.8" width="1356.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="690.0" y="161.8" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Estado: OCUPADA (o telemóvel do Filipe está no Wi-Fi). O livro foi visto pela última vez na secretária da Sala 1, às 18h02.</text>
<rect x="214.0" y="183.5" width="206.9" height="17.0" rx="2" fill="#FFFFFF"/>
