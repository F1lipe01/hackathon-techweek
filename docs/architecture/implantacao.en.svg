<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 1024" width="2040" height="1024" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="ThingTracker deployment"><title>ThingTracker deployment</title><defs><marker id="m0084D6" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#0084D6"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="2040" height="1024" fill="#FFFFFF"/><rect x="20.0" y="20.0" width="940.0" height="784.6" rx="18" fill="#F4F4F4"/>
<text x="40.0" y="50.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">In the home</tspan></text>
<text x="40.0" y="70.0" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">All the perception and inference</text>
<rect x="1040.0" y="20.0" width="690.0" height="784.6" rx="18" fill="#EEF3FB"/>
<text x="1060.0" y="50.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice · text only</tspan></text>
<text x="1060.0" y="70.0" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Accounts, metadata, events, push, actions</text>
<rect x="1800.0" y="20.0" width="220.0" height="784.6" rx="18" fill="#FFF6EA"/>
<text x="1820.0" y="50.0" font-size="17" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Phone</tspan></text>
<rect x="434.0" y="108.0" width="502.0" height="366.6" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="448.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Home device</tspan></text>
<text x="448.0" y="157.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">The router, if it has an NPU, or a dedicated box: a Raspberry Pi 5 with an AI</text>
<text x="448.0" y="174.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">accelerator, or a Jetson Orin Nano Super</text>
<text x="448.0" y="198.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Takes in the cameras’ video on the home network</text>
<text x="448.0" y="221.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Motion gate: a 160 × 90 grey picture, every 0.5 s; analyses only on motion or on</text>
<text x="448.0" y="239.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">request</text>
<text x="448.0" y="262.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Vision: detection and re-identification against the fingerprint (≥ 0.62). OWLv2 +</text>
<text x="448.0" y="280.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">DINOv2 in the prototype; lighter detectors, such as YOLOv8n, on small devices</text>
<text x="448.0" y="303.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Faces (opt-in, with consent): YuNet finds, SFace compares; the templates stay on</text>
<text x="448.0" y="321.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">the device</text>
<text x="448.0" y="344.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Local memory: where and when each thing was seen</text>
<text x="448.0" y="368.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Presence engine and rules engine: the rules engine decides</text>
<text x="448.0" y="391.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Language model (Qwen3-1.7B in the prototype): sentence into rule, question into</text>
<text x="448.0" y="409.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">answer; it never decides</text>
<text x="448.0" y="432.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Builds the fingerprint from the registration photos</text>
<text x="448.0" y="456.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Images, video, fingerprints and face templates never leave it</text>
<rect x="44.0" y="108.0" width="300.0" height="110.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="58.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Kit cameras</tspan></text>
<text x="58.0" y="159.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Tuya SC034-WNV3 · H.265 · 2304 × 1296 ·</text>
<text x="58.0" y="176.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">20 fps</text>
<text x="58.0" y="200.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Video over RTSP on the home network only</text>
<rect x="434.0" y="498.6" width="502.0" height="69.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="448.0" y="526.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Security hub and door contact sensor</tspan></text>
<text x="448.0" y="549.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">MS-WES1AS (LTE) and MS-D3D; they report to the Altice platform, as today</text>
<rect x="434.0" y="586.3" width="502.0" height="69.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="448.0" y="614.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice router · Wi-Fi</tspan></text>
<text x="448.0" y="637.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Knows which family phones are connected</text>
<rect x="1064.0" y="108.0" width="260.0" height="190.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1078.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Relay and connection broker</tspan></text>
<text x="1078.0" y="157.3" font-size="12.5" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">MQTT over mTLS</tspan></text>
<text x="1078.0" y="180.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">One outbound connection per home,</text>
<text x="1078.0" y="198.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">behind a load balancer</text>
<text x="1078.0" y="221.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Lets the app reach the home when the</text>
<text x="1078.0" y="239.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">family is away</text>
<text x="1078.0" y="262.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Registration photos pass encrypted end</text>
<text x="1078.0" y="280.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">to end: Altice cannot read them</text>
<rect x="1064.0" y="498.6" width="260.0" height="157.3" rx="12" fill="#F7F7F7" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1078.0" y="526.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Connected Home platform</tspan></text>
<text x="1078.0" y="546.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">(existing)</tspan></text>
<text x="1078.0" y="570.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Devices, scenarios and security; MCP</text>
<text x="1078.0" y="587.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">server with 18 tools</text>
<text x="1078.0" y="611.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Asked of Altice: Wi-Fi events and the</text>
<text x="1078.0" y="628.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Wi-Fi presence tool</text>
<rect x="1424.0" y="108.0" width="282.0" height="547.9" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="2"/>
<text x="1438.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">ThingTracker service</tspan></text>
<text x="1438.0" y="157.3" font-size="12.5" font-weight="400" fill="#0084D6" text-anchor="start"><tspan font-weight="700">text only</tspan></text>
<text x="1438.0" y="180.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Accounts, identity and family permissions</text>
<text x="1438.0" y="204.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Event log as structured text (“book, desk,</text>
<text x="1438.0" y="221.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">18:02”)</text>
<text x="1438.0" y="245.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Push notifications to the app, through the</text>
<text x="1438.0" y="262.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">service it already uses</text>
<text x="1438.0" y="286.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A “Yes” becomes an action through the MCP</text>
<rect x="1424.0" y="673.9" width="282.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1438.0" y="701.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">PostgreSQL · metadata</tspan></text>
<text x="1438.0" y="725.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Things, people (names only), owners and</text>
<text x="1438.0" y="742.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">scenarios: backup, sync across phones, and</text>
<text x="1438.0" y="760.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">restore if the box is replaced</text>
<rect x="1820.0" y="108.0" width="180.0" height="670.6" rx="12" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.0"/>
<text x="1834.0" y="135.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="1834.0" y="159.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Things tab and assistant</text>
<text x="1834.0" y="182.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Alerts with action cards</text>
<text x="1834.0" y="206.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Registration photos: to the</text>
<text x="1834.0" y="223.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">home device, on the Wi-Fi</text>
<text x="1834.0" y="241.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">or encrypted through the</text>
<text x="1834.0" y="258.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">relay</text>
<text x="1834.0" y="282.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Live video, as today,</text>
<text x="1834.0" y="299.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">outside ThingTracker</text>
<path d="M344.0 163.3 H424.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="352.0" y="141.0" font-size="11" font-weight="400" fill="#333333" text-anchor="start">video, home</text>
<text x="352.0" y="155.3" font-size="11" font-weight="400" fill="#333333" text-anchor="start">only</text>
<path d="M936.0 148.0 H1054.0" fill="none" stroke="#0084D6" stroke-width="2" marker-end="url(#m0084D6)"/>
<text x="944.0" y="125.0" font-size="11.5" font-weight="700" fill="#0084D6" text-anchor="start"><tspan font-weight="700">text only: events,</tspan></text>
<text x="944.0" y="140.0" font-size="11.5" font-weight="700" fill="#0084D6" text-anchor="start"><tspan font-weight="700">alerts</tspan></text>
<path d="M1064.0 268.6 H946.0" fill="none" stroke="#0084D6" stroke-width="2" marker-end="url(#m0084D6)"/>
<text x="944.0" y="285.6" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">requests, commands,</text>
<text x="944.0" y="300.6" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">encrypted photos</text>
<path d="M936.0 533.5 H1054.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="944.0" y="525.5" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">door, as today</text>
<path d="M936.0 621.1 H1054.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="944.0" y="613.1" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">phones on the Wi-Fi</text>
<path d="M1324.0 158.0 H1414.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="150.0" font-size="11" font-weight="400" fill="#333333" text-anchor="start">events, alerts</text>
<path d="M1424.0 258.6 H1334.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="274.6" font-size="11" font-weight="400" fill="#333333" text-anchor="start">app requests</text>
<path d="M1324.0 548.6 H1414.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="540.6" font-size="11" font-weight="400" fill="#333333" text-anchor="start">door, Wi-Fi</text>
<path d="M1424.0 625.9 H1334.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1331.0" y="641.9" font-size="11" font-weight="400" fill="#333333" text-anchor="start">MCP actions</text>
<text x="1331.0" y="656.2" font-size="11" font-weight="400" fill="#333333" text-anchor="start">after “Yes”</text>
<path d="M1820.0 168.0 H1716.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1714.0" y="145.7" font-size="11" font-weight="400" fill="#333333" text-anchor="start">sentences,</text>
<text x="1714.0" y="160.0" font-size="11" font-weight="400" fill="#333333" text-anchor="start">questions, “Yes”</text>
<path d="M1706.0 595.9 H1810.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1714.0" y="573.6" font-size="11" font-weight="400" fill="#333333" text-anchor="start">answers, alerts</text>
<text x="1714.0" y="587.9" font-size="11" font-weight="400" fill="#333333" text-anchor="start">(push)</text>
<rect x="20.0" y="834.6" width="650.7" height="132.2" rx="12" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.5"/>
<text x="36.0" y="864.4" font-size="14.5" font-weight="400" fill="#003399" text-anchor="start"><tspan font-weight="700">Costs of the chosen design (team estimates, 20 Nov)</tspan></text>
<text x="36.0" y="887.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Equipment, bought once: indoor camera ≈ €45; Raspberry Pi 5 ≈ €200; Jetson Orin Nano Super ≈ €345; or a</text>
<text x="36.0" y="905.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">router with an NPU, + €15 (an estimate). Over 5 years, €3.33 or €5.75 a month for the device.</text>
<text x="36.0" y="928.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Model energy: YOLOv8n below €0.01 a month; OWLv2 up to €0.72 at 12 h of motion a day (on a Jetson Orin</text>
<text x="36.0" y="946.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Nano).</text>
<rect x="694.7" y="834.6" width="650.7" height="132.2" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.5"/>
<text x="710.7" y="864.4" font-size="14.5" font-weight="400" fill="#C2410C" text-anchor="start"><tspan font-weight="700">Alternative evaluated, not chosen: vision on Altice’s L4 servers</tspan></text>
<text x="710.7" y="887.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Image regions sent to Altice’s L4 GPUs: ≈ €0.49 per home a month with 1 camera (document 17).</text>
<text x="710.7" y="911.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Not chosen: images would leave the home.</text>
<rect x="1369.3" y="834.6" width="650.7" height="132.2" rx="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.5"/>
<text x="1385.3" y="864.4" font-size="14.5" font-weight="400" fill="#C2410C" text-anchor="start"><tspan font-weight="700">Rejected: video or full frames to the cloud</tspan></text>
<text x="1385.3" y="887.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A continuous stream at 2 Mbps (assumption): 657 GB per camera a month and 1,000 Gbps at the peak with</text>
<text x="1385.3" y="905.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">500,000 cameras. Full frames during motion: €2.41 per home a month on Altice’s servers and €3.93 to €4.26</text>
<text x="1385.3" y="922.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">on hyperscaler GPUs on demand (document 17).</text>
<text x="1385.3" y="946.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">The whole picture of the home would leave it.</text>
<text x="20.0" y="996.7" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">A box paid for by Altice does not pay back at €3.99 a month (−€4.81 to −€6.90 per home a month, document 17): the model works with the AI on the router, or with equipment the customer buys.</text></svg>
