<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 723" width="1880" height="723" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Fluxos na aplicação"><title>Fluxos na aplicação</title><defs><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1880" height="723" fill="#FFFFFF"/><rect x="40.0" y="30.0" width="180.0" height="104.7" rx="12" fill="#EEF1F6"/>
<text x="54.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Adicionar um objeto</tspan></text>
<rect x="266.0" y="30.0" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="280.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Separador</tspan><tspan font-weight="700" font-style="italic"> Things</tspan></text>
<text x="280.0" y="81.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">(+) “Adicionar objeto”</text>
<rect x="536.0" y="30.0" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="550.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">A procurar nas câmaras</tspan></text>
<text x="550.0" y="81.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Propostas do que as câmaras</text>
<text x="550.0" y="98.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">veem, ou um nome escrito</text>
<rect x="806.0" y="30.0" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="820.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Fotografias ou câmara</tspan></text>
<text x="820.0" y="81.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">6 a 8 fotografias com o telemóvel,</text>
<text x="820.0" y="98.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">ou mostrá-lo a uma câmara (8</text>
<text x="820.0" y="116.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">vistas diferentes)</text>
<rect x="1076.0" y="30.0" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1090.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Novo objeto</tspan></text>
<text x="1090.0" y="81.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">As vistas aprendidas e o nome;</text>
<text x="1090.0" y="98.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">“Guardar”</text>
<rect x="1346.0" y="30.0" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1360.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Criar um cenário?</tspan></text>
<text x="1360.0" y="81.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Propõe uma regra para o objeto:</text>
<text x="1360.0" y="98.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">“avisa-me se sair sem ele”</text>
<rect x="40.0" y="168.7" width="180.0" height="104.7" rx="12" fill="#EEF1F6"/>
<text x="54.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Adicionar uma</tspan></text>
<text x="54.0" y="216.7" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">pessoa</tspan></text>
<rect x="266.0" y="168.7" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="280.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Separador</tspan><tspan font-weight="700" font-style="italic"> Things</tspan></text>
<text x="280.0" y="219.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">(+) “Uma pessoa”</text>
<rect x="536.0" y="168.7" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="550.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Quem é?</tspan></text>
<text x="550.0" y="219.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Família ou Visita; o nome</text>
<rect x="806.0" y="168.7" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="820.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Consentimento</tspan></text>
<text x="820.0" y="219.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A própria pessoa aceita ser</text>
<text x="820.0" y="237.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">reconhecida; nada vem</text>
<text x="820.0" y="254.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">pré-selecionado</text>
<rect x="1076.0" y="168.7" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1090.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Vídeo do rosto</tspan></text>
<text x="1090.0" y="219.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Um vídeo curto com o telemóvel;</text>
<text x="1090.0" y="237.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">em casa,<tspan font-style="italic"> YuNet</tspan> e<tspan font-style="italic"> SFace</tspan> fazem até</text>
<text x="1090.0" y="254.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">8 padrões</text>
<rect x="1346.0" y="168.7" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1360.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Pessoa adicionada</tspan></text>
<text x="1360.0" y="219.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Os padrões ficam só em casa; a</text>
<text x="1360.0" y="237.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">aplicação mostra o nome</text>
<rect x="1616.0" y="168.7" width="224.0" height="104.7" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1630.0" y="196.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Sugestão</tspan></text>
<text x="1630.0" y="219.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">“Tocar o alarme quando entrar</text>
<text x="1630.0" y="237.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">alguém que não seja da família?”</text>
<rect x="40.0" y="307.3" width="180.0" height="87.2" rx="12" fill="#EEF1F6"/>
<text x="54.0" y="335.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Cenário a partir de</tspan></text>
<text x="54.0" y="355.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">uma frase</tspan></text>
<rect x="266.0" y="307.3" width="224.0" height="87.2" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="280.0" y="335.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Botão do assistente</tspan></text>
<text x="280.0" y="358.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Em qualquer separador</text>
<rect x="536.0" y="307.3" width="224.0" height="87.2" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="550.0" y="335.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">A frase</tspan></text>
<text x="550.0" y="358.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">“Avisa-me se sair de casa sem o</text>
<text x="550.0" y="376.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">livro”</text>
<rect x="806.0" y="307.3" width="224.0" height="87.2" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="820.0" y="335.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">A regra em palavras simples</tspan></text>
<text x="820.0" y="358.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">O que observa, quando avisa, o</text>
<text x="820.0" y="376.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">que faz e a escolha para a sirene</text>
<rect x="1076.0" y="307.3" width="224.0" height="87.2" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1090.0" y="335.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">“Guardar”</tspan></text>
<text x="1090.0" y="358.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A regra passa a correr na Altice, a</text>
<text x="1090.0" y="376.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">cada evento</text>
<rect x="1346.0" y="307.3" width="224.0" height="87.2" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1360.0" y="335.1" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Cenários</tspan></text>
<text x="1360.0" y="358.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Aparece ao lado dos cenários que</text>
<text x="1360.0" y="376.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">já existem</text>
<rect x="40.0" y="428.5" width="180.0" height="104.6" rx="12" fill="#EEF1F6"/>
<text x="54.0" y="456.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Cenário sugerido</tspan></text>
<rect x="266.0" y="428.5" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="280.0" y="456.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Sugestão</tspan></text>
<text x="280.0" y="479.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Depois de adicionar uma pessoa,</text>
<text x="280.0" y="497.2" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">ou pelo perfil da casa (criança,</text>
<text x="280.0" y="514.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">cão, gato)</text>
<rect x="536.0" y="428.5" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="550.0" y="456.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">A regra proposta</tspan></text>
<text x="550.0" y="479.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Em palavras simples, já compilada</text>
<rect x="806.0" y="428.5" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="820.0" y="456.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Um toque</tspan></text>
<text x="820.0" y="479.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">“Ativar”</text>
<rect x="1076.0" y="428.5" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1090.0" y="456.2" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Cenários</tspan></text>
<text x="1090.0" y="479.7" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Aparece com os outros cenários</text>
<rect x="40.0" y="567.1" width="180.0" height="104.6" rx="12" fill="#EEF1F6"/>
<text x="54.0" y="594.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aviso com ações</tspan></text>
<rect x="266.0" y="567.1" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="280.0" y="594.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Notificação</tspan></text>
<text x="280.0" y="618.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Pelo serviço de notificações da</text>
<text x="280.0" y="635.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">aplicação</text>
<rect x="536.0" y="567.1" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="550.0" y="594.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aviso</tspan></text>
<text x="550.0" y="618.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Título, mensagem, miniatura e o</text>
<text x="550.0" y="635.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">que o motivou; a faixa da porta,</text>
<text x="550.0" y="653.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">quando é o caso</text>
<rect x="806.0" y="567.1" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="820.0" y="594.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Cartões de ação</tspan></text>
<text x="820.0" y="618.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Um “Sim” por ação: desligar as</text>
<text x="820.0" y="635.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">luzes, desligar o ar condicionado,</text>
<text x="820.0" y="653.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">tocar a sirene</text>
<rect x="1076.0" y="567.1" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2"/>
<text x="1090.0" y="594.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Ação feita</tspan></text>
<text x="1090.0" y="618.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">O “Sim” vira uma chamada MCP;</text>
<text x="1090.0" y="635.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">o aviso mostra o resultado</text>
<rect x="1346.0" y="567.1" width="224.0" height="104.6" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1360.0" y="594.9" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Pessoa desconhecida</tspan></text>
<text x="1360.0" y="618.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Também “Ligar à polícia (112)”:</text>
<text x="1360.0" y="635.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">abre a chamada e quem liga é a</text>
<text x="1360.0" y="653.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">pessoa</text>
