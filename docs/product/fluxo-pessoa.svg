<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1319" width="1200" height="1319" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Adicionar uma pessoa, com consentimento"><title>Adicionar uma pessoa, com consentimento</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1319" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1307" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="444.0" y1="84" x2="444.0" y2="1307" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="756.0" y1="84" x2="756.0" y2="1307" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1307" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="307.5" y="118.0" width="273.0" height="17" fill="#FFF"/><text x="444.0" y="131.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">convite: Ana, adulta; pedir para a reconhecer</text><line x1="137.0" y1="144.0" x2="741.0" y2="144.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="144.0" r="4.5" fill="#0084D6"/><rect x="524.1" y="170.0" width="151.7" height="17" fill="#FFF"/><text x="600.0" y="183.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">o convite, com o que se</text><rect x="522.6" y="187.0" width="154.8" height="17" fill="#FFF"/><text x="600.0" y="200.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">guarda, onde e para quê</text><line x1="751.0" y1="213.0" x2="459.0" y2="213.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="213.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="239.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="261.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">A Ana lê e escolhe. Nada vem pré-selecionado,</text><text x="444.0" y="279.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">e recusar não tem outra consequência</text><rect x="505.4" y="313.0" width="189.2" height="17" fill="#FFF"/><text x="600.0" y="326.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Aceito ser reconhecida”, com</text><rect x="518.0" y="330.0" width="163.9" height="17" fill="#FFF"/><text x="600.0" y="343.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">a hora e a versão do texto</text><line x1="449.0" y1="356.0" x2="741.0" y2="356.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="356.0" r="4.5" fill="#0084D6"/><rect x="586.0" y="382.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="756.0" y="404.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Guarda o registo do consentimento,</text><text x="756.0" y="422.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">nunca dados biométricos</text><rect x="795.3" y="456.0" width="233.3" height="17" fill="#FFF"/><text x="912.0" y="469.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">inscrever a Ana na câmara da Entrada</text><line x1="761.0" y1="482.0" x2="1053.0" y2="482.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="482.0" r="4.5" fill="#0084D6"/><rect x="848.0" y="508.0" width="340.0" height="70" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="530.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">A Ana vira a cabeça em frente à câmara</text><text x="1018.0" y="548.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">durante 10 s. O padrão facial fica cifrado,</text><text x="1018.0" y="566.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">só em casa, e as imagens são apagadas</text><rect x="834.0" y="600.0" width="156.0" height="17" fill="#FFF"/><text x="912.0" y="613.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">inscrição concluída, sem</text><rect x="844.6" y="617.0" width="134.9" height="17" fill="#FFF"/><text x="912.0" y="630.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">imagens nem padrão</text><line x1="1063.0" y1="643.0" x2="771.0" y2="643.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="643.0" r="4.5" fill="#0084D6"/><rect x="513.9" y="669.0" width="172.1" height="17" fill="#FFF"/><text x="600.0" y="682.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Passas a ser reconhecida”</text><line x1="751.0" y1="695.0" x2="459.0" y2="695.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="695.0" r="4.5" fill="#0084D6"/><rect x="342.4" y="721.0" width="203.2" height="17" fill="#FFF"/><text x="444.0" y="734.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“A Ana passa a ser reconhecida”</text><line x1="751.0" y1="747.0" x2="147.0" y2="747.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="747.0" r="4.5" fill="#0084D6"/><rect x="10" y="773.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="794.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Mais tarde, alguém entra em casa</text><rect x="848.0" y="829.0" width="340.0" height="70" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="851.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Compara o rosto com os padrões da</text><text x="1018.0" y="869.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">casa; um rosto sem correspondência</text><text x="1018.0" y="887.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">é descartado na própria análise</text><rect x="789.3" y="921.0" width="245.4" height="17" fill="#FFF"/><text x="912.0" y="934.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">evento “A Ana chegou”, só com o nome</text><line x1="1063.0" y1="947.0" x2="771.0" y2="947.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="947.0" r="4.5" fill="#0084D6"/><rect x="10" y="973.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="994.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Se a Ana retirar o consentimento</text><rect x="512.5" y="1029.0" width="175.0" height="17" fill="#FFF"/><text x="600.0" y="1042.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Deixar de ser reconhecida”</text><line x1="449.0" y1="1055.0" x2="741.0" y2="1055.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1055.0" r="4.5" fill="#0084D6"/><rect x="818.5" y="1081.0" width="187.0" height="17" fill="#FFF"/><text x="912.0" y="1094.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">apagar o padrão facial da Ana</text><line x1="761.0" y1="1107.0" x2="1053.0" y2="1107.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="1107.0" r="4.5" fill="#0084D6"/><rect x="840.6" y="1133.0" width="142.8" height="17" fill="#FFF"/><text x="912.0" y="1146.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">apagado: confirmação</text><line x1="1063.0" y1="1159.0" x2="771.0" y2="1159.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1159.0" r="4.5" fill="#0084D6"/><rect x="586.0" y="1185.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="756.0" y="1207.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Registo de auditoria: a retirada e o</text><text x="756.0" y="1225.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">apagamento, sem dados biométricos</text><rect x="10" y="1259.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="1280.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Para uma criança, consente quem tem a responsabilidade parental, na sua própria aplicação</text><rect x="22.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Administrador</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">aplicação do Rui</text><rect x="334.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="444.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Pessoa convidada</text><text x="444.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">aplicação da Ana</text><rect x="646.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="756.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço <tspan font-style="italic">ThingTracker</tspan></text><text x="756.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">plataforma Altice</text><rect x="958.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço local</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">em casa, junto da câmara</text></svg>
