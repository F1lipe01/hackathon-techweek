<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1209" width="1200" height="1209" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="A linha do tempo da casa, do evento invulgar à exportação"><title>A linha do tempo da casa, do evento invulgar à exportação</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1209" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1197" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="444.0" y1="84" x2="444.0" y2="1197" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="756.0" y1="84" x2="756.0" y2="1197" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1197" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="10" y="118.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="139.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">4h02, na noite em que a casa da vizinha é assaltada</text><rect x="848.0" y="174.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="196.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Movimento e latido na Entrada 1, a uma hora</text><text x="1018.0" y="214.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">em que quase nunca há: evento invulgar</text><rect x="531.8" y="248.0" width="448.4" height="17" fill="#FFF"/><text x="756.0" y="261.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">evento invulgar: tipo, hora, câmara e recorte do Bobi; o som não é gravado</text><line x1="1063.0" y1="274.0" x2="459.0" y2="274.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="274.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="300.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="322.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Entra na linha do tempo como</text><text x="444.0" y="340.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“informação”: não acorda ninguém</text><rect x="10" y="374.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="395.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">De manhã, a vizinha conta o que aconteceu</text><rect x="205.3" y="430.0" width="165.4" height="17" fill="#FFF"/><text x="288.0" y="443.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“O que aconteceu às 4h?”</text><line x1="137.0" y1="456.0" x2="429.0" y2="456.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="456.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="482.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="504.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">O código traduz a pergunta: das</text><text x="444.0" y="522.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">3h45 às 4h15, todas as câmaras</text><rect x="646.5" y="556.0" width="219.0" height="17" fill="#FFF"/><text x="756.0" y="569.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">get_home_timeline, das 3h45 às 4h15</text><line x1="449.0" y1="582.0" x2="1053.0" y2="582.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="582.0" r="4.5" fill="#0084D6"/><rect x="647.8" y="608.0" width="216.5" height="17" fill="#FFF"/><text x="756.0" y="621.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">os eventos, em texto, e os recortes</text><line x1="1063.0" y1="634.0" x2="459.0" y2="634.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="634.0" r="4.5" fill="#0084D6"/><rect x="505.6" y="660.0" width="188.8" height="17" fill="#FFF"/><text x="600.0" y="673.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">as linhas de texto dos eventos</text><line x1="449.0" y1="686.0" x2="741.0" y2="686.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="686.0" r="4.5" fill="#0084D6"/><rect x="520.4" y="712.0" width="159.2" height="17" fill="#FFF"/><text x="600.0" y="725.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">resumo: “O Bobi ladrou e</text><rect x="504.8" y="729.0" width="190.5" height="17" fill="#FFF"/><text x="600.0" y="742.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">mexeu-se na entrada às 4h02”</text><line x1="751.0" y1="755.0" x2="459.0" y2="755.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="755.0" r="4.5" fill="#0084D6"/><rect x="172.2" y="781.0" width="231.7" height="17" fill="#FFF"/><text x="288.0" y="794.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">o resumo, com os recortes e as horas</text><line x1="439.0" y1="807.0" x2="147.0" y2="807.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="807.0" r="4.5" fill="#0084D6"/><rect x="12.0" y="833.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="182.0" y="855.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Fixa o evento, guardado até um ano,</text><text x="182.0" y="873.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">e partilha só a hora com a vizinha</text><rect x="190.3" y="907.0" width="195.4" height="17" fill="#FFF"/><text x="288.0" y="920.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Exportar para as autoridades”,</text><rect x="206.5" y="924.0" width="163.0" height="17" fill="#FFF"/><text x="288.0" y="937.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">confirmado por um adulto</text><line x1="137.0" y1="950.0" x2="429.0" y2="950.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="950.0" r="4.5" fill="#0084D6"/><rect x="643.2" y="976.0" width="225.6" height="17" fill="#FFF"/><text x="756.0" y="989.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">pedir os ficheiros originais do evento</text><line x1="449.0" y1="1002.0" x2="1053.0" y2="1002.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1002.0" r="4.5" fill="#0084D6"/><rect x="569.6" y="1028.0" width="372.8" height="17" fill="#FFF"/><text x="756.0" y="1041.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">recortes, resumos criptográficos e assinatura do equipamento</text><line x1="1063.0" y1="1054.0" x2="459.0" y2="1054.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1054.0" r="4.5" fill="#0084D6"/><rect x="214.2" y="1080.0" width="147.6" height="17" fill="#FFF"/><text x="288.0" y="1093.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">pacote: PDF e ficheiros</text><rect x="187.4" y="1097.0" width="201.3" height="17" fill="#FFF"/><text x="288.0" y="1110.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">verificáveis, ligação válida 7 dias</text><line x1="439.0" y1="1123.0" x2="147.0" y2="1123.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1123.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="1149.0" width="340.0" height="34" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="1171.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Registo de auditoria: quem exportou, o quê e quando</text><rect x="22.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Aplicação</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">telemóvel da família</text><rect x="334.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="444.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço <tspan font-style="italic">ThingTracker</tspan></text><text x="444.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">plataforma Altice</text><rect x="646.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="756.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Modelo de linguagem</text><text x="756.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">fornecedor sob contrato</text><rect x="958.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço local</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">em casa, junto da câmara</text></svg>
