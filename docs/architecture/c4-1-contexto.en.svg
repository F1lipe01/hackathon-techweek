<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 732" width="1580" height="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="C4, level 1: context"><title>C4, level 1: context</title><defs><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1580" height="732" fill="#FFFFFF"/><rect x="40.0" y="30.0" width="360.0" height="108.7" rx="12" fill="#FFFFFF" stroke="#003399" stroke-width="1.6"/>
<text x="54.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Family</tspan></text>
<text x="54.0" y="79.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[person]</text>
<text x="54.0" y="102.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Registers things and people, writes rules in one sentence,</text>
<text x="54.0" y="120.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">asks, and answers alerts</text>
<rect x="600.0" y="30.0" width="940.0" height="108.7" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="614.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="614.0" y="79.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system · on the phone]</text>
<text x="614.0" y="102.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">The app the family already uses, with a new Things tab and the assistant on every tab</text>
<rect x="40.0" y="268.6" width="360.0" height="167.1" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="54.0" y="296.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Kit cameras</tspan></text>
<text x="54.0" y="317.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system · in the home]</text>
<text x="54.0" y="341.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">RTSP video on the home network</text>
<rect x="600.0" y="268.6" width="360.0" height="167.1" rx="12" fill="#EAF4FC" stroke="#0084D6" stroke-width="2.4"/>
<text x="614.0" y="296.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">ThingTracker</tspan></text>
<text x="614.0" y="317.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[the system described]</text>
<text x="614.0" y="341.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Makes the camera a source of information: finds the</text>
<text x="614.0" y="358.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">registered things and people, knows who is home, and</text>
<text x="614.0" y="376.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">keeps rules written in one sentence</text>
<text x="614.0" y="399.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Two parts: the home agent, on the router, and the service</text>
<text x="614.0" y="417.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">with the vision, at Altice</text>
<rect x="1180.0" y="268.6" width="360.0" height="167.1" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="296.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Connected Home platform</tspan></text>
<text x="1194.0" y="317.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing system · Altice]</text>
<text x="1194.0" y="341.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Devices, scenarios, security and notifications; MCP server</text>
<text x="1194.0" y="358.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">with 18 tools</text>
<rect x="40.0" y="565.8" width="360.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#003399" stroke-width="1.6"/>
<text x="54.0" y="593.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Guest or stranger</tspan></text>
<text x="54.0" y="615.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[person]</text>
<text x="54.0" y="638.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Appears in the frames; without registration and consent,</text>
<text x="54.0" y="656.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">never gets a name</text>
<rect x="600.0" y="565.8" width="360.0" height="108.6" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="614.0" y="593.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Language and vision-language models</tspan></text>
<text x="614.0" y="615.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[the text model may be a provider under contract]</text>
<text x="614.0" y="638.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Compile sentences into rules and word answers; the judge</text>
<text x="614.0" y="656.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">rarely sees 2 to 3 s of an ambiguous moment</text>
<rect x="1180.0" y="565.8" width="360.0" height="108.6" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="593.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Router and kit sensors</tspan></text>
<text x="1194.0" y="615.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[existing systems · in the home]</text>
<text x="1194.0" y="638.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Wi-Fi with the Family phones; door sensor; light, plug and</text>
<text x="1194.0" y="656.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">siren</text>
<path d="M400.0 77.3 H590.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="408.0" y="55.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">uses it: registers, asks, writes rules,</text>
<text x="408.0" y="70.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">says “Yes”</text>
<path d="M600.0 91.3 H410.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="408.0" y="107.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">shows alerts and answers</text>
<path d="M788.0 138.7 V258.6" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="797.0" y="200.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">sentences, questions, photos,</text>
<text x="797.0" y="215.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">face video, “Yes”</text>
<path d="M772.0 268.6 V148.7" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="763.0" y="207.7" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">answers</text>
<path d="M1360.0 268.6 V148.7" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1369.0" y="207.7" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">notifications with the alerts</text>
<path d="M400.0 352.2 H590.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="408.0" y="330.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">video, read in the home by the</text>
<text x="408.0" y="345.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">agent on the router</text>
<path d="M960.0 345.2 H1170.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="968.0" y="323.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">MCP calls: actions after “Yes”, device</text>
<text x="968.0" y="338.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">reads; alerts</text>
<path d="M1180.0 359.2 H970.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="968.0" y="375.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">door and Wi-Fi events</text>
<path d="M788.0 435.8 V555.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="797.0" y="504.8" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">text; rarely, a short clip</text>
<path d="M772.0 565.8 V445.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="763.0" y="504.8" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">rules, answers, verdicts</text>
<path d="M1368.0 435.8 V555.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1377.0" y="504.8" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">commands: light, plug, siren</text>
<path d="M1352.0 565.8 V445.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1343.0" y="489.9" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">door open and closed;</text>
<text x="1343.0" y="504.9" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">phones on the Wi-Fi</text>
<text x="1343.0" y="519.9" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">(proposed tool)</text>
<path d="M220.0 565.8 V445.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="229.0" y="504.8" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">appears in the frames</text>
<text x="40.0" y="714.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">C4 notation (c4model.com), level 1. Blue: the system described; grey: existing systems; dark blue outline: people; dashed: may be outside Altice.</text></svg>
