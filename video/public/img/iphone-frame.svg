<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 2760" aria-hidden="true">
  <!-- iPhone 18 Pro style frame, drawn by IT-Porto. Our own artwork, built only from published proportions:
       screen 1206 x 2622 px (402 x 874 pt), outer corner radius ~18 % of the width, border ~3.6 %.
       The screen area (x 72, y 69, 1206 x 2622, radius 191) is transparent; the app shows through it. -->
  <defs>
    <linearGradient id="ti" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#55555a"/>
      <stop offset="0.025" stop-color="#2b2b2e"/>
      <stop offset="0.5" stop-color="#1e1e20"/>
      <stop offset="0.975" stop-color="#2b2b2e"/>
      <stop offset="1" stop-color="#55555a"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#232325"/>
      <stop offset="0.5" stop-color="#4c4c50"/>
      <stop offset="1" stop-color="#232325"/>
    </linearGradient>
    <mask id="screen">
      <rect width="1350" height="2760" fill="#fff"/>
      <rect x="72" y="69" width="1206" height="2622" rx="191" fill="#000"/>
    </mask>
  </defs>

  <!-- side buttons: action, volume up, volume down (left); side button (right) -->
  <g fill="url(#btn)">
    <rect x="13" y="580" width="18" height="124" rx="6"/>
    <rect x="13" y="797" width="18" height="202" rx="6"/>
    <rect x="13" y="1054" width="18" height="202" rx="6"/>
    <rect x="1319" y="867" width="18" height="320" rx="6"/>
  </g>

  <g mask="url(#screen)">
    <!-- titanium band -->
    <rect x="25" y="22" width="1300" height="2716" rx="238" fill="url(#ti)"/>
    <rect x="28.5" y="25.5" width="1293" height="2709" rx="234.5" fill="none" stroke="#7a7a80" stroke-opacity="0.5" stroke-width="3"/>
    <!-- black glass border around the display -->
    <rect x="40" y="37" width="1270" height="2686" rx="224" fill="#050506"/>
    <rect x="41.5" y="38.5" width="1267" height="2683" rx="222.5" fill="none" stroke="#2a2a2e" stroke-width="2"/>
  </g>

  <!-- antenna bands on the titanium -->
  <g fill="#47474b">
    <rect x="25" y="300" width="15" height="9"/>
    <rect x="1310" y="300" width="15" height="9"/>
    <rect x="25" y="2451" width="15" height="9"/>
    <rect x="1310" y="2451" width="15" height="9"/>
  </g>
</svg>
