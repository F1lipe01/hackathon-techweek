<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2260 964" width="2260" height="964" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="C4, level 2: containers"><title>C4, level 2: containers</title><defs><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="2260" height="964" fill="#FFFFFF"/><rect x="20.0" y="24.0" width="1040.0" height="888.6" rx="18" fill="#F4F4F4"/>
