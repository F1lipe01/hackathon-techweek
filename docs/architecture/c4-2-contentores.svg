<text x="40.0" y="1101.5" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Notação C4, nível 2. Contorno azul: contentores do<tspan font-style="italic"> ThingTracker</tspan>; cinzento: sistemas existentes. Cada seta é um sentido do fluxo, com o que leva.</text></svg>
