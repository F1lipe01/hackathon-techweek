<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1395" width="1200" height="1395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Adding a pet and learning its routine"><title>Adding a pet and learning its routine</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1395" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1383" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="444.0" y1="84" x2="444.0" y2="1383" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="756.0" y1="84" x2="756.0" y2="1383" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1383" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="169.3" y="118.0" width="237.4" height="17" fill="#FFF"/><text x="288.0" y="131.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">New pet: Mimi, a cat, “grey and tabby”</text><line x1="137.0" y1="144.0" x2="429.0" y2="144.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="144.0" r="4.5" fill="#0084D6"/><rect x="504.2" y="170.0" width="191.7" height="17" fill="#FFF"/><text x="600.0" y="183.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Mimi’s description, as text only</text><line x1="449.0" y1="196.0" x2="741.0" y2="196.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="196.0" r="4.5" fill="#0084D6"/><rect x="495.4" y="222.0" width="209.2" height="17" fill="#FFF"/><text x="600.0" y="235.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">detector query: “a grey tabby cat”</text><line x1="751.0" y1="248.0" x2="459.0" y2="248.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="248.0" r="4.5" fill="#0084D6"/><rect x="640.2" y="274.0" width="231.6" height="17" fill="#FFF"/><text x="756.0" y="287.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">learn Mimi: “a cat”, “a grey tabby cat”</text><line x1="449.0" y1="300.0" x2="1053.0" y2="300.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="300.0" r="4.5" fill="#0084D6"/><rect x="848.0" y="326.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="348.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">For 1 to 2 days, keeps the vector and crop of</text><text x="1018.0" y="366.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">every cat it sees and groups the similar ones</text><rect x="662.1" y="400.0" width="187.7" height="17" fill="#FFF"/><text x="756.0" y="413.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">4 crops from the largest group</text><line x1="1063.0" y1="426.0" x2="459.0" y2="426.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="426.0" r="4.5" fill="#0084D6"/><rect x="172.9" y="452.0" width="230.2" height="17" fill="#FFF"/><text x="288.0" y="465.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“I think I know Mimi now. Is this her?”</text><line x1="439.0" y1="478.0" x2="147.0" y2="478.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="478.0" r="4.5" fill="#0084D6"/><rect x="195.0" y="504.0" width="186.1" height="17" fill="#FFF"/><text x="288.0" y="517.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Yes”, and the food and water</text><rect x="201.4" y="521.0" width="173.1" height="17" fill="#FFF"/><text x="288.0" y="534.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">bowls marked on the image</text><line x1="137.0" y1="547.0" x2="429.0" y2="547.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="547.0" r="4.5" fill="#0084D6"/><rect x="637.9" y="573.0" width="236.2" height="17" fill="#FFF"/><text x="756.0" y="586.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">fingerprint confirmed; bowls registered</text><line x1="449.0" y1="599.0" x2="1053.0" y2="599.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="599.0" r="4.5" fill="#0084D6"/><rect x="10" y="625.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="646.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">For 14 days</text><rect x="848.0" y="681.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1018.0" y="703.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">A visit counts when the cat is</text><text x="1018.0" y="721.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">over the bowl for 20 s or more</text><rect x="628.9" y="755.0" width="254.3" height="17" fill="#FFF"/><text x="756.0" y="768.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">visits: bowl, start and duration, no images</text><line x1="1063.0" y1="781.0" x2="459.0" y2="781.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="781.0" r="4.5" fill="#0084D6"/><rect x="274.0" y="807.0" width="340.0" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="444.0" y="829.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Works out the routine with statistics:</text><text x="444.0" y="847.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">meals around 8:00 and 19:30</text><rect x="480.7" y="881.0" width="238.7" height="17" fill="#FFF"/><text x="600.0" y="894.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the routine and the chosen rule, as text</text><line x1="449.0" y1="907.0" x2="741.0" y2="907.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="907.0" r="4.5" fill="#0084D6"/><rect x="507.5" y="933.0" width="184.9" height="17" fill="#FFF"/><text x="600.0" y="946.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the wording of the suggestion</text><line x1="751.0" y1="959.0" x2="459.0" y2="959.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="756.0" cy="959.0" r="4.5" fill="#0084D6"/><rect x="198.3" y="985.0" width="179.4" height="17" fill="#FFF"/><text x="288.0" y="998.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Tell me if Mimi has not been</text><rect x="201.1" y="1002.0" width="173.8" height="17" fill="#FFF"/><text x="288.0" y="1015.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">to the food bowl by 21:00?”</text><line x1="439.0" y1="1028.0" x2="147.0" y2="1028.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1028.0" r="4.5" fill="#0084D6"/><rect x="254.7" y="1054.0" width="66.7" height="17" fill="#FFF"/><text x="288.0" y="1067.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Turn on”</text><line x1="137.0" y1="1080.0" x2="429.0" y2="1080.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="1080.0" r="4.5" fill="#0084D6"/><rect x="638.7" y="1106.0" width="234.5" height="17" fill="#FFF"/><text x="756.0" y="1119.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">rule: no visit to the food bowl by 21:00</text><line x1="449.0" y1="1132.0" x2="1053.0" y2="1132.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1132.0" r="4.5" fill="#0084D6"/><rect x="10" y="1158.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="1179.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">On a day when Mimi does not show up</text><rect x="848.0" y="1214.0" width="340.0" height="34" rx="9" fill="#FFF7EC" stroke="#E8710A" stroke-width="1.2"/><text x="1018.0" y="1236.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Rules engine, at 21:00: no visit since 8:05</text><rect x="650.7" y="1270.0" width="210.7" height="17" fill="#FFF"/><text x="756.0" y="1283.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">rule met, with the crop of the bowl</text><line x1="1063.0" y1="1296.0" x2="459.0" y2="1296.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1296.0" r="4.5" fill="#0084D6"/><rect x="201.0" y="1322.0" width="174.1" height="17" fill="#FFF"/><text x="288.0" y="1335.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Alert: “Mimi has not been to</text><rect x="207.7" y="1339.0" width="160.6" height="17" fill="#FFF"/><text x="288.0" y="1352.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">the food bowl since 8:05”</text><line x1="439.0" y1="1365.0" x2="147.0" y2="1365.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="444.0" cy="1365.0" r="4.5" fill="#0084D6"/><rect x="22.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">App</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">the family's phone</text><rect x="334.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="444.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">ThingTracker service</text><text x="444.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Altice platform</text><rect x="646.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="756.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Language model</text><text x="756.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">provider under contract</text><rect x="958.0" y="20" width="220.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Edge service</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">in the home, by the camera</text></svg>
