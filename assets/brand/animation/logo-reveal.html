<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Things · logo reveal</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@600&display=block" rel="stylesheet">
<style>
  /* Themes. Every colour is an exact value taken from a source (see assets/brand/README.md). */
  :root, [data-theme="labs"] {
    --ground: #FFFFFF;
    --frame: #0084D6;   /* Altice Labs blue, alticelabs.com */
    --thing: #000000;   /* Altice Labs logo black */
    --word: #000000;
    --halo: #0084D6;
    --ui: #000000; --ui-ground: #F6F6F6; --ui-line: #DDDDDD;
  }
  [data-theme="labs-deep"] { --ground: #003399; --frame: #FFFFFF; --thing: #02A1EA; --word: #FFFFFF; --halo: #02A1EA; --ui: #FFFFFF; --ui-ground: #0A3FA3; --ui-line: #2A5BB8; }
  [data-theme="meo-blue"]  { --ground: #2E26FF; --frame: #FFFFFF; --thing: #00FF9D; --word: #FFFFFF; --halo: #00FF9D; --ui: #FFFFFF; --ui-ground: #3A33FF; --ui-line: #5A55FF; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ground);
    font-family: "Switzer", "Helvetica Neue", Arial, sans-serif;
    display: grid; grid-template-rows: minmax(0, 1fr) auto;
    height: 100svh; overflow: hidden;
  }

  /* The stage measures itself; the lockup is sized in JS to 72 % of its width and 40 % of its height,
     so it can never overflow, at any window size. */
  .stage { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; overflow: hidden; }
  .lockup { display: flex; align-items: center; gap: 0.3em; font-size: 100px; white-space: nowrap; }
  .mark-wrap { position: relative; width: 1.15em; height: 1.15em; flex: none; }
  .mark { position: relative; display: block; width: 100%; height: 100%; overflow: visible; }
  /* The 'found' ripple: an HTML layer animated with transform and opacity only, so the compositor runs it.
     Centred on the dot (35, 29 in the 64-unit mark; r = 8 -> 25 % of the mark). */
  .pulse { position: absolute; left: 42.1875%; top: 32.8125%; width: 25%; aspect-ratio: 1; border-radius: 50%;
           background: var(--halo); opacity: 0; will-change: transform, opacity; }
  .mark .frame { fill: none; stroke: var(--frame); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .mark .trail { fill: var(--frame); }
  .mark .dot { fill: var(--thing); }
  .mark .frame, .mark .trail, .mark .dot { transform-box: fill-box; transform-origin: center; }

  .word { display: flex; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: var(--word); }
  .ch { display: inline-block; white-space: pre; }

  /* Controls (hidden while exporting frames) */
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    padding: 14px 16px 18px; font: 500 15px/1.2 "Helvetica Neue", Arial, sans-serif; color: var(--ui);
  }
  .controls button, .controls select, .controls label {
    position: relative; font: inherit; color: var(--ui); background: var(--ui-ground);
    border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer;
    transition: background-color 160ms ease-out, transform 120ms ease-out;
  }
  .controls label input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .controls label:has(input:checked) { background: var(--ui); color: var(--ground); }
  .controls :is(button, select):active, .controls label:active { transform: scale(0.97); }
  .controls :is(button, select):focus-visible, .controls label:has(input:focus-visible) { outline: 2px solid var(--ui); outline-offset: 3px; }
  .controls .scrub { display: flex; align-items: center; gap: 8px; padding: 0 6px; }
  .controls .scrub input { width: min(260px, 60vw); accent-color: var(--frame); }
  .controls output { font-variant-numeric: tabular-nums; min-width: 5.5ch; text-align: right; }
  @media (hover: hover) and (pointer: fine) {
    .controls :is(button, select):hover, .controls label:hover { background: var(--ui-line); }
    .controls label:has(input:checked):hover { background: var(--ui); }
  }
  .export .controls { display: none; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="lockup" id="lockup" role="img" aria-label="Track Things">
    <div class="mark-wrap" id="markwrap">
    <span class="pulse" id="pulse"></span>
    <svg class="mark" id="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path class="frame" id="c1" d="M7 21 V12 Q7 7 12 7 H21"/>
      <path class="frame" id="c2" d="M43 7 H52 Q57 7 57 12 V21"/>
      <path class="frame" id="c3" d="M57 43 V52 Q57 57 52 57 H43"/>
      <path class="frame" id="c4" d="M7 43 V52 Q7 57 12 57 H21"/>
      <circle class="trail" id="t1" cx="19" cy="45" r="2.4" opacity="0.35"/>
      <circle class="trail" id="t2" cx="25.5" cy="38.5" r="3" opacity="0.6"/>
      <circle class="dot" id="dot" cx="35" cy="29" r="8"/>
    </svg>
    </div>
    <span class="word" id="word" aria-hidden="true"></span>
  </div>
</main>

<nav class="controls" aria-label="Animation controls">
  <button type="button" id="replay">Replay</button>
  <label><input type="radio" name="mode" value="expand" checked>Mark to wordmark</label>
  <label><input type="radio" name="mode" value="collapse">Wordmark to mark</label>
  <select id="theme" aria-label="Colours">
    <option value="labs">Altice Labs</option>
    <option value="labs-deep">Altice Labs, deep blue</option>
    <option value="meo-blue">MEO blue</option>
  </select>
  <span class="scrub"><label for="scrub" style="all:unset">Frame</label>
    <input type="range" id="scrub" min="0" max="3400" step="1" value="0" aria-label="Scrub through the animation">
    <output id="time">0 ms</output></span>
</nav>

<script>
/* One timeline, three uses:
   - live: Web Animations run normally;
   - scrub: the range input pauses everything and sets the time, for frame-by-frame review;
   - export (?export=1): paused, and window.renderAt(ms) sets the time, so render.mjs captures exact frames. */
(function () {
  const params = new URLSearchParams(location.search);
  const EXPORT = params.has('export');
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), lockup = $('lockup'), mark = $('markwrap'), word = $('word');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches && !EXPORT;

  // Strong curves from the animation guide: ease-out to enter or leave, ease-in-out to move on screen.
  const OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
  const IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)';
  const SETTLE = 'cubic-bezier(0.33, 0, 0.2, 1)';   // soft return after the pop

  const TEXT = 'Track Things';
  word.replaceChildren(...[...TEXT].map((c) => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; return s; }));
  const letters = [...word.children];

  let mode = params.get('mode') === 'collapse' ? 'collapse' : 'expand';
  let theme = params.get('theme') || 'labs';
  let anims = [];
  window.DURATION = 0;

  // Fit: the full lockup takes 72 % of the stage width and at most 40 % of its height.
  function fit() {
    lockup.style.fontSize = '100px';
    const w = lockup.getBoundingClientRect().width;
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const size = Math.max(12, Math.min((0.72 * sw / w) * 100, (0.40 * sh) / 1.15));
    lockup.style.fontSize = size.toFixed(2) + 'px';
  }

  function a(el, frames, opts) {
    const anim = el.animate(frames, Object.assign({ fill: 'both' }, opts));
    anims.push(anim);
    return anim;
  }

  function build() {
    anims.forEach((x) => x.cancel());
    anims = [];
    fit();
    // Distance from the mark's place in the lockup to the lockup's centre.
    const S = (lockup.getBoundingClientRect().width - mark.getBoundingClientRect().width) / 2;
    const centred = `translateX(${S}px)`, home = 'translateX(0px)';
    const n = letters.length;

    if (reduce) {
      a(lockup, [{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease' });
      if (mode === 'collapse') letters.forEach((l) => a(l, [{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'ease' }));
      window.DURATION = 200;
      return;
    }

    if (mode === 'expand') {
      // 1. The thing moves in, small, leaving its trail.
      a($('dot'), [
        { transform: 'translate(-16px, 16px) scale(0.6)', opacity: 0 },
        { opacity: 1, offset: 0.25 },
        { transform: 'translate(0px, 0px) scale(1)', opacity: 1 }
      ], { duration: 560, easing: OUT });
      a($('t1'), [{ opacity: 0, transform: 'scale(0.8)' }, { opacity: 0.35, transform: 'scale(1)' }], { delay: 90, duration: 260, easing: OUT });
      a($('t2'), [{ opacity: 0, transform: 'scale(0.8)' }, { opacity: 0.6, transform: 'scale(1)' }], { delay: 170, duration: 260, easing: OUT });

      // 2. The frame locks on, corner by corner, clockwise.
      const from = { c1: [-7, -7], c2: [7, -7], c3: [7, 7], c4: [-7, 7] };
      ['c1', 'c2', 'c3', 'c4'].forEach((id, i) => {
        const [x, y] = from[id];
        a($(id), [
          { transform: `translate(${x}px, ${y}px) scale(1.06)`, opacity: 0 },
          { transform: 'translate(0px, 0px) scale(1)', opacity: 1 }
        ], { delay: 380 + i * 45, duration: 520, easing: OUT });
      });

      // 3. Found: one pulse.
      a($('pulse'), [{ transform: 'scale(1)', opacity: 0.5 }, { transform: 'scale(3.2)', opacity: 0 }], { delay: 900, duration: 820, easing: OUT, fill: 'forwards' });
      a($('dot'), [{ transform: 'scale(1)', easing: OUT }, { transform: 'scale(1.18)', offset: 0.28, easing: SETTLE }, { transform: 'scale(1)' }], { delay: 900, duration: 520, fill: 'none' });

      // 4. The mark moves to its place; the word travels with it and its letters come out of the mark one by one.
      a(mark, [{ transform: centred }, { transform: home }], { delay: 1250, duration: 820, easing: IN_OUT });
      a(word, [{ transform: centred }, { transform: home }], { delay: 1250, duration: 820, easing: IN_OUT });
      letters.forEach((l, i) => a(l, [
        { opacity: 0, transform: 'translateX(-0.14em)' },
        { opacity: 1, transform: 'translateX(0em)' }
      ], { delay: 1360 + i * 34, duration: 420, easing: OUT }));
      window.DURATION = 3400;
    } else {
      // Reverse: the letters fold back into the mark, last letter first, and the mark returns to the centre.
      letters.forEach((l, i) => a(l, [
        { opacity: 1, transform: 'translateX(0em)' },
        { opacity: 0, transform: 'translateX(-0.14em)' }
      ], { delay: 300 + (n - 1 - i) * 26, duration: 300, easing: OUT }));
      a(mark, [{ transform: home }, { transform: centred }], { delay: 520, duration: 820, easing: IN_OUT });
      a(word, [{ transform: home }, { transform: centred }], { delay: 520, duration: 820, easing: IN_OUT });
      a($('pulse'), [{ transform: 'scale(1)', opacity: 0.5 }, { transform: 'scale(3.2)', opacity: 0 }], { delay: 1360, duration: 820, easing: OUT, fill: 'forwards' });
      a($('dot'), [{ transform: 'scale(1)', easing: OUT }, { transform: 'scale(1.18)', offset: 0.28, easing: SETTLE }, { transform: 'scale(1)' }], { delay: 1360, duration: 520, fill: 'none' });
      window.DURATION = 2500;
    }
    $('scrub').max = String(window.DURATION);
  }

  function setTime(ms) {
    anims.forEach((x) => { x.pause(); x.currentTime = ms; });
    $('scrub').value = String(ms);
    $('time').textContent = Math.round(ms) + ' ms';
  }

  function play() {
    build();
    if (EXPORT) { anims.forEach((x) => x.pause()); return; }
    const start = performance.now();
    const tick = () => {
      const t = Math.min(performance.now() - start, window.DURATION);
      $('scrub').value = String(t); $('time').textContent = Math.round(t) + ' ms';
      if (t < window.DURATION && !scrubbing) requestAnimationFrame(tick);
    };
    scrubbing = false;
    requestAnimationFrame(tick);
  }
  let scrubbing = false;

  // Export hook: set every animation to time ms and wait until the frame is painted.
  window.renderAt = (ms) => new Promise((resolve) => {
    anims.forEach((x) => { x.currentTime = ms; });
    requestAnimationFrame(() => requestAnimationFrame(resolve));
  });

  function applyTheme() { document.documentElement.dataset.theme = theme; $('theme').value = theme; }

  if (EXPORT) document.documentElement.classList.add('export');
  applyTheme();
  document.querySelector(`input[value="${mode}"]`).checked = true;

  $('replay').addEventListener('click', play);
  $('scrub').addEventListener('input', (e) => { scrubbing = true; setTime(Number(e.target.value)); });
  document.addEventListener('change', (e) => {
    if (e.target.name === 'mode') { mode = e.target.value; play(); }
    if (e.target.id === 'theme') { theme = e.target.value; applyTheme(); }
  });
  let rt;
  addEventListener('resize', () => { if (EXPORT) return; clearTimeout(rt); rt = setTimeout(play, 120); });

  // Wait for Switzer itself, not just the stylesheet, so the first frame is measured in the right font.
  Promise.all([document.fonts.load('600 100px Switzer'), document.fonts.ready]).then(() => { play(); window.READY = true; });
})();
</script>
</body>
</html>
