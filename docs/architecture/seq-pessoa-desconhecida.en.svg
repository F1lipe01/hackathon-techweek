<text x="700.0" y="159.7" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">State: EMPTY since 14:10 (no family phone on the Wi-Fi). Active rule: “Sound the alarm when someone who isn’t family comes in”, with the choice “ask first”.</text>
