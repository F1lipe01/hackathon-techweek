<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 732" width="1580" height="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="C4, nível 1: contexto"><title>C4, nível 1: contexto</title><defs><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1580" height="732" fill="#FFFFFF"/><rect x="40.0" y="30.0" width="360.0" height="108.7" rx="12" fill="#FFFFFF" stroke="#003399" stroke-width="1.6"/>
<text x="54.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Família</tspan></text>
<text x="54.0" y="79.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[pessoa]</text>
<text x="54.0" y="102.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Regista objetos e pessoas, escreve regras numa frase,</text>
<text x="54.0" y="120.3" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">pergunta e responde aos avisos</text>
<rect x="600.0" y="30.0" width="940.0" height="108.7" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="614.0" y="57.8" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Aplicação Altice</tspan></text>
<text x="614.0" y="79.3" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema existente · no telemóvel]</text>
<text x="614.0" y="102.8" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">A aplicação que a família já usa, com um novo separador<tspan font-style="italic"> Things</tspan> e o assistente em todos os separadores</text>
<rect x="40.0" y="268.6" width="360.0" height="167.1" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="54.0" y="296.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Câmaras do kit</tspan></text>
<text x="54.0" y="317.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema existente · em casa]</text>
<text x="54.0" y="341.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Vídeo RTSP na rede da casa</text>
<rect x="600.0" y="268.6" width="360.0" height="167.1" rx="12" fill="#EAF4FC" stroke="#0084D6" stroke-width="2.4"/>
<text x="614.0" y="296.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700" font-style="italic">ThingTracker</tspan></text>
<text x="614.0" y="317.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema descrito]</text>
<text x="614.0" y="341.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Torna a câmara uma fonte de informação: encontra os</text>
<text x="614.0" y="358.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">objetos registados e as pessoas, sabe quem está em casa</text>
<text x="614.0" y="376.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">e cumpre regras escritas numa frase</text>
<text x="614.0" y="399.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Duas partes: o agente da casa, no<tspan font-style="italic"> router</tspan>, e o serviço com</text>
<text x="614.0" y="417.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">a visão, na Altice</text>
<rect x="1180.0" y="268.6" width="360.0" height="167.1" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="296.4" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Plataforma Connected Home</tspan></text>
<text x="1194.0" y="317.9" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistema existente · Altice]</text>
<text x="1194.0" y="341.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Dispositivos, cenários, segurança e notificações; servidor</text>
<text x="1194.0" y="358.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">MCP com 18 ferramentas</text>
<rect x="40.0" y="565.8" width="360.0" height="108.6" rx="12" fill="#FFFFFF" stroke="#003399" stroke-width="1.6"/>
<text x="54.0" y="593.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Visita ou desconhecido</tspan></text>
<text x="54.0" y="615.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[pessoa]</text>
<text x="54.0" y="638.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Aparece nas imagens; sem registo nem consentimento,</text>
<text x="54.0" y="656.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">nunca recebe um nome</text>
<rect x="600.0" y="565.8" width="360.0" height="108.6" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="614.0" y="593.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Modelos de linguagem e de visão-linguagem</tspan></text>
<text x="614.0" y="615.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[o de texto pode ser de um fornecedor sob contrato]</text>
<text x="614.0" y="638.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Compilam frases em regras e redigem respostas; o juiz vê,</text>
<text x="614.0" y="656.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">raramente, 2 a 3 s de um momento duvidoso</text>
<rect x="1180.0" y="565.8" width="360.0" height="108.6" rx="12" fill="#F2F3F5" stroke="#B8BEC6" stroke-width="1.2"/>
<text x="1194.0" y="593.6" font-size="14.5" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700" font-style="italic">Router</tspan><tspan font-weight="700"> e sensores do kit</tspan></text>
<text x="1194.0" y="615.1" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">[sistemas existentes · em casa]</text>
<text x="1194.0" y="638.6" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">Wi-Fi com os telemóveis da Família; sensor da porta; luz,</text>
<text x="1194.0" y="656.1" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">tomada e sirene</text>
<path d="M400.0 77.3 H590.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="408.0" y="55.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">usa: regista, pergunta, escreve</text>
<text x="408.0" y="70.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">regras, diz “Sim”</text>
<path d="M600.0 91.3 H410.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="408.0" y="107.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">mostra avisos e respostas</text>
<path d="M788.0 138.7 V258.6" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="797.0" y="200.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">frases, perguntas, fotografias,</text>
<text x="797.0" y="215.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">vídeo do rosto, “Sim”</text>
<path d="M772.0 268.6 V148.7" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="763.0" y="207.7" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">respostas</text>
<path d="M1360.0 268.6 V148.7" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1369.0" y="207.7" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">notificações com os avisos</text>
<path d="M400.0 352.2 H590.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="408.0" y="330.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">vídeo, lido em casa pelo agente no</text>
<text x="408.0" y="345.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start"><tspan font-style="italic">router</tspan></text>
<path d="M960.0 345.2 H1170.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="968.0" y="323.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">chamadas MCP: ações após “Sim”,</text>
<text x="968.0" y="338.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">leitura dos dispositivos; avisos</text>
<path d="M1180.0 359.2 H970.0" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="968.0" y="375.2" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">eventos da porta e do Wi-Fi</text>
<path d="M788.0 435.8 V555.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="797.0" y="497.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">texto; raramente, um clipe</text>
<text x="797.0" y="512.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">curto</text>
<path d="M772.0 565.8 V445.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="763.0" y="504.8" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">regras, respostas, veredictos</text>
<path d="M1368.0 435.8 V555.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1377.0" y="497.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">comandos: luz, tomada,</text>
<text x="1377.0" y="512.3" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">sirene</text>
<path d="M1352.0 565.8 V445.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="1343.0" y="489.9" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">porta aberta e fechada;</text>
<text x="1343.0" y="504.9" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">telemóveis no Wi-Fi</text>
<text x="1343.0" y="519.9" font-size="11.5" font-weight="400" fill="#333333" text-anchor="end">(ferramenta proposta)</text>
<path d="M220.0 565.8 V445.8" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#m333333)"/>
<text x="229.0" y="504.8" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">aparece nas imagens</text>
<text x="40.0" y="714.4" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Notação C4 (c4model.com), nível 1. Azul: o sistema descrito; cinzento: sistemas existentes; contorno azul-escuro: pessoas; tracejado: pode ser externo à Altice.</text></svg>
