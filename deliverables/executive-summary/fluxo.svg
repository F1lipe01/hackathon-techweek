<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 232" width="1000" height="232" font-family="Lato, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- top band: a sentence creates a sensor -->
  <rect x="207.5" y="2" width="585" height="38" rx="6" fill="#F3F4F4" stroke="#BDBDBD" stroke-width="1.5"/>
  <text x="500" y="26" text-anchor="middle" font-size="14.5" fill="#2b2b2b"><tspan font-weight="700">Uma frase cria um sensor:</tspan> «avisa-me se o gato não beber água até às 18h»</text>

  <!-- bottom band: the MCP -->
  <rect x="415" y="192" width="585" height="38" rx="6" fill="#F3F4F4" stroke="#BDBDBD" stroke-width="1.5"/>
  <text x="707.5" y="216" text-anchor="middle" font-size="14.5" fill="#2b2b2b"><tspan font-weight="700">MCP da Cognitive Home</tspan>: estado da casa e ações nos dispositivos</text>

  <!-- boxes -->
  <g stroke="#4bd26c" stroke-width="2">
    <rect x="1" y="60" width="168" height="112" rx="8" fill="#fff"/>
    <rect x="208.5" y="60" width="168" height="112" rx="8" fill="#EAF9EE"/>
    <rect x="416" y="60" width="168" height="112" rx="8" fill="#fff"/>
    <rect x="623.5" y="60" width="168" height="112" rx="8" fill="#fff"/>
    <rect x="831" y="60" width="168" height="112" rx="8" fill="#fff"/>
  </g>

  <g text-anchor="middle" fill="#2b2b2b">
    <text x="85" y="93" font-size="19" font-weight="700">Ver</text>
    <text x="85" y="120" font-size="14.5" fill="#555">câmara da casa,</text>
    <text x="85" y="140" font-size="14.5" fill="#555">em tempo real</text>

    <text x="292.5" y="93" font-size="19" font-weight="700">Filtrar</text>
    <text x="292.5" y="120" font-size="14.5" fill="#555">máscaras de privacidade;</text>
    <text x="292.5" y="140" font-size="14.5" fill="#555">nada é gravado</text>

    <text x="500" y="93" font-size="19" font-weight="700">Perceber</text>
    <text x="500" y="120" font-size="14.5" fill="#555">modelos de visão</text>
    <text x="500" y="140" font-size="14.5" fill="#555">abertos, na casa</text>

    <text x="707.5" y="93" font-size="19" font-weight="700">Lembrar</text>
    <text x="707.5" y="120" font-size="14.5" fill="#555">objeto, local e hora,</text>
    <text x="707.5" y="140" font-size="14.5" fill="#555">sem guardar vídeo</text>

    <text x="915" y="93" font-size="19" font-weight="700">Agir</text>
    <text x="915" y="120" font-size="14.5" fill="#555">luz, tomada, alarme</text>
    <text x="915" y="140" font-size="14.5" fill="#555">e avisos</text>
  </g>

  <!-- arrows -->
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="173" y1="116" x2="204" y2="116"/>
    <line x1="380.5" y1="116" x2="411.5" y2="116"/>
    <line x1="588" y1="116" x2="619" y2="116"/>
    <line x1="795.5" y1="116" x2="826.5" y2="116"/>
    <!-- the sentence configures the understanding step -->
    <line x1="500" y1="42" x2="500" y2="57"/>
    <!-- understanding reads the home's state; acting goes through the MCP -->
    <line x1="500" y1="190" x2="500" y2="175"/>
    <line x1="915" y1="174" x2="915" y2="189"/>
  </g>
</svg>
