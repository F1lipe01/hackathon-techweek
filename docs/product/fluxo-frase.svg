<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1377" width="1200" height="1377" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Da frase às regras e aos avisos"><title>Da frase às regras e aos avisos</title><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#111"/></marker></defs><rect width="1200" height="1377" fill="#FFF"/><line x1="132.0" y1="84" x2="132.0" y2="1365" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="366.0" y1="84" x2="366.0" y2="1365" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="600.0" y1="84" x2="600.0" y2="1365" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="834.0" y1="84" x2="834.0" y2="1365" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1068.0" y1="84" x2="1068.0" y2="1365" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="176.3" y="118.0" width="145.4" height="17" fill="#FFF"/><text x="249.0" y="131.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Avisa-me se a criança</text><rect x="190.0" y="135.0" width="118.0" height="17" fill="#FFF"/><text x="249.0" y="148.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">estiver em perigo”</text><line x1="137.0" y1="161.0" x2="351.0" y2="161.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="161.0" r="4.5" fill="#0084D6"/><rect x="418.3" y="187.0" width="129.5" height="17" fill="#FFF"/><text x="483.0" y="200.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">frase, perfil da casa,</text><rect x="428.9" y="204.0" width="108.1" height="17" fill="#FFF"/><text x="483.0" y="217.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle"><tspan font-style="italic">things</tspan>, câmaras,</text><rect x="410.2" y="221.0" width="145.7" height="17" fill="#FFF"/><text x="483.0" y="234.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">dispositivos e catálogo</text><rect x="403.1" y="238.0" width="159.9" height="17" fill="#FFF"/><text x="483.0" y="251.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">de deteções, só em texto</text><line x1="371.0" y1="264.0" x2="585.0" y2="264.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="264.0" r="4.5" fill="#0084D6"/><rect x="406.9" y="290.0" width="152.2" height="17" fill="#FFF"/><text x="483.0" y="303.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">plano: as regras e o que</text><rect x="418.6" y="307.0" width="128.8" height="17" fill="#FFF"/><text x="483.0" y="320.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">não consegue vigiar</text><line x1="595.0" y1="333.0" x2="381.0" y2="333.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="600.0" cy="333.0" r="4.5" fill="#0084D6"/><rect x="202.2" y="359.0" width="327.6" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="366.0" y="381.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Valida cada regra: deteções do catálogo, câmaras</text><text x="366.0" y="399.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">e dispositivos que existem, ações permitidas</text><rect x="178.5" y="433.0" width="140.9" height="17" fill="#FFF"/><text x="249.0" y="446.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">o plano em linguagem</text><rect x="172.9" y="450.0" width="152.2" height="17" fill="#FFF"/><text x="249.0" y="463.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">corrente, para confirmar</text><line x1="361.0" y1="476.0" x2="147.0" y2="476.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="476.0" r="4.5" fill="#0084D6"/><rect x="12.0" y="502.0" width="292.5" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="158.2" y="524.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">O utilizador escolhe as regras,</text><text x="158.2" y="542.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">os horários e quem é avisado</text><rect x="189.2" y="576.0" width="119.6" height="17" fill="#FFF"/><text x="249.0" y="589.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Ativar em ensaio”</text><line x1="137.0" y1="602.0" x2="351.0" y2="602.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="602.0" r="4.5" fill="#0084D6"/><rect x="454.1" y="628.0" width="291.9" height="17" fill="#FFF"/><text x="600.0" y="641.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">post_new_scenario, com o acionador thingTracker</text><line x1="371.0" y1="654.0" x2="819.0" y2="654.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="654.0" r="4.5" fill="#0084D6"/><rect x="876.5" y="680.0" width="149.0" height="17" fill="#FFF"/><text x="951.0" y="693.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">condições e pesquisas:</text><rect x="861.8" y="697.0" width="178.4" height="17" fill="#FFF"/><text x="951.0" y="710.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“a knife”, “a stove”, “a child”</text><line x1="839.0" y1="723.0" x2="1053.0" y2="723.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="834.0" cy="723.0" r="4.5" fill="#0084D6"/><rect x="895.5" y="749.0" width="292.5" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="1041.8" y="771.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Ensaio de 48 h: regista o</text><text x="1041.8" y="789.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">que teria avisado, sem avisar</text><rect x="609.4" y="823.0" width="215.2" height="17" fill="#FFF"/><text x="717.0" y="836.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">o que teria avisado, com as provas</text><line x1="1063.0" y1="849.0" x2="381.0" y2="849.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="849.0" r="4.5" fill="#0084D6"/><rect x="196.9" y="875.0" width="104.2" height="17" fill="#FFF"/><text x="249.0" y="888.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">“Teria avisado 3</text><rect x="180.2" y="892.0" width="137.7" height="17" fill="#FFF"/><text x="249.0" y="905.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">vezes. Estava certo?”</text><line x1="361.0" y1="918.0" x2="147.0" y2="918.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="918.0" r="4.5" fill="#0084D6"/><rect x="176.8" y="944.0" width="144.4" height="17" fill="#FFF"/><text x="249.0" y="957.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">as respostas e “Ativar”</text><line x1="137.0" y1="970.0" x2="351.0" y2="970.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="132.0" cy="970.0" r="4.5" fill="#0084D6"/><rect x="10" y="996.0" width="1180" height="32" rx="7" fill="#EEF3FB"/><text x="600.0" y="1017.0" font-size="13.5" font-weight="400" fill="#003399" text-anchor="middle" font-style="italic">Mais tarde, na cozinha</text><rect x="895.5" y="1052.0" width="292.5" height="52" rx="9" fill="#FFF7EC" stroke="#E8710A" stroke-width="1.2"/><text x="1041.8" y="1074.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Motor de regras: a criança</text><text x="1041.8" y="1092.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">está junto ao fogão há 5 s</text><rect x="594.8" y="1126.0" width="244.4" height="17" fill="#FFF"/><text x="717.0" y="1139.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">regra cumprida, com o recorte do fogão</text><line x1="1063.0" y1="1152.0" x2="381.0" y2="1152.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="1068.0" cy="1152.0" r="4.5" fill="#0084D6"/><rect x="464.8" y="1178.0" width="270.4" height="17" fill="#FFF"/><text x="600.0" y="1191.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">update_device_capabilities: lâmpada vermelha</text><line x1="371.0" y1="1204.0" x2="819.0" y2="1204.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="1204.0" r="4.5" fill="#0084D6"/><rect x="182.4" y="1230.0" width="133.3" height="17" fill="#FFF"/><text x="249.0" y="1243.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">aviso urgente, com a</text><rect x="170.0" y="1247.0" width="157.9" height="17" fill="#FFF"/><text x="249.0" y="1260.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">prova e “Tocar a sirene?”</text><line x1="361.0" y1="1273.0" x2="147.0" y2="1273.0" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="366.0" cy="1273.0" r="4.5" fill="#0084D6"/><rect x="12.0" y="1299.0" width="327.6" height="52" rx="9" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.2"/><text x="175.8" y="1321.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">Sem resposta em 2 min, segue para o segundo</text><text x="175.8" y="1339.0" font-size="13" font-weight="400" fill="#111" text-anchor="middle">contacto; a sirene só toca com um “sim”</text><rect x="23.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="132.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Aplicação</text><text x="132.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">telemóvel da família</text><rect x="257.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="366.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço <tspan font-style="italic">ThingTracker</tspan></text><text x="366.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">plataforma Altice</text><rect x="491.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="600.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Modelo de linguagem</text><text x="600.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">fornecedor sob contrato</text><rect x="725.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="834.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Servidor MCP e cenários</text><text x="834.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">plataforma Altice</text><rect x="959.0" y="20" width="218.0" height="64" rx="12" fill="#FFF" stroke="#D0D0D0" stroke-width="1.2"/><text x="1068.0" y="48.0" font-size="15" font-weight="700" fill="#111" text-anchor="middle">Serviço local</text><text x="1068.0" y="68.0" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">em casa, junto da câmara</text></svg>
