<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" style="white-space:pre"><rect width="680" height="327" fill="#FFFFFF"/><text x="20.0" y="38.0" font-size="19" font-weight="700" fill="#1F2328" text-anchor="start">Onde corre a IA decide o caso</text><text x="20.0" y="60.0" font-size="12.5" font-weight="400" fill="#56606C" text-anchor="start">Margem mensal por casa do serviço adicional, sem IVA, consoante onde funcionam os modelos de visão</text><text x="515.7" y="78.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="end">prejuízo</text><text x="531.7" y="78.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">lucro</text><text x="20.0" y="109.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">Equipamento já instalado</text><text x="20.0" y="125.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start"><tspan font-style="italic">router</tspan>, <tspan font-style="italic">gateway</tspan> ou câmara (E1)</text><text x="20.0" y="167.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">Caixa pequena com NPU</text><text x="20.0" y="183.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">cerca de 100 € por casa (E2)</text><text x="20.0" y="225.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">Caixa com GPU</text><text x="20.0" y="241.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">cerca de 300 € por casa (E3)</text><line x1="295.5" y1="88.0" x2="295.5" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="328.1" y1="88.0" x2="328.1" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><text x="328.1" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">−6 €</text><line x1="360.7" y1="88.0" x2="360.7" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="393.3" y1="88.0" x2="393.3" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><text x="393.3" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">−4 €</text><line x1="425.9" y1="88.0" x2="425.9" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="458.5" y1="88.0" x2="458.5" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><text x="458.5" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">−2 €</text><line x1="491.1" y1="88.0" x2="491.1" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="523.7" y1="88.0" x2="523.7" y2="257.0" stroke="#A3ACB7" stroke-width="1" shape-rendering="crispEdges"/><text x="523.7" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">0 €</text><line x1="556.3" y1="88.0" x2="556.3" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="588.9" y1="88.0" x2="588.9" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><text x="588.9" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">2 €</text><line x1="621.5" y1="88.0" x2="621.5" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="654.1" y1="88.0" x2="654.1" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><text x="654.1" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">4 €</text><text x="274.0" y="109.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="end">a 3,99 €</text><path d="M523.7 97.0H576.3Q580.3 97.0 580.3 101.0V109.0Q580.3 113.0 576.3 113.0H523.7Z" fill="#0084D6"/><text x="588.3" y="109.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">+1,74 €</text><text x="274.0" y="131.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="end">a 4,99 €</text><path