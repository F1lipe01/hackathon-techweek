<rect x="795.0" y="393.0" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="945.0" y="412.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">A porta abriu e fechou: OCUPADA → A SAIR.</text>
<text x="945.0" y="429.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Espera até T_saída (30 s na demonstração, 5 min</text>
<text x="945.0" y="446.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">em produção) por quem saiu</text>
<rect x="216.3" y="466.5" width="202.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="317.5" y="479.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">o telemóvel do Filipe saiu do Wi-Fi</text>
