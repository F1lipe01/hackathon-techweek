<text x="1035.0" y="846.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“Call the police (112)” opens the call on the</text>
<text x="1035.0" y="863.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">phone and the person places it. The system</text>
<text x="1035.0" y="880.9" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">never dials</text>
<rect x="12.0" y="918.9" width="1376.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="700.0" y="937.9" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">A family face (similarity ≥ 0.363): no alert, and UNSURE → OCCUPIED. Face not visible: the app asks “Someone is in Living room 1. Do you know them?”, with no alarm, and suggests 112 only if the answer is “no”.</text>
<text x="20.0" y="987.1" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Grey: in the home. Blue: Altice. Orange: the phone. Production timings are proposals, to tune in a pilot.</text></svg>
