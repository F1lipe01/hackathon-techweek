<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 313" width="680" height="313" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" style="white-space:pre"><rect width="680" height="313" fill="#FFFFFF"/><text x="20.0" y="38.0" font-size="19" font-weight="700" fill="#1F2328" text-anchor="start">About 19,000 MEO homes in the expected case</text><text x="20.0" y="60.0" font-size="12.5" font-weight="400" fill="#56606C" text-anchor="start">From MEO’s homes with fixed broadband to the homes that subscribe to the service</text><text x="20.0" y="91.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">MEO homes with fixed broadband</text><path d="M20.0 100.0H578.1Q582.1 100.0 582.1 104.0V116.0Q582.1 120.0 578.1 120.0H20.0Z" fill="#0084D6"/><text x="592.1" y="114.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">1.58 million</text><text x="20.0" y="149.5" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">Already use a connected-home system (23.99 %)</text><path d="M20.0 158.5H150.9Q154.9 158.5 154.9 162.5V174.5Q154.9 178.5 150.9 178.5H20.0Z" fill="#0084D6"/><text x="164.9" y="173.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">379 thousand</text><text x="20.0" y="208.0" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">Subscribe to the service (5 % of these homes)</text><path d="M20.0 217.0H23.4Q26.7 217.0 26.7 220.4V233.6Q26.7 237.0 23.4 237.0H20.0Z" fill="#0084D6"/><text x="36.7" y="231.5" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">about 19,000 homes · 1.2 % of MEO</text><text x="20.0" y="255.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">Range considered in the model: 2,700 to 52,000 homes</text><text x="20.0" y="283.0" font-size="10.5" font-weight="400" fill="#6B7480" text-anchor="start">Sources: ANACOM, Q4 2025 [D01]; Eurostat 2024, people who use a connected-home system in Portugal, used as a proxy for homes</text><text x="20.0" y="297.0" font-size="10.5" font-weight="400" fill="#6B7480" text-anchor="start">[D02]; take rate: team assumption, 2 to 10 % [B22]. Result: [D05].</text></svg>
