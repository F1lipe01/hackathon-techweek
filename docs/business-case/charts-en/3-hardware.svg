<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" style="white-space:pre"><rect width="680" height="327" fill="#FFFFFF"/><text x="20.0" y="38.0" font-size="19" font-weight="700" fill="#1F2328" text-anchor="start">Where the AI runs decides the case</text><text x="20.0" y="60.0" font-size="12.5" font-weight="400" fill="#56606C" text-anchor="start">Monthly margin per home of the add-on, net of VAT, by where the vision models run</text><text x="516.7" y="78.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="end">loss</text><text x="532.7" y="78.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">profit</text><text x="20.0" y="109.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">Hardware already in the home</text><text x="20.0" y="125.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">router, gateway or camera (E1)</text><text x="20.0" y="167.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">Small box with an NPU</text><text x="20.0" y="183.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">about €100 per home (E2)</text><text x="20.0" y="225.0" font-size="13" font-weight="700" fill="#1F2328" text-anchor="start">GPU-class box</text><text x="20.0" y="241.0" font-size="11.5" font-weight="400" fill="#56606C" text-anchor="start">about €300 per home (E3)</text><line x1="292.2" y1="88.0" x2="292.2" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="325.4" y1="88.0" x2="325.4" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><text x="325.4" y="271.0" font-size="11" font-weight="400" fill="#6B7480" text-anchor="middle">−€6</text><line x1="358.6" y1="88.0" x2="358.6" y2="257.0" stroke="#E6E9ED" stroke-width="1" shape-rendering="crispEdges"/><line x1="391.8" y1="88.0" x2="391.8" y2="257.0" stroke="#E6E9ED" str