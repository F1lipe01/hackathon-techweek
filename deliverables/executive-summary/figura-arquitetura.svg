<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" width="1000" height="352" font-family="Lato, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1.6 L10 5 L0 8.4 Z" fill="#6B7480"/></marker></defs><rect width="1000" height="352" fill="#FFF"/><rect x="0.0" y="0.0" width="552.0" height="352.0" rx="14" fill="#F4F5F7"/><rect x="572.0" y="0.0" width="226.0" height="352.0" rx="14" fill="#EEF3FB"/><rect x="812.0" y="0.0" width="188.0" height="352.0" rx="14" fill="#0A3FA3"/><text x="16.0" y="29.0" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start">Em casa</text><text x="86.7" y="29.0" font-size="14.5" font-weight="400" fill="#56606C" text-anchor="start">serviço local; a análise fica em casa</text><text x="588.0" y="29.0" font-size="17" font-weight="700" fill="#1F2328" text-anchor="start">Plataforma Altice</text><text x="828.0" y="29.0" font-size="16" font-weight="700" fill="#FFF" text-anchor="start">Modelo de linguagem</text><rect x="16.0" y="46.0" width="124.0" height="76.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="28.0" y="71.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Câmara</text><text x="28.0" y="92.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">1 a 2 imagens</text><text x="28.0" y="109.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">por segundo</text><rect x="170.0" y="46.0" width="210.0" height="76.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="182.0" y="71.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Modelos de visão</text><text x="182.0" y="92.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start"><tspan font-style="italic">open-source</tspan>: encontram</text><text x="182.0" y="109.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">objetos e lugares pelo nome</text><rect x="410.0" y="46.0" width="126.0" height="76.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="422.0" y="71.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Memória local</text><text x="422.0" y="92.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">o quê, onde e</text><text x="422.0" y="109.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">quando</text><rect x="16.0" y="150.0" width="364.0" height="76.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2" stroke-dasharray="5 4"/><text x="28.0" y="175.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Privacidade</text><text x="28.0" y="196.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">máscaras definidas pelo utilizador; imagens descartadas;</text><text x="28.0" y="213.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">sem vídeo guardado</text><rect x="410.0" y="150.0" width="126.0" height="76.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="422.0" y="175.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Regras</text><text x="422.0" y="196.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">avaliadas a cada</text><text x="422.0" y="213.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">segundo</text><rect x="16.0" y="254.0" width="520.0" height="82.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="28.0" y="278.0" font-size="15.5" font-weight="700" fill="#1F2328" text-anchor="start">Dispositivos do kit</text><image x="48.4" y="288.0" width="30.0" height="24" href="data:image/png;base64,"/><text x="63.4" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">câmara</text><image x="124.7" y="288.0" width="19.1" height="24" href="data:image/png;base64,"/><text x="134.3" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">lâmpada</text><image x="193.1" y="288.0" width="24.0" height="24" href="data:image/png;base64,"/><text x="205.1" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">tomada</text><image x="259.0" y="288.0" width="34.0" height="24" href="data:image/png;base64,"/><text x="276.0" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">central</text><image x="337.2" y="288.0" width="19.3" height="24" href="data:image/png;base64,"/><text x="346.9" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">porta</text><image x="397.8" y="288.0" width="39.8" height="24" href="data:image/png;base64,"/><text x="417.7" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">fumo</text><image x="476.6" y="288.0" width="24.0" height="24" href="data:image/png;base64,"/><text x="488.6" y="327.0" font-size="13" font-weight="400" fill="#56606C" text-anchor="middle">clima</text><rect x="588.0" y="46.0" width="172.0" height="76.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="600.0" y="71.0" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Aplicação Altice</text><text x="600.0" y="92.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">separador «Coisas»</text><rect x="588.0" y="150.0" width="172.0" height="76.0" rx="10" fill="#FFF" stroke="#0084D6" stroke-width="2"/><text x="600.0" y="175.0" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Serviço ThingTracker</text><text x="600.0" y="196.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">o único que chama o</text><text x="600.0" y="213.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">modelo</text><rect x="588.0" y="254.0" width="172.0" height="82.0" rx="10" fill="#FFF" stroke="#CFD5DC" stroke-width="1.2"/><text x="600.0" y="279.0" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Servidor MCP</text><text x="600.0" y="300.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">comandos e 4 novas</text><text x="600.0" y="317.0" font-size="13.5" font-weight="400" fill="#56606C" text-anchor="start">ferramentas</text><text x="828.0" y="68.0" font-size="14.5" font-weight="700" fill="#FFF" text-anchor="start">Claude ou equivalente,</text><text x="828.0" y="87.0" font-size="14.5" font-weight="700" fill="#FFF" text-anchor="start">sob contrato</text><text x="828.0" y="120.0" font-size="14" font-weight="400" fill="#FFF" text-anchor="start">Converte frases em</text><text x="828.0" y="137.5" font-size="14" font-weight="400" fill="#FFF" text-anchor="start">regras</text><text x="828.0" y="164.5" font-size="14" font-weight="400" fill="#FFF" text-anchor="start">Responde a perguntas</text><text x="828.0" y="191.5" font-size="14" font-weight="400" fill="#FFF" text-anchor="start">Avalia casos duvidosos</text><text x="828.0" y="222.5" font-size="13" font-weight="400" fill="#C9D6F0" text-anchor="start">Sem treino com os nossos</text><text x="828.0" y="239.0" font-size="13" font-weight="400" fill="#C9D6F0" text-anchor="start">dados; acordo de</text><text x="828.0" y="255.5" font-size="13" font-weight="400" fill="#C9D6F0" text-anchor="start">tratamento de dados</text><text x="828.0" y="312.0" font-size="13" font-weight="700" fill="#C9D6F0" text-anchor="start">Custo estimado</text><text x="828.0" y="332.0" font-size="14" font-weight="700" fill="#FFF" text-anchor="start">0,43 € por casa e por mês</text><line x1="143.0" y1="84.0" x2="158.0" y2="84.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><line x1="383.0" y1="84.0" x2="398.0" y2="84.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><line x1="473.0" y1="124.0" x2="473.0" y2="139.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><line x1="536.0" y1="182.0" x2="576.0" y2="182.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><line x1="588.0" y1="194.0" x2="548.0" y2="194.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="562.0" y="175.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="middle">eventos</text><text x="562.0" y="211.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="middle">regras</text><line x1="760.0" y1="182.0" x2="800.0" y2="182.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><line x1="812.0" y1="194.0" x2="772.0" y2="194.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="765.0" y="175.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">pedido</text><text x="765.0" y="211.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">resposta</text><line x1="668.0" y1="150.0" x2="668.0" y2="134.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="660.0" y="140.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="end">respostas</text><line x1="680.0" y1="122.0" x2="680.0" y2="138.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="688.0" y="140.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">pedidos</text><line x1="668.0" y1="254.0" x2="668.0" y2="238.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="660.0" y="244.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="end">resultados</text><line x1="680.0" y1="226.0" x2="680.0" y2="242.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="688.0" y="244.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="start">ações</text><line x1="585.0" y1="295.0" x2="548.0" y2="295.0" stroke="#6B7480" stroke-width="1.6" marker-end="url(#ah)"/><text x="562.0" y="286.0" font-size="11.5" font-weight="400" fill="#0084D6" text-anchor="middle">ações</text></svg>