<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 882" width="1350" height="882" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Sequence: an unknown person"><title>Sequence: an unknown person</title><defs><marker id="m111111" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#111111"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1350" height="882" fill="#FFFFFF"/><line x1="150.0" y1="83.175" x2="150.0" y2="827.575" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="460.0" y1="83.175" x2="460.0" y2="827.575" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="820.0" y1="83.175" x2="820.0" y2="827.575" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1165.0" y1="83.175" x2="1165.0" y2="827.575" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="32.0" y="20.0" width="236.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="44.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Camera</tspan></text>
<text x="44.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">Living room 1, home network</text>
<rect x="292.0" y="20.0" width="336.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="304.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Home device</tspan></text>
<text x="304.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">vision, faces with YuNet and SFace, rules</text>
<rect x="652.0" y="20.0" width="336.0" height="63.2" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="664.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice platform</tspan></text>
<text x="664.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">relay, notifications, MCP server</text>
<rect x="1012.0" y="20.0" width="306.0" height="63.2" rx="12" fill="#FFF6EA" stroke="#C9CED6" stroke-width="1.0"/>
<text x="1024.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="1024.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">on the phone</text>
<rect x="12.0" y="123.2" width="1326.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="675.0" y="142.2" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">State: EMPTY since 14:10 (no family phone on the Wi-Fi). Active rule: “Sound the alarm when someone who isn’t family comes in”, with the choice “ask first”.</text>
<rect x="187.3" y="163.9" width="235.5" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="305.0" y="176.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">RTSP frames, on the home network only</text>
<path d="M162.0 185.4 H446.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="150.0" cy="185.375" r="11" fill="#0084D6"/>
<text x="150.0" y="189.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<rect x="310.0" y="229.4" width="300.0" height="84.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="460.0" y="248.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Motion: the detector finds a person. YuNet finds</text>
<text x="460.0" y="265.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">the face inside their box; SFace gives 0.21</text>
<text x="460.0" y="282.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">against the closest template, below 0.363:</text>
<text x="460.0" y="299.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“unknown face”</text>
<rect x="310.0" y="337.4" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="460.0" y="356.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">3 consecutive analyses (about 3 s) with the same</text>
<text x="460.0" y="373.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">unknown face: EMPTY → UNSURE, and the rule</text>
<text x="460.0" y="390.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">is met</text>
<rect x="500.4" y="410.9" width="279.1" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="640.0" y="423.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">urgent alert, text only: “unknown, Living room 1”</text>
<path d="M472.0 432.4 H806.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="460.0" cy="432.375" r="11" fill="#0084D6"/>
<text x="460.0" y="436.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<rect x="840.7" y="458.9" width="303.6" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="992.5" y="471.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">push: “Someone who isn’t family is in Living room 1”</text>
<path d="M832.0 480.4 H1151.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="820.0" cy="480.375" r="11" fill="#0084D6"/>
<text x="820.0" y="484.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<rect x="1015.0" y="524.4" width="300.0" height="50.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="1165.0" y="543.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">The alert’s cards: “Sound the siren”, “Call the</text>
<text x="1165.0" y="560.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">police (112)” and “See live”</text>
<rect x="912.6" y="580.9" width="159.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="992.5" y="593.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“Yes” on “Sound the siren”</text>
<path d="M1153.0 602.4 H834.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="1165.0" cy="602.375" r="11" fill="#0084D6"/>
<text x="1165.0" y="606.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<rect x="284.2" y="628.9" width="401.5" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="485.0" y="641.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">MCP server, <tspan font-family="Menlo, monospace" font-size="11.2">update_device_capabilities</tspan>: camera <tspan font-family="Menlo, monospace" font-size="11.2">sirenSwitch</tspan> on</text>
<path d="M808.0 650.4 H164.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="820.0" cy="650.375" r="11" fill="#0084D6"/>
<text x="820.0" y="654.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<rect x="1015.0" y="694.4" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="1165.0" y="713.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“Call the police (112)” opens the call on the</text>
<text x="1165.0" y="730.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">phone and the person places it. The system</text>
<text x="1165.0" y="747.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">never dials</text>
<rect x="12.0" y="785.4" width="1326.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="675.0" y="804.4" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">A family face (similarity ≥ 0.363): no alert, and UNSURE → OCCUPIED. Face not visible: the app asks “Someone is in Living room 1. Do you know them?”, with no alarm, and suggests 112 only if the answer is “no”.</text>
<text x="20.0" y="853.6" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Grey: in the home. Blue: Altice. Orange: the phone. Production timings are proposals, to tune in a pilot.</text></svg>
