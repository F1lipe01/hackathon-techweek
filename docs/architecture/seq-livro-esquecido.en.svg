<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1120" width="1300" height="1120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Sequence: the book left behind"><title>Sequence: the book left behind</title><defs><marker id="m111111" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#111111"/></marker><marker id="m333333" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1.5 L10 5 L0 8.5 Z" fill="#333333"/></marker></defs><rect width="1300" height="1120" fill="#FFFFFF"/><line x1="190.0" y1="83.175" x2="190.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="485.0" y1="83.175" x2="485.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="775.0" y1="83.175" x2="775.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1110.0" y1="83.175" x2="1110.0" y2="1066.175" stroke="#D0D0D0" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="32.0" y="20.0" width="316.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="44.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Home device</tspan></text>
<text x="44.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">vision, memory and rules</text>
<rect x="372.0" y="20.0" width="226.0" height="63.2" rx="12" fill="#F4F4F4" stroke="#C9CED6" stroke-width="1.0"/>
<text x="384.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Door sensor and router</tspan></text>
<text x="384.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">in the home, on Altice</text>
<rect x="622.0" y="20.0" width="306.0" height="63.2" rx="12" fill="#EEF3FB" stroke="#C9CED6" stroke-width="1.0"/>
<text x="634.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice platform</tspan></text>
<text x="634.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">events, relay, notifications</text>
<rect x="952.0" y="20.0" width="316.0" height="63.2" rx="12" fill="#FFF6EA" stroke="#C9CED6" stroke-width="1.0"/>
<text x="964.0" y="45.3" font-size="14" font-weight="400" fill="#111111" text-anchor="start"><tspan font-weight="700">Altice app</tspan></text>
<text x="964.0" y="66.8" font-size="12.5" font-weight="400" fill="#555555" text-anchor="start">on the phone</text>
<rect x="12.0" y="123.2" width="1276.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="142.2" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">State: OCCUPIED (the book owner’s phone is on the Wi-Fi). The book was last seen on the desk in Living room 1, at 18:02.</text>
<rect x="532.0" y="163.9" width="196.0" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="176.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">door open (<tspan font-family="Menlo, monospace" font-size="11.2">sensorState:</tspan>&#160;<tspan font-family="Menlo, monospace" font-size="11.2">alarm</tspan>)</text>
<path d="M497.0 185.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="485.0" cy="185.375" r="11" fill="#0084D6"/>
<text x="485.0" y="189.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">1</tspan></text>
<rect x="367.6" y="211.9" width="229.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="224.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">door.opened</tspan>, as text, through the relay</text>
<path d="M763.0 233.4 H204.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="233.375" r="11" fill="#0084D6"/>
<text x="775.0" y="237.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">2</tspan></text>
<rect x="566.1" y="259.9" width="127.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="272.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">door closed, 8 s later</text>
<path d="M497.0 281.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="485.0" cy="281.375" r="11" fill="#0084D6"/>
<text x="485.0" y="285.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">3</tspan></text>
<rect x="440.3" y="307.9" width="84.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="320.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">door.closed</tspan></text>
<path d="M763.0 329.4 H204.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="329.375" r="11" fill="#0084D6"/>
<text x="775.0" y="333.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">4</tspan></text>
<rect x="40.0" y="373.4" width="300.0" height="67.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="190.0" y="392.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">The door opened and closed: OCCUPIED →</text>
<text x="190.0" y="409.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">LEAVING. Waits up to T_leave (10 s in the demo,</text>
<text x="190.0" y="426.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">5 min in production) for whoever left</text>
<rect x="520.5" y="446.9" width="219.0" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="630.0" y="459.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">the book owner’s phone left the Wi-Fi</text>
<path d="M497.0 468.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="485.0" cy="468.375" r="11" fill="#0084D6"/>
<text x="485.0" y="472.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">5</tspan></text>
<rect x="351.2" y="494.9" width="262.5" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="507.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="11.2">wifi.left</tspan>: the book owner (proposed event)</text>
<path d="M763.0 516.4 H204.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="516.375" r="11" fill="#0084D6"/>
<text x="775.0" y="520.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">6</tspan></text>
<rect x="40.0" y="560.4" width="300.0" height="84.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="190.0" y="579.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">A family member left: an active check of the</text>
<text x="190.0" y="596.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">book’s usual place, without waiting for motion.</text>
<text x="190.0" y="613.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Reads 3 frames of the desk, 1 a second, on the</text>
<text x="190.0" y="630.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">home network</text>
<rect x="40.0" y="668.4" width="300.0" height="84.0" rx="8" fill="#E6F2FB" stroke="#B9D7EE" stroke-width="1.0"/>
<text x="190.0" y="687.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">“Book” boxes and DINOv2 vectors, matched</text>
<text x="190.0" y="704.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">with the book’s 8 photos: 0.70 ≥ 0.62 in 3 of 3</text>
<text x="190.0" y="721.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">frames. Rule “tell me if I leave without my book”</text>
<text x="190.0" y="738.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">met, since 2 of 3 are enough</text>
<rect x="379.1" y="758.9" width="206.8" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="482.5" y="771.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">alert, text only: “book, desk, 18:02”</text>
<path d="M202.0 780.4 H761.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="190.0" cy="780.375" r="11" fill="#0084D6"/>
<text x="190.0" y="784.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">7</tspan></text>
<rect x="799.3" y="806.9" width="286.4" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="942.5" y="819.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">push: “Your book stayed at home, on the desk, at</text>
<rect x="919.2" y="823.9" width="46.6" height="17.0" rx="2" fill="#FFFFFF"/>
<text x="942.5" y="836.4" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">18:02”</text>
<path d="M787.0 845.4 H1096.0" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/>
<circle cx="775.0" cy="845.375" r="11" fill="#0084D6"/>
<text x="775.0" y="849.7" font-size="11.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">8</tspan></text>
<rect x="12.0" y="889.4" width="1276.0" height="50.4" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="908.4" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">If the book is seen in fewer than 2 of the 3 frames (half hidden, say), the rules engine may call the judge: an optional vision-language model on the home device looks at 2 to 3 s of the region and answers yes, no</text>
<text x="650.0" y="926.6" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">or unsure. “Yes” gives the alert; “no” does not; “unsure” makes the app ask the family, with no alarm. The images do not leave the home.</text>
<rect x="12.0" y="965.8" width="1276.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="984.8" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">An arrival (the door opens and closes and a phone joins the Wi-Fi) does not start the check.</text>
<rect x="12.0" y="1024.0" width="1276.0" height="32.2" rx="8" fill="#EEF1F6"/>
<text x="650.0" y="1043.0" font-size="13" font-weight="400" fill="#003399" text-anchor="middle">Without a door sensor, the same check starts when a family phone leaves the Wi-Fi (after T_phone, so later) or when a camera that sees the exit door sees someone leave through it.</text>
<text x="20.0" y="1092.2" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Grey: in the home. Blue: Altice. Orange: the phone. Production timings are proposals, to tune in a pilot.</text></svg>
