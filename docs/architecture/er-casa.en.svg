<text x="380.0" y="256.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start">One encrypted SQLite database on the router, kept by the home agent. It holds no images.</text>
<text x="380.0" y="279.5" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start"><tspan font-family="Menlo, monospace" font-size="11.2">face_template</tspan>: up to 8 templates per person registered with consent; they never leave the home and are deleted when the person withdraws consent.</text>
<text x="380.0" y="303.0" font-size="12.5" font-weight="400" fill="#333333" text-anchor="start"><tspan font-family="Menlo, monospace" font-size="11.2">outbox</tspan>: keeps events and labels while offline, never images; <tspan font-family="Menlo, monospace" font-size="11.2">setting</tspan> holds, for example, the 0.363 threshold.</text></svg>
